<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7">
<title>5essência</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg0: #F2F2F7;
  --bg1: rgba(255,255,255,0.72);
  --bg2: rgba(255,255,255,0.55);
  --bg3: rgba(255,255,255,0.35);
  --glass: rgba(255,255,255,0.78);
  --glass2: rgba(255,255,255,0.92);
  --border: rgba(0,0,0,0.08);
  --border2: rgba(0,0,0,0.14);
  --ink: #1C1C1E;
  --ink2: #3A3A3C;
  --ink3: #636366;
  --ink4: #AEAEB2;
  --ink5: #C7C7CC;
  --blue:   #007AFF;
  --green:  #34C759;
  --red:    #FF3B30;
  --orange: #FF9500;
  --purple: #AF52DE;
  --teal:   #5AC8FA;
  --indigo: #5856D6;
  --r: 10px;
  --r2: 16px;
  --r3: 20px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --sh: 0 2px 12px rgba(0,0,0,0.07), 0 1px 3px rgba(0,0,0,0.05);
  --sh2: 0 8px 32px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.06);
  --sh3: 0 20px 60px rgba(0,0,0,0.18), 0 4px 16px rgba(0,0,0,0.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg0);color:var(--ink);font-family:var(--font);font-size:13px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased;}

/* ── WALLPAPER ── */
body::before {
  content:'';position:fixed;inset:0;z-index:-1;
  background: linear-gradient(135deg, #E8EAF0 0%, #F2F2F7 40%, #EAE8F0 100%);
}
body::after {
  content:'';position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(ellipse 60% 50% at 20% 20%, rgba(0,122,255,0.06) 0%, transparent 70%),
    radial-gradient(ellipse 50% 60% at 80% 80%, rgba(175,82,222,0.05) 0%, transparent 70%),
    radial-gradient(ellipse 40% 40% at 60% 30%, rgba(52,199,89,0.04) 0%, transparent 60%);
}

/* ── LOGIN ── */
#login-screen {
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:9000;
  background:linear-gradient(135deg,#1C1C2E 0%,#2C2C3E 50%,#1A1A2E 100%);
}
#login-screen::before {
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 70% 60% at 30% 40%,rgba(0,122,255,0.15) 0%,transparent 70%),
             radial-gradient(ellipse 50% 50% at 75% 70%,rgba(175,82,222,0.12) 0%,transparent 60%);
}
.login-box {
  position:relative;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:24px;
  padding:48px 44px;
  width:100%;max-width:380px;
  box-shadow:0 32px 80px rgba(0,0,0,0.4),0 4px 16px rgba(0,0,0,0.2);
}
.login-icon {
  width:88px;height:88px;border-radius:22px;
  background:#1C1C1E;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 20px;overflow:hidden;
  box-shadow:0 8px 24px rgba(0,0,0,0.5);
}
.login-title {
  font-size:22px;font-weight:600;color:#fff;text-align:center;margin-bottom:4px;letter-spacing:-0.3px;
}
.login-sub { font-size:13px;color:rgba(255,255,255,0.45);text-align:center;margin-bottom:32px; }
.login-err {
  background:rgba(255,59,48,0.15);border:1px solid rgba(255,59,48,0.3);
  border-radius:10px;padding:10px 14px;font-size:12.5px;color:#FF6B6B;
  margin-bottom:14px;display:none;text-align:center;
}
.login-err.show{display:block;}
.login-fg { margin-bottom:12px; }
.login-fg label { display:block;font-size:11px;font-weight:500;color:rgba(255,255,255,0.5);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:6px; }
.login-fg input {
  width:100%;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;padding:12px 16px;color:#fff;font-family:var(--font);font-size:14px;
  outline:none;transition:all 0.15s;
}
.login-fg input::placeholder{color:rgba(255,255,255,0.25);}
.login-fg input:focus{border-color:rgba(0,122,255,0.6);background:rgba(255,255,255,0.1);box-shadow:0 0 0 3px rgba(0,122,255,0.15);}
.login-btn {
  width:100%;margin-top:20px;padding:13px;border:none;border-radius:12px;
  background:linear-gradient(135deg,#007AFF,#5856D6);color:#fff;
  font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;
  transition:all 0.15s;letter-spacing:-0.1px;
  box-shadow:0 4px 16px rgba(0,122,255,0.4);
}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(0,122,255,0.5);}
.login-btn:active{transform:translateY(0);}
.login-btn:disabled{opacity:0.6;transform:none;}

/* ── APP ── */
.app{display:flex;height:100vh;}

/* ── SIDEBAR ── */
.sidebar {
  width:240px;min-width:240px;
  background:var(--glass);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  box-shadow:1px 0 0 rgba(255,255,255,0.8) inset;
}
.logo-wrap {
  padding:20px 20px 16px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;
}
.logo-icon {
  width:36px;height:36px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(135deg,#007AFF,#5856D6);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;
  box-shadow:0 2px 8px rgba(0,122,255,0.3);
}
.logo-text {}
.logo-name{font-size:15px;font-weight:600;letter-spacing:-0.3px;color:var(--ink);}
.logo-sub{font-size:11px;color:var(--ink4);margin-top:1px;}

.nav{flex:1;padding:10px 10px;overflow-y:auto;}
.nav-section{padding:14px 10px 4px;font-size:10.5px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink4);}
.nav-item {
  display:flex;align-items:center;gap:10px;
  padding:8px 12px;border-radius:10px;cursor:pointer;
  color:var(--ink3);font-size:13px;font-weight:400;
  transition:all 0.12s;margin-bottom:1px;
}
.nav-item:hover{background:rgba(0,0,0,0.04);color:var(--ink);}
.nav-item.active{background:rgba(0,122,255,0.1);color:var(--blue);font-weight:500;}
.nav-icon{
  width:28px;height:28px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;flex-shrink:0;
  background:rgba(0,0,0,0.05);
  transition:all 0.12s;
}
.nav-item.active .nav-icon{background:var(--blue);filter:none;}
.nav-item.active .nav-icon span{filter:brightness(0) invert(1);}

.sidebar-foot{padding:12px 10px;border-top:1px solid var(--border);}
.user-card{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:12px;
  background:rgba(0,0,0,0.03);
}
.user-avatar{
  width:32px;height:32px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#007AFF,#5856D6);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:600;color:#fff;
}
.user-info{flex:1;min-width:0;}
.user-email{font-size:11.5px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-role-lbl{font-size:10.5px;color:var(--ink4);}
.logout-btn{
  width:26px;height:26px;border-radius:8px;border:none;cursor:pointer;
  background:transparent;color:var(--ink4);font-size:13px;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.12s;flex-shrink:0;
}
.logout-btn:hover{background:rgba(255,59,48,0.1);color:var(--red);}

/* ── MAIN ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{
  height:52px;
  background:var(--glass2);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;flex-shrink:0;
}
.topbar-title{font-size:16px;font-weight:600;letter-spacing:-0.3px;color:var(--ink);}
.topbar-right{display:flex;align-items:center;gap:8px;}
.content{flex:1;overflow-y:auto;padding:24px;}

/* ── BOTÕES ── */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 14px;border-radius:10px;border:none;cursor:pointer;
  font-family:var(--font);font-size:13px;font-weight:500;
  transition:all 0.12s;white-space:nowrap;letter-spacing:-0.1px;
}
.btn-primary{background:var(--blue);color:#fff;}
.btn-primary:hover{background:#0069D9;box-shadow:0 2px 12px rgba(0,122,255,0.35);}
.btn-ghost{background:rgba(0,0,0,0.05);color:var(--ink2);border:1px solid var(--border);}
.btn-ghost:hover{background:rgba(0,0,0,0.08);}
.btn-danger{background:rgba(255,59,48,0.1);color:var(--red);border:1px solid rgba(255,59,48,0.2);}
.btn-danger:hover{background:rgba(255,59,48,0.18);}
.btn-sm{padding:5px 12px;font-size:12px;}

/* ── MÉTRICAS ── */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.metric{
  background:var(--glass2);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--border);border-radius:var(--r3);
  padding:20px;box-shadow:var(--sh);
  position:relative;overflow:hidden;
}
.metric::before{
  content:'';position:absolute;top:0;right:0;width:80px;height:80px;border-radius:50%;
  opacity:0.06;transform:translate(20px,-20px);
}
.metric:nth-child(1)::before{background:var(--blue);}
.metric:nth-child(2)::before{background:var(--green);}
.metric:nth-child(3)::before{background:var(--purple);}
.metric:nth-child(4)::before{background:var(--orange);}
.metric-icon{
  width:32px;height:32px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;margin-bottom:12px;
}
.metric:nth-child(1) .metric-icon{background:rgba(0,122,255,0.12);}
.metric:nth-child(2) .metric-icon{background:rgba(52,199,89,0.12);}
.metric:nth-child(3) .metric-icon{background:rgba(175,82,222,0.12);}
.metric:nth-child(4) .metric-icon{background:rgba(255,149,0,0.12);}
.metric-label{font-size:11.5px;font-weight:500;color:var(--ink3);margin-bottom:4px;}
.metric-value{font-size:26px;font-weight:700;letter-spacing:-0.8px;color:var(--ink);}
.metric-value.blue{color:var(--blue);}
.metric-value.green{color:var(--green);}
.metric-sub{font-size:11px;color:var(--ink4);margin-top:3px;}

/* ── CARD ── */
.card{
  background:var(--glass2);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--border);border-radius:var(--r3);
  overflow:hidden;box-shadow:var(--sh);
}
.card-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid var(--border);
}
.card-title{font-size:13.5px;font-weight:600;letter-spacing:-0.2px;color:var(--ink);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

/* ── TABELA ── */
table{width:100%;border-collapse:collapse;}
thead th{
  padding:9px 18px;text-align:left;
  font-size:11px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;
  color:var(--ink4);border-bottom:1px solid var(--border);
  background:rgba(0,0,0,0.015);
}
tbody td{padding:11px 18px;border-bottom:1px solid rgba(0,0,0,0.04);font-size:13px;vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr{transition:background 0.1s;}
tbody tr:hover td{background:rgba(0,122,255,0.03);}

/* ── BADGE ── */
.badge{
  display:inline-flex;align-items:center;padding:3px 9px;
  border-radius:20px;font-size:11.5px;font-weight:500;
}
.badge-ativo,.badge-pago,.badge-aprovada,.badge-entregue,.badge-aprovado{background:rgba(52,199,89,0.12);color:#1A7A3A;}
.badge-inativo,.badge-cancelado,.badge-recusada{background:rgba(255,59,48,0.1);color:#CC2A1E;}
.badge-lead,.badge-rascunho,.badge-briefing{background:rgba(0,122,255,0.1);color:#0055CC;}
.badge-pendente,.badge-em_andamento,.badge-enviada{background:rgba(255,149,0,0.12);color:#B36A00;}
.badge-revisao{background:rgba(90,200,250,0.15);color:#0077AA;}
.badge-pausado,.badge-atrasado{background:rgba(255,59,48,0.1);color:#CC2A1E;}
.badge-admin{background:linear-gradient(135deg,rgba(0,122,255,0.15),rgba(88,86,214,0.15));color:#0055CC;border:1px solid rgba(0,122,255,0.2);}
.badge-cliente{background:rgba(0,0,0,0.05);color:var(--ink3);border:1px solid var(--border2);}

/* ── KANBAN ── */
.kanban{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;}
.k-col{
  min-width:210px;max-width:210px;
  background:rgba(0,0,0,0.025);
  border:1px solid var(--border);border-radius:var(--r2);padding:14px;
}
.k-col-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.k-col-label{font-size:11px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:var(--ink3);}
.k-count{
  font-size:11px;color:var(--ink4);
  background:rgba(0,0,0,0.06);border-radius:20px;
  padding:1px 7px;
}
.k-card{
  background:var(--glass2);border:1px solid var(--border);
  border-radius:12px;padding:12px 13px;margin-bottom:7px;
  cursor:pointer;transition:all 0.12s;
  box-shadow:0 1px 4px rgba(0,0,0,0.04);
}
.k-card:hover{box-shadow:var(--sh);transform:translateY(-1px);}
.k-card-name{font-size:12.5px;font-weight:500;margin-bottom:2px;color:var(--ink);}
.k-card-client{font-size:11.5px;color:var(--ink3);}
.k-card-val{font-size:11.5px;color:var(--green);font-weight:600;margin-top:7px;}
.k-card-date{font-size:11px;color:var(--ink4);margin-top:2px;}
.k-empty{font-size:12px;color:var(--ink5);text-align:center;padding:16px 0;}

/* ── FINANCEIRO ── */
.fin-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;}
.fin-block{
  background:var(--glass2);border:1px solid var(--border);
  border-radius:var(--r2);padding:18px 20px;box-shadow:var(--sh);
}
.fin-lbl{font-size:11px;font-weight:500;letter-spacing:0.04em;text-transform:uppercase;color:var(--ink4);margin-bottom:6px;}
.fin-num{font-size:22px;font-weight:700;letter-spacing:-0.5px;}
.fin-num.r{color:var(--green);}
.fin-num.d{color:var(--red);}
.fin-num.s{color:var(--ink);}

/* ── PORTAL CLIENTE ── */
.portal-hero{
  background:linear-gradient(135deg,rgba(0,122,255,0.08),rgba(88,86,214,0.06));
  border:1px solid rgba(0,122,255,0.12);border-radius:var(--r3);
  padding:24px 26px;margin-bottom:16px;
  display:flex;align-items:center;gap:18px;
  box-shadow:var(--sh);
}
.portal-avatar{
  width:52px;height:52px;border-radius:16px;flex-shrink:0;
  background:linear-gradient(135deg,var(--blue),var(--indigo));
  display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:700;color:#fff;
  box-shadow:0 4px 16px rgba(0,122,255,0.3);
}
.portal-name{font-size:20px;font-weight:700;letter-spacing:-0.4px;margin-bottom:3px;}
.portal-meta{font-size:12.5px;color:var(--ink3);}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
.info-block{
  background:var(--glass2);border:1px solid var(--border);
  border-radius:var(--r2);padding:14px 18px;box-shadow:var(--sh);
}
.info-lbl{font-size:10.5px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink4);margin-bottom:4px;}
.info-val{font-size:13px;color:var(--ink);font-weight:500;}

/* ── MODAL ── */
.overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.35);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;
  z-index:1000;opacity:0;pointer-events:none;transition:opacity 0.2s;
}
.overlay.open{opacity:1;pointer-events:all;}
.modal{
  background:rgba(255,255,255,0.94);
  backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);
  border:1px solid rgba(255,255,255,0.8);border-radius:20px;
  width:100%;max-width:540px;max-height:90vh;overflow-y:auto;
  box-shadow:var(--sh3);
  transform:scale(0.96) translateY(8px);
  transition:transform 0.2s cubic-bezier(0.34,1.56,0.64,1),opacity 0.2s;
  opacity:0;
}
.overlay.open .modal{transform:scale(1) translateY(0);opacity:1;}
.modal-head{
  padding:20px 22px 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;background:rgba(255,255,255,0.95);
  backdrop-filter:blur(20px);border-radius:20px 20px 0 0;
  z-index:1;
}
.modal-title{font-size:16px;font-weight:600;letter-spacing:-0.3px;}
.modal-x{
  width:28px;height:28px;border-radius:50%;border:none;cursor:pointer;
  background:rgba(0,0,0,0.06);color:var(--ink2);font-size:14px;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.12s;
}
.modal-x:hover{background:rgba(0,0,0,0.1);}
.modal-body{padding:20px 22px;display:flex;flex-direction:column;gap:13px;}
.modal-foot{
  padding:14px 22px;border-top:1px solid var(--border);
  display:flex;justify-content:flex-end;gap:8px;
  position:sticky;bottom:0;background:rgba(255,255,255,0.95);
  backdrop-filter:blur(20px);border-radius:0 0 20px 20px;
}
.modal-section{
  font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;
  color:var(--ink4);padding-bottom:8px;border-bottom:1px solid var(--border);
  margin-bottom:2px;
}

/* ── FORM ── */
.fg{display:flex;flex-direction:column;gap:5px;}
.fg label{font-size:11px;font-weight:500;color:var(--ink3);letter-spacing:0.01em;}
.fg input,.fg select,.fg textarea{
  background:rgba(0,0,0,0.04);border:1px solid transparent;
  border-radius:10px;color:var(--ink);font-family:var(--font);font-size:13.5px;
  padding:9px 12px;outline:none;transition:all 0.15s;width:100%;
}
.fg input:focus,.fg select:focus,.fg textarea:focus{
  border-color:var(--blue);background:#fff;
  box-shadow:0 0 0 3px rgba(0,122,255,0.12);
}
.fg input:hover:not(:focus),.fg select:hover:not(:focus){background:rgba(0,0,0,0.06);}
.fg textarea{resize:vertical;min-height:72px;}
.fg select option{background:#fff;}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}

/* ── SEARCH ── */
.search-wrap{
  display:flex;align-items:center;gap:6px;
  background:rgba(0,0,0,0.05);border:1px solid transparent;
  border-radius:10px;padding:6px 12px;transition:all 0.15s;
}
.search-wrap:focus-within{background:#fff;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,122,255,0.12);}
.search-wrap span{color:var(--ink4);font-size:13px;}
.search{
  background:transparent;border:none;color:var(--ink);
  font-family:var(--font);font-size:13px;outline:none;width:180px;
}
.search::placeholder{color:var(--ink4);}

/* ── TOAST ── */
.toasts{position:fixed;bottom:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:8px;}
.toast{
  background:rgba(28,28,30,0.88);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:14px;padding:11px 16px;font-size:13px;
  display:flex;align-items:center;gap:10px;color:#fff;
  box-shadow:0 8px 32px rgba(0,0,0,0.3);
  animation:tin 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
.toast-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.toast.ok .toast-dot{background:var(--green);}
.toast.er .toast-dot{background:var(--red);}
@keyframes tin{from{transform:translateX(16px) scale(0.9);opacity:0;}to{transform:translateX(0) scale(1);opacity:1;}}

/* ── EMPTY/LOAD ── */
.empty{text-align:center;padding:48px 20px;color:var(--ink4);}
.empty-icon{font-size:36px;margin-bottom:10px;opacity:0.4;}
.empty p{font-size:13px;}
.loading{padding:40px;text-align:center;color:var(--ink4);font-size:13px;}
.loading::after{content:'';display:inline-block;width:16px;height:16px;border:2px solid var(--ink5);border-top-color:var(--blue);border-radius:50%;margin-left:8px;animation:spin 0.8s linear infinite;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── AÇÕES ── */
.act{
  background:none;border:none;color:var(--ink4);cursor:pointer;
  padding:5px 7px;border-radius:8px;font-size:13px;transition:all 0.12s;
}
.act:hover{color:var(--ink);background:rgba(0,0,0,0.06);}
.act.del:hover{color:var(--red);background:rgba(255,59,48,0.08);}

.nav-lbl{font-size:13px;}

/* ── SCROLL ── */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.12);border-radius:10px;}
::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,0.2);}

/* ── ANIMAÇÕES ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.anim{animation:fadeUp 0.25s ease both;}

/* ══════════════════════════════════════
   MOBILE FIRST — tudo abaixo de 768px
══════════════════════════════════════ */
@media (max-width: 768px) {

  /* Remove overflow hidden do body no mobile */
  html,body { overflow:auto; height:auto; }

  /* LOGIN */
  #login-screen { padding:24px 16px; align-items:flex-start; padding-top:60px; }
  .login-box { padding:32px 24px; border-radius:20px; }
  .login-fg input { font-size:16px; padding:14px 16px; } /* evita zoom no iOS */

  /* APP */
  .app { flex-direction:column; height:100dvh; overflow:hidden; }

  /* SIDEBAR vira bottom nav */
  .sidebar {
    width:100%; min-width:unset;
    border-right:none;
    border-top:1px solid var(--border);
    flex-direction:row;
    height:64px; min-height:64px;
    order:2;
    padding:0;
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    position:fixed;bottom:0;left:0;right:0;z-index:100;
  }

  /* Esconde logo e user card no mobile */
  .logo-wrap, .sidebar-foot { display:none; }

  /* Nav vira barra horizontal */
  .nav {
    display:flex; flex-direction:row;
    padding:0; width:100%; overflow-x:auto;
    align-items:stretch;
    scrollbar-width:none;
  }
  .nav::-webkit-scrollbar { display:none; }
  .nav-section { display:none; }
  .nav-item {
    flex-direction:column; flex:1;
    align-items:center; justify-content:center;
    gap:3px; padding:8px 4px;
    border-radius:0; margin:0;
    font-size:10px; font-weight:500;
    min-width:56px;
  }
  .nav-item.active { background:transparent; color:var(--blue); }
  .nav-item.active::before { display:none; }
  .nav-icon {
    width:24px; height:24px; border-radius:7px;
    font-size:13px; background:transparent;
  }
  .nav-item.active .nav-icon { background:rgba(0,122,255,0.12); }

  /* MAIN ocupa tudo menos o bottom nav */
  .main {
    flex:1; order:1;
    height:calc(100dvh - 64px);
    overflow:hidden;
  }

  /* TOPBAR mobile */
  .topbar {
    height:52px; padding:0 16px;
    position:sticky; top:0; z-index:50;
  }
  .topbar-title { font-size:17px; }
  .topbar-right { gap:6px; }
  .topbar-right .btn span { display:none; } /* esconde texto, mostra só ícone */

  /* CONTENT */
  .content { padding:16px; padding-bottom:24px; overflow-y:auto; }

  /* MÉTRICAS — 2 colunas no mobile */
  .metrics { grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
  .metric { padding:14px; border-radius:16px; }
  .metric-icon { width:28px; height:28px; font-size:14px; margin-bottom:8px; }
  .metric-value { font-size:20px; }
  .metric-sub { font-size:10px; }

  /* GRID 2 vira 1 coluna */
  .grid2 { grid-template-columns:1fr; gap:12px; }

  /* TABELA — scroll horizontal */
  .card { border-radius:16px; }
  .card-overflow { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table { min-width:500px; }
  thead th { padding:8px 14px; font-size:10px; }
  tbody td { padding:11px 14px; font-size:12.5px; }

  /* KANBAN — scroll horizontal */
  .kanban { padding-bottom:8px; }
  .k-col { min-width:180px; max-width:180px; }

  /* FINANCEIRO strip — 1 coluna no mobile */
  .fin-strip { grid-template-columns:1fr; gap:8px; }
  .fin-block { padding:14px 16px; border-radius:14px; }
  .fin-num { font-size:20px; }

  /* INFO GRID portal — 2 colunas */
  .info-grid { grid-template-columns:1fr 1fr; }

  /* MODAL — tela cheia no mobile */
  .overlay { align-items:flex-end; }
  .modal {
    max-width:100%; max-height:92dvh;
    border-radius:24px 24px 0 0;
    transform:translateY(100%);
  }
  .overlay.open .modal { transform:translateY(0); }
  .modal-head {
    border-radius:24px 24px 0 0;
    padding:16px 20px 14px;
  }
  /* Handle bar */
  .modal-head::before {
    content:'';display:block;
    width:36px; height:4px;
    background:var(--border2); border-radius:2px;
    margin:0 auto 12px;
  }
  .modal-body { padding:16px 20px; }
  .modal-foot { padding:12px 20px 20px; }

  /* FORM no mobile */
  .fg input,.fg select,.fg textarea { font-size:16px; padding:12px; } /* evita zoom iOS */
  .frow3 { grid-template-columns:1fr 1fr; } /* 3 cols vira 2 */

  /* SEARCH */
  .search-wrap { width:100%; }
  .search { width:100%; }

  /* TOPBAR actions — empilha em coluna quando tem busca */
  .topbar-right { flex-wrap:wrap; }

  /* PORTAL hero */
  .portal-hero { padding:18px; flex-direction:column; text-align:center; }
  .portal-name { font-size:18px; }

  /* TOASTS */
  .toasts { bottom:76px; right:12px; left:12px; }
  .toast { border-radius:14px; }

  /* Botões maiores para toque */
  .btn { min-height:40px; }
  .act { width:36px; height:36px; display:inline-flex; align-items:center; justify-content:center; }

  /* FAB — botão flutuante de ação principal */
  .fab {
    position:fixed; bottom:80px; right:16px; z-index:99;
    width:52px; height:52px; border-radius:50%;
    background:var(--blue); color:#fff; border:none;
    font-size:24px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 20px rgba(0,122,255,0.4);
    transition:all 0.15s;
  }
  .fab:active { transform:scale(0.94); }
  /* Safe area para iPhone com notch */
  .sidebar { padding-bottom:env(safe-area-inset-bottom); height:calc(64px + env(safe-area-inset-bottom)); }
  .main { height:calc(100dvh - 64px - env(safe-area-inset-bottom)); }
  .fab { bottom:calc(80px + env(safe-area-inset-bottom)); }
  .toasts { bottom:calc(76px + env(safe-area-inset-bottom)); }
  .modal-foot { padding-bottom:calc(20px + env(safe-area-inset-bottom)); }
}

/* Telas muito pequenas */
@media (max-width: 380px) {
  .metrics { grid-template-columns:1fr; }
  .info-grid { grid-template-columns:1fr; }
  .frow, .frow3 { grid-template-columns:1fr; }
}
</style>
</head>

// AUTH
async function doLogin(){
  const email=val('login-email').trim(),pass=val('login-pass');
  if(!email||!pass){showErr('Preencha e-mail e senha.');return;}
  const btn=g('login-btn');btn.textContent='Entrando…';btn.disabled=true;
  const{data,error}=await db.auth.signInWithPassword({email,password:pass});
  if(error){showErr('E-mail ou senha incorretos.');btn.textContent='Entrar';btn.disabled=false;return;}
  await initSession(data.user);
}
function showErr(msg){const el=g('login-err');el.textContent=msg;el.classList.add('show');}
async function initSession(user){
  currentUser=user;
  const{data:profile}=await db.from('profiles').select('*').eq('id',user.id).single();
  currentRole=profile?.role||'cliente';
  currentClienteId=profile?.cliente_id||null;
  g('login-screen').style.display='none';
  g('app').style.display='flex';
  const emailShort=user.email.split('@')[0];
  g('user-avatar').textContent=emailShort[0].toUpperCase();
  g('user-email-display').textContent=user.email;
  g('user-role-display').textContent=currentRole==='admin'?'Administrador':'Cliente';
  g('sidebar-role-label').textContent=currentRole==='admin'?'Painel admin':'Portal cliente';
  buildNav();
  if(currentRole==='admin')go('dashboard');else goPortal();
}
async function doLogout(){await db.auth.signOut();location.reload();}

const NAV_ICONS={dashboard:'⊞',clientes:'◎',projetos:'◫',financeiro:'◈',propostas:'◳',usuarios:'⊙'};
const NAV_LABELS={dashboard:'Início',clientes:'Clientes',projetos:'Projetos',financeiro:'Financeiro',propostas:'Propostas',usuarios:'Usuários'};
function buildNav(){
  const nav=g('sidebar-nav');
  if(currentRole==='admin'){
    nav.innerHTML=`
      <div class="nav-section">Visão geral</div>
      ${navItem('dashboard','Dashboard')}
      <div class="nav-section">Gestão</div>

      ${navItem('projetos','Projetos')}
      ${navItem('financeiro','Financeiro')}

    nav.innerHTML=`

function navItem(view,label){
  return`<div class="nav-item" onclick="go('${view}')"><div class="nav-icon"><span>${NAV_ICONS[view]||'◎'}</span></div><span class="nav-lbl">${NAV_LABELS[view]||label}</span></div>`;
}
const TITLES={dashboard:'Dashboard',clientes:'Clientes',projetos:'Projetos',financeiro:'Financeiro',propostas:'Propostas',usuarios:'Usuários'};
function go(view){
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.getAttribute('onclick')===`go('${view}')`));
  g('page-title').textContent=TITLES[view]||view;
  setContent('<div class="loading">Carregando</div>');setActions('');
  ({dashboard:renderDash,clientes:renderClientes,projetos:renderProjetos,financeiro:renderFin,propostas:renderPropostas,usuarios:renderUsuarios}[view])();
}

  const emAnd=projetos.filter(x=>x.status==='em_andamento').length;
  const receb=financeiro.filter(x=>x.tipo==='receita'&&x.status==='pago').reduce((a,b)=>a+(b.valor||0),0);
  const pend=financeiro.filter(x=>x.status==='pendente').reduce((a,b)=>a+(b.valor||0),0);

      <div class="metric"><div class="metric-icon">◳</div><div class="metric-label">Propostas abertas</div><div class="metric-value" style="color:var(--orange)">${propostas.filter(x=>x.status==='enviada').length}</div><div class="metric-sub">${propostas.length} total</div></div>
    </div>
    <div class="grid2">
      <div class="card">
        <div class="card-head"><span class="card-title">Projetos recentes</span><button class="btn btn-ghost btn-sm" onclick="go('projetos')">Ver todos</button></div>
        ${ultP.length===0?'<div class="empty"><div class="empty-icon">◫</div><p>Nenhum projeto</p></div>':`<table><thead><tr><th>Projeto</th><th>Status</th><th>Valor</th></tr></thead><tbody>${ultP.map(p=>{const cl=clientes.find(c=>c.id===p.cliente_id);return`<tr><td><div style="font-weight:500">${p.titulo}</div><div style="font-size:11.5px;color:var(--ink3)">${cl?.nome_completo||'—'}</div></td><td>${badge(p.status)}</td><td style="color:var(--green);font-weight:600">${R(p.valor)}</td></tr>`;}).join('')}</tbody></table>`}

async function saveCliente(id){
  const nome=val('f-nome').trim();
  if(!nome){toast('Nome completo é obrigatório','er');return;}
  const email=val('f-email').trim();
  const SENHA_PADRAO='5essencia';
  const payload={nome_completo:nome,cpf:val('f-cpf').replace(/\D/g,'')||null,email:email||null,whatsapp:val('f-wpp')||null,empresa:val('f-empresa')||null,cnpj:val('f-cnpj').replace(/\D/g,'')||null,whatsapp_financeiro:val('f-wpp-fin')||null,drive_url:val('f-drive')||null,endereco_rua:val('f-rua')||null,endereco_bairro:val('f-bairro')||null,endereco_cidade:val('f-cidade')||null,endereco_uf:val('f-uf').toUpperCase()||null,endereco_cep:val('f-cep')||null,endereco_complemento:val('f-compl')||null,notas:val('f-notas')||null,status:g('f-status')?.value||'ativo'};

  // Se é novo cliente com e-mail, cria acesso automaticamente
  if(!id && email){
    try {
      const{data:authData,error:authErr}=await db.auth.signUp({email,password:SENHA_PADRAO});
      if(!authErr && authData?.user){
        const uid=authData.user.id;
        // Salva perfil como cliente
        await db.from('profiles').upsert({
          id:uid,email,role:'cliente',
          created_at:new Date().toISOString()
        });
        payload.user_id=uid;
      }
    } catch(e){
      console.warn('Erro ao criar acesso:', e);
    }
  }

  const{data:saved,error}=id
    ?await db.from('clientes').update(payload).eq('id',id).select()
    :await db.from('clientes').insert(payload).select();
  if(error){toast('Erro: '+error.message,'er');return;}

  // Vincula o cliente_id no profile após inserção
  if(!id && saved?.[0]?.id && payload.user_id){
    await db.from('profiles').update({cliente_id:saved[0].id}).eq('id',payload.user_id);
  }

  toast(id?'Cliente atualizado':'Cliente criado — acesso gerado com senha padrão');
  closeModal();renderClientes();
}
async function delCliente(id){
  if(!confirm('Excluir este cliente?'))return;
  await db.from('clientes').delete().eq('id',id);
  toast('Cliente removido');closeModal();renderClientes();
}

  projetos=rp.data||[];clientes=rc.data||[];
  const cols=[{k:'briefing',l:'Briefing'},{k:'em_andamento',l:'Em andamento'},{k:'revisao',l:'Revisão'},{k:'aprovado',l:'Aprovado'},{k:'entregue',l:'Entregue'}];
  setActions(`<button class="btn btn-primary" onclick="formProjeto()">+ Novo projeto</button>`);
  setContent(`
    <div class="kanban" style="margin-bottom:16px">${cols.map(col=>{const cards=projetos.filter(p=>p.status===col.k);return`<div class="k-col"><div class="k-col-head"><span class="k-col-label">${col.l}</span><span class="k-count">${cards.length}</span></div>${cards.length===0?'<div class="k-empty">—</div>':cards.map(p=>{const cl=clientes.find(c=>c.id===p.cliente_id);return`<div class="k-card" onclick="formProjeto('${p.id}')"><div class="k-card-name">${p.titulo}</div><div class="k-card-client">${cl?.nome_completo||'—'}</div>${p.prazo?`<div class="k-card-date">${D(p.prazo)}</div>`:''}${p.valor?`<div class="k-card-val">${R(p.valor)}</div>`:''}</div>`;}).join('')}</div>`;}).join('')}</div>

  `);
}
function formProjeto(id=null){
  const p=id?projetos.find(x=>x.id===id):{};
  const ST=['briefing','em_andamento','revisao','aprovado','entregue','pausado'];
  const SL=['Briefing','Em andamento','Revisão','Aprovado','Entregue','Pausado'];
  openModal(id?'Editar projeto':'Novo projeto',`
    <div class="fg"><label>Título *</label><input id="ft" value="${p.titulo||''}"></div>
    <div class="frow"><div class="fg"><label>Cliente</label><select id="fc"><option value="">Sem cliente</option>${clientes.map(c=>`<option value="${c.id}" ${c.id===p.cliente_id?'selected':''}>${c.nome_completo}</option>`).join('')}</select></div><div class="fg"><label>Status</label><select id="fs">${ST.map((s,i)=>`<option value="${s}" ${p.status===s?'selected':''}>${SL[i]}</option>`).join('')}</select></div></div>
    <div class="frow"><div class="fg"><label>Valor (R$)</label><input id="fv" type="number" step="0.01" value="${p.valor||''}"></div><div class="fg"><label>Prazo</label><input id="fp" type="date" value="${p.prazo||''}"></div></div>
    <div class="fg"><label>Descrição</label><textarea id="fd">${p.descricao||''}</textarea></div>
  `,`<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>${id?`<button class="btn btn-danger btn-sm" onclick="delProjeto('${id}')">Excluir</button>`:''}<button class="btn btn-primary" onclick="saveProjeto('${id||''}')">Salvar</button>`);
}
async function saveProjeto(id){
  const titulo=val('ft').trim();if(!titulo){toast('Título obrigatório','er');return;}
  const payload={titulo,cliente_id:val('fc')||null,status:g('fs')?.value||'briefing',valor:parseFloat(val('fv'))||null,prazo:val('fp')||null,descricao:val('fd')||null};
  const{error}=id?await db.from('projetos').update(payload).eq('id',id):await db.from('projetos').insert(payload);
  if(error){toast('Erro: '+error.message,'er');return;}
  toast(id?'Projeto atualizado':'Projeto criado');closeModal();renderProjetos();
}
async function delProjeto(id){
  if(!confirm('Excluir?'))return;
  await db.from('projetos').delete().eq('id',id);
  toast('Removido');closeModal();renderProjetos();
}

async function renderFin(){
  const[rf,rc]=await Promise.all([db.from('financeiro').select('*').order('created_at',{ascending:false}),db.from('clientes').select('id,nome_completo')]);
  financeiro=rf.data||[];clientes=rc.data||[];
  const rec=financeiro.filter(x=>x.tipo==='receita').reduce((a,b)=>a+(b.valor||0),0);
  const des=financeiro.filter(x=>x.tipo==='despesa').reduce((a,b)=>a+(b.valor||0),0);
  setActions(`<button class="btn btn-primary" onclick="formFin()">+ Novo lançamento</button>`);
  setContent(`
    <div class="fin-strip"><div class="fin-block"><div class="fin-lbl">Receitas</div><div class="fin-num r">${R(rec)}</div></div><div class="fin-block"><div class="fin-lbl">Despesas</div><div class="fin-num d">${R(des)}</div></div><div class="fin-block"><div class="fin-lbl">Saldo</div><div class="fin-num s">${R(rec-des)}</div></div></div>

    <div class="fg"><label>Descrição *</label><input id="fd" value="${f.descricao||''}"></div>
    <div class="frow"><div class="fg"><label>Tipo</label><select id="ft"><option value="receita" ${f.tipo==='receita'?'selected':''}>Receita</option><option value="despesa" ${f.tipo==='despesa'?'selected':''}>Despesa</option></select></div><div class="fg"><label>Valor (R$) *</label><input id="fv" type="number" step="0.01" value="${f.valor||''}"></div></div>
    <div class="frow"><div class="fg"><label>Cliente</label><select id="fc"><option value="">Sem cliente</option>${clientes.map(c=>`<option value="${c.id}" ${c.id===f.cliente_id?'selected':''}>${c.nome_completo}</option>`).join('')}</select></div><div class="fg"><label>Status</label><select id="fs">${['pendente','pago','atrasado','cancelado'].map(s=>`<option value="${s}" ${f.status===s?'selected':''}>${s.charAt(0).toUpperCase()+s.slice(1)}</option>`).join('')}</select></div></div>
    <div class="fg"><label>Vencimento</label><input id="fvc" type="date" value="${f.vencimento||''}"></div>
  `,`<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>${id?`<button class="btn btn-danger btn-sm" onclick="delFin('${id}')">Excluir</button>`:''}<button class="btn btn-primary" onclick="saveFin('${id||''}')">Salvar</button>`);
}
async function saveFin(id){
  const desc=val('fd').trim(),valor=parseFloat(val('fv'));
  if(!desc||!valor){toast('Descrição e valor obrigatórios','er');return;}
  const payload={descricao:desc,valor,tipo:g('ft')?.value||'receita',cliente_id:val('fc')||null,status:g('fs')?.value||'pendente',vencimento:val('fvc')||null};
  const{error}=id?await db.from('financeiro').update(payload).eq('id',id):await db.from('financeiro').insert(payload);
  if(error){toast('Erro: '+error.message,'er');return;}
  toast(id?'Atualizado':'Lançamento criado');closeModal();renderFin();
}
async function delFin(id){
  if(!confirm('Excluir?'))return;
  await db.from('financeiro').delete().eq('id',id);
  toast('Removido');closeModal();renderFin();
}

// PROPOSTAS
async function renderPropostas(){
  const[rp,rc]=await Promise.all([db.from('propostas').select('*').order('created_at',{ascending:false}),db.from('clientes').select('id,nome_completo')]);
  propostas=rp.data||[];clientes=rc.data||[];
  setActions(`<button class="btn btn-primary" onclick="formProposta()">+ Nova proposta</button>`);
  setContent(`<div class="card">${propostas.length===0?'<div class="empty"><div class="empty-icon">◳</div><p>Nenhuma proposta</p></div>':`<table><thead><tr><th>Título</th><th>Cliente</th><th>Valor</th><th>Status</th><th>Data</th><th></th></tr></thead><tbody>${propostas.map(p=>{const cl=clientes.find(c=>c.id===p.cliente_id);return`<tr><td style="font-weight:500">${p.titulo}</td><td style="color:var(--ink2)">${cl?.nome_completo||'—'}</td><td style="color:var(--green);font-weight:600">${R(p.valor)}</td><td>${badge(p.status)}</td><td style="color:var(--ink3)">${new Date(p.created_at).toLocaleDateString('pt-BR')}</td><td style="white-space:nowrap"><button class="act" onclick="formProposta('${p.id}')">✎</button><button class="act del" onclick="delProposta('${p.id}')">✕</button></td></tr>`;}).join('')}</tbody></table>`}</div>`);
}
function formProposta(id=null){
  const p=id?propostas.find(x=>x.id===id):{};
  openModal(id?'Editar proposta':'Nova proposta',`
    <div class="fg"><label>Título *</label><input id="ft" value="${p.titulo||''}"></div>
    <div class="frow"><div class="fg"><label>Cliente</label><select id="fc"><option value="">Sem cliente</option>${clientes.map(c=>`<option value="${c.id}" ${c.id===p.cliente_id?'selected':''}>${c.nome_completo}</option>`).join('')}</select></div><div class="fg"><label>Valor (R$)</label><input id="fv" type="number" step="0.01" value="${p.valor||''}"></div></div>
    <div class="fg"><label>Status</label><select id="fs">${['rascunho','enviada','aprovada','recusada'].map(s=>`<option value="${s}" ${p.status===s?'selected':''}>${s.charAt(0).toUpperCase()+s.slice(1)}</option>`).join('')}</select></div>
    <div class="fg"><label>Notas</label><textarea id="fn">${p.notas||''}</textarea></div>
  `,`<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>${id?`<button class="btn btn-danger btn-sm" onclick="delProposta('${id}')">Excluir</button>`:''}<button class="btn btn-primary" onclick="saveProposta('${id||''}')">Salvar</button>`);
}
async function saveProposta(id){
  const titulo=val('ft').trim();if(!titulo){toast('Título obrigatório','er');return;}
  const payload={titulo,cliente_id:val('fc')||null,valor:parseFloat(val('fv'))||null,status:g('fs')?.value||'rascunho',notas:val('fn')||null};
  const{error}=id?await db.from('propostas').update(payload).eq('id',id):await db.from('propostas').insert(payload);
  if(error){toast('Erro: '+error.message,'er');return;}
  toast(id?'Atualizada':'Proposta criada');closeModal();renderPropostas();
}
async function delProposta(id){
  if(!confirm('Excluir?'))return;
  await db.from('propostas').delete().eq('id',id);
  toast('Removida');closeModal();renderPropostas();
}

// USUÁRIOS
async function renderUsuarios(){
  const{data:profiles}=await db.from('profiles').select('*, clientes(nome_completo)').order('created_at',{ascending:false});
  const{data:cls}=await db.from('clientes').select('id,nome_completo');
  clientes=cls||[];
  setActions(`<button class="btn btn-primary" onclick="formNovoUsuario()">+ Criar acesso</button>`);
  setContent(`<div class="card"><div class="card-head"><span class="card-title">Acessos ao sistema</span></div>${!profiles||profiles.length===0?'<div class="empty"><div class="empty-icon">⊙</div><p>Nenhum usuário</p></div>':`<table><thead><tr><th>E-mail</th><th>Perfil</th><th>Cliente vinculado</th><th>Criado em</th><th></th></tr></thead><tbody>${profiles.map(u=>`<tr><td style="font-weight:500">${u.email||'—'}</td><td>${u.role==='admin'?'<span class="badge badge-admin">Admin</span>':'<span class="badge badge-cliente">Cliente</span>'}</td><td style="color:var(--ink2)">${u.clientes?.nome_completo||'—'}</td><td style="color:var(--ink3)">${new Date(u.created_at).toLocaleDateString('pt-BR')}</td><td style="white-space:nowrap">${u.role!=='admin'?`<button class="act" onclick="resetSenhaUsuario('${u.id}','${u.email}')" title="Redefinir senha">🔑</button><button class="act del" onclick="delUsuario('${u.id}')">✕</button>`:''}</td></tr>`).join('')}</tbody></table>`}</div>`);
}
function formNovoUsuario(){
  openModal('Criar acesso',`
    <div style="font-size:12.5px;color:var(--ink3);background:rgba(0,122,255,0.06);border:1px solid rgba(0,122,255,0.15);border-radius:10px;padding:10px 14px;margin-bottom:4px">
      O usuário receberá acesso imediato com as credenciais definidas abaixo.
    </div>
    <div class="fg"><label>E-mail *</label><input id="nu-email" type="email" placeholder="email@cliente.com"></div>
    <div class="fg"><label>Perfil</label><select id="nu-role" onchange="toggleClienteSelect()"><option value="cliente">Cliente</option><option value="admin">Admin</option></select></div>
    <div class="fg" id="nu-cliente-wrap"><label>Vincular ao cliente</label><select id="nu-cliente"><option value="">Selecionar…</option>${clientes.map(c=>`<option value="${c.id}">${c.nome_completo}</option>`).join('')}</select></div>
    <div class="fg"><label>Senha inicial *</label><input id="nu-senha" type="password" placeholder="Mínimo 6 caracteres"></div>
  `,`<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="criarUsuario()">Criar acesso</button>`);
}
function toggleClienteSelect(){
  const wrap=g('nu-cliente-wrap');
  if(wrap)wrap.style.display=g('nu-role')?.value==='admin'?'none':'';
}
async function criarUsuario(){
  const email=val('nu-email').trim(),senha=val('nu-senha'),role=g('nu-role')?.value||'cliente',clienteId=val('nu-cliente')||null;
  if(!email||!senha){toast('E-mail e senha obrigatórios','er');return;}
  if(senha.length<6){toast('Senha mínimo 6 caracteres','er');return;}

  // Cria usuário via signUp simples (confirmação de e-mail deve estar OFF no Supabase)
  let uid = null;
  try {
    const {data, error} = await db.auth.signUp({email, password:senha});
    if(error) throw error;
    uid = data?.user?.id;
  } catch(e) {
    toast('Erro ao criar acesso: '+e.message,'er');
    return;
  }

  if(uid){
    await db.from('profiles').upsert({
      id:uid, email, role,
      cliente_id: clienteId||null,
      created_at: new Date().toISOString()
    });
  }

  toast('Acesso criado! Usuário já pode entrar.');
  closeModal();renderUsuarios();
}

async function resetSenhaUsuario(id, email){
  if(!confirm(`Redefinir senha de ${email}?`)) return;
  const novaSenha = prompt('Nova senha (mínimo 6 caracteres):');
  if(!novaSenha||novaSenha.length<6){toast('Senha muito curta','er');return;}
  // Faz login temporário não é possível — orienta o usuário a usar o link de reset
  const {error} = await db.auth.resetPasswordForEmail(email, {redirectTo: location.href});
  if(!error){toast('E-mail de redefinição enviado para '+email);}
  else{toast('Erro: '+error.message,'er');}
}
async function delUsuario(id){
  if(!confirm('Remover este acesso?'))return;
  await db.from('profiles').delete().eq('id',id);
  toast('Acesso removido');renderUsuarios();
}

        ${c.drive_url?`<a href="${c.drive_url}" target="_blank" style="display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:rgba(0,122,255,0.1);color:var(--blue);border:1px solid rgba(0,122,255,0.2);border-radius:20px;padding:5px 14px;font-size:12.5px;font-weight:500;text-decoration:none">📁 Meu Google Drive</a>`:''}
      </div>
    </div>
    <div class="info-grid">
      <div class="info-block"><div class="info-lbl">E-mail</div><div class="info-val">${c.email||'—'}</div></div>
      <div class="info-block"><div class="info-lbl">WhatsApp</div><div class="info-val">${c.whatsapp||'—'}</div></div>
      <div class="info-block"><div class="info-lbl">CPF</div><div class="info-val">${fmtCPF(c.cpf)}</div></div>
      <div class="info-block"><div class="info-lbl">Endereço</div><div class="info-val">${c.endereco_rua?`${c.endereco_rua}${c.endereco_cidade?', '+c.endereco_cidade:''}${c.endereco_uf?' - '+c.endereco_uf:''}`:'—'}</div></div>
      <div class="info-block"><div class="info-lbl">WhatsApp financeiro</div><div class="info-val">${c.whatsapp_financeiro||'—'}</div></div>
      <div class="info-block"><div class="info-lbl">A pagar</div><div class="info-val" style="color:var(--orange);font-size:16px;font-weight:700">${R(pend)}</div></div>
    </div>
    <div class="grid2">
      <div class="card"><div class="card-head"><span class="card-title">Projetos</span></div>${!prj||prj.length===0?'<div class="empty"><p>Nenhum projeto</p></div>':`<table><thead><tr><th>Projeto</th><th>Status</th><th>Prazo</th></tr></thead><tbody>${prj.map(p=>`<tr><td style="font-weight:500">${p.titulo}</td><td>${badge(p.status)}</td><td style="color:var(--ink3)">${D(p.prazo)}</td></tr>`).join('')}</tbody></table>`}</div>
      <div class="card"><div class="card-head"><span class="card-title">Financeiro</span></div>${!fin||fin.length===0?'<div class="empty"><p>Nenhum lançamento</p></div>':`<table><thead><tr><th>Descrição</th><th>Valor</th><th>Status</th></tr></thead><tbody>${fin.slice(0,5).map(f=>`<tr><td>${f.descricao}</td><td style="font-weight:600;color:${f.status==='pago'?'var(--green)':f.status==='atrasado'?'var(--red)':'var(--orange)'}">${R(f.valor)}</td><td>${badge(f.status)}</td></tr>`).join('')}</tbody></table>`}</div>
    </div>
  `);
}
async function goPortalProjetos(){
  g('page-title').textContent='Meus projetos';setActions('');
  setContent('<div class="loading">Carregando</div>');
  const{data}=await db.from('projetos').select('*').eq('cliente_id',currentClienteId).order('created_at',{ascending:false});
  setContent(`<div class="card">${!data||data.length===0?'<div class="empty"><div class="empty-icon">◫</div><p>Nenhum projeto</p></div>':`<table><thead><tr><th>Projeto</th><th>Status</th><th>Valor</th><th>Prazo</th><th>Descrição</th></tr></thead><tbody>${data.map(p=>`<tr><td style="font-weight:500">${p.titulo}</td><td>${badge(p.status)}</td><td style="color:var(--green);font-weight:600">${R(p.valor)}</td><td style="color:var(--ink3)">${D(p.prazo)}</td><td style="color:var(--ink3);font-size:12px">${p.descricao||'—'}</td></tr>`).join('')}</tbody></table>`}</div>`);
}
async function goPortalFinanceiro(){
  g('page-title').textContent='Financeiro';setActions('');
  setContent('<div class="loading">Carregando</div>');
  const{data}=await db.from('financeiro').select('*').eq('cliente_id',currentClienteId).order('created_at',{ascending:false});
  const pend=(data||[]).filter(x=>x.status==='pendente').reduce((a,b)=>a+(b.valor||0),0);
  const pago=(data||[]).filter(x=>x.status==='pago').reduce((a,b)=>a+(b.valor||0),0);
  setContent(`
    <div class="fin-strip"><div class="fin-block"><div class="fin-lbl">Total pago</div><div class="fin-num r">${R(pago)}</div></div><div class="fin-block"><div class="fin-lbl">Pendente</div><div class="fin-num" style="color:var(--orange)">${R(pend)}</div></div><div class="fin-block"><div class="fin-lbl">Lançamentos</div><div class="fin-num s">${(data||[]).length}</div></div></div>
    <div class="card">${!data||data.length===0?'<div class="empty"><div class="empty-icon">◈</div><p>Nenhum lançamento</p></div>':`<table><thead><tr><th>Descrição</th><th>Valor</th><th>Vencimento</th><th>Status</th></tr></thead><tbody>${data.map(f=>`<tr><td style="font-weight:500">${f.descricao}</td><td style="font-weight:600;color:${f.status==='pago'?'var(--green)':f.status==='atrasado'?'var(--red)':'var(--orange)'}">${R(f.valor)}</td><td style="color:var(--ink3)">${D(f.vencimento)}</td><td>${badge(f.status)}</td></tr>`).join('')}</tbody></table>`}</div>
  `);
}

// INIT
db.auth.getSession().then(({data:{session}})=>{if(session?.user)initSession(session.user);});
