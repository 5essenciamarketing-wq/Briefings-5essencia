<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0A0F">
<title>5essência</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

/* ═══════════════════════════════════════════
   DESIGN SYSTEM — 5essência
   Tema: Obsidian Dark · Accent: Electric Blue
═══════════════════════════════════════════ */
:root{
  /* Backgrounds */
  --bg0:#050508;
  --bg:  #08080F;
  --bg1: #0D0D17;
  --bg2: #13131E;
  --bg3: #1A1A28;
  --bg4: #212133;

  /* Borders */
  --b0:  rgba(255,255,255,0.04);
  --b1:  rgba(255,255,255,0.08);
  --b2:  rgba(255,255,255,0.13);
  --b3:  rgba(255,255,255,0.2);

  /* Ink */
  --ink:  #F2F2FF;
  --ink2: #9898BA;
  --ink3: #555570;
  --ink4: #333348;

  /* Accent palette */
  --blue:   #4C82FB;
  --blue-g: linear-gradient(135deg,#4C82FB,#7C3AED);
  --green:  #2DD47A;
  --red:    #FF3B45;
  --orange: #FF9A0A;
  --purple: #A855F7;
  --teal:   #22D3EE;
  --gold:   #FBBF24;

  /* Glow */
  --glow-blue: 0 0 24px rgba(76,130,251,0.35);
  --glow-green:0 0 24px rgba(45,212,122,0.3);

  /* Radius */
  --r:  10px;
  --r2: 16px;
  --r3: 22px;
  --r4: 28px;

  --font:'Inter',-apple-system,sans-serif;
  --trans: all 0.2s cubic-bezier(0.4,0,0.2,1);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{height:100%;background:var(--bg0);overflow:hidden;}
body{
  height:100%;min-height:100dvh;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font);
  font-size:14px;line-height:1.5;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
}

/* ── LOGIN ─────────────────────────────────── */
#login-screen{
  position:fixed;inset:0;z-index:9999;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  padding-top:calc(24px + env(safe-area-inset-top));
  padding-bottom:calc(24px + env(safe-area-inset-bottom));
  overflow-y:auto;
  background:var(--bg0);
}
#login-screen::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 60% 40% at 20% 10%,rgba(76,130,251,0.18) 0%,transparent 60%),
    radial-gradient(ellipse 50% 35% at 80% 90%,rgba(168,85,247,0.14) 0%,transparent 60%),
    radial-gradient(ellipse 40% 30% at 60% 50%,rgba(34,211,238,0.06) 0%,transparent 60%);
}
/* Animated grain overlay */
#login-screen::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  opacity:0.025;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
.login-card{
  position:relative;z-index:1;
  width:100%;max-width:400px;
  background:rgba(13,13,23,0.9);
  border:1px solid var(--b2);
  border-radius:var(--r4);
  padding:40px 32px 36px;
  box-shadow:0 32px 80px rgba(0,0,0,0.8),0 0 0 1px rgba(255,255,255,0.04),var(--glow-blue);
  backdrop-filter:blur(40px);
  animation:loginIn 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes loginIn{from{opacity:0;transform:translateY(20px) scale(0.97);}to{opacity:1;transform:none;}}
.login-logo-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:40px;}
.login-logo-img{
  width:72px;height:72px;border-radius:20px;
  background:var(--bg2);overflow:hidden;margin-bottom:18px;
  box-shadow:0 12px 40px rgba(76,130,251,0.3),0 0 0 1px var(--b2);
}
.login-logo-img img{width:100%;height:100%;object-fit:contain;}
.login-title{font-size:22px;font-weight:800;letter-spacing:-0.8px;margin-bottom:5px;color:var(--ink);}
.login-sub{font-size:13px;color:var(--ink3);letter-spacing:0.01em;}
.login-err{
  background:rgba(255,59,69,0.08);border:1px solid rgba(255,59,69,0.2);
  border-radius:12px;padding:11px 14px;font-size:13px;color:var(--red);
  margin-bottom:16px;display:none;text-align:center;
}
.login-err.show{display:block;}
.lfield{margin-bottom:18px;}
.lfield label{
  display:block;font-size:10px;font-weight:700;
  color:var(--ink3);letter-spacing:0.12em;
  text-transform:uppercase;margin-bottom:8px;
}
.lfield input{
  width:100%;background:var(--bg2);
  border:1px solid var(--b2);
  border-radius:14px;padding:15px 16px;
  color:var(--ink);font-family:var(--font);font-size:15px;
  outline:none;transition:var(--trans);-webkit-appearance:none;
}
.lfield input:focus{
  border-color:rgba(76,130,251,0.7);
  background:var(--bg3);
  box-shadow:0 0 0 3px rgba(76,130,251,0.15);
}
.lfield input::placeholder{color:var(--ink4);}
.login-btn{
  width:100%;margin-top:10px;padding:16px;border:none;
  border-radius:14px;
  background:var(--blue-g);
  color:#fff;font-family:var(--font);font-size:15px;font-weight:700;
  cursor:pointer;transition:var(--trans);letter-spacing:-0.2px;
  box-shadow:0 4px 24px rgba(76,130,251,0.4);
  position:relative;overflow:hidden;
}
.login-btn::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.12),transparent);
}
.login-btn:active{transform:scale(0.98);}
.login-btn:disabled{opacity:0.4;transform:none;}

/* ── APP SHELL ──────────────────────────────── */
.app{display:flex;flex-direction:column;height:100dvh;overflow:hidden;}

/* ── TOPBAR ─────────────────────────────────── */
.topbar{
  height:calc(52px + env(safe-area-inset-top));
  flex-shrink:0;
  background:rgba(5,5,8,0.8);
  backdrop-filter:blur(32px) saturate(180%);
  -webkit-backdrop-filter:blur(32px) saturate(180%);
  border-bottom:1px solid var(--b0);
  display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 16px 10px;
  padding-top:env(safe-area-inset-top);
  position:relative;z-index:50;
}
.topbar::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(76,130,251,0.3),transparent);
}
.topbar-logo{display:flex;align-items:center;gap:9px;}
.topbar-logo-img{
  width:26px;height:26px;border-radius:8px;
  background:var(--bg2);overflow:hidden;
  border:1px solid var(--b2);
}
.topbar-logo-img img{width:100%;height:100%;object-fit:contain;}
.topbar-title{font-size:14px;font-weight:700;letter-spacing:-0.3px;color:var(--ink);}
.topbar-right{display:flex;align-items:center;gap:8px;}
.topbar-avatar{
  width:30px;height:30px;border-radius:50%;
  background:var(--blue-g);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:#fff;
  cursor:pointer;flex-shrink:0;overflow:hidden;
  border:1.5px solid rgba(76,130,251,0.4);
}
.topbar-notif-btn{
  position:relative;width:30px;height:30px;border-radius:50%;
  background:var(--bg2);border:1px solid var(--b1);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;color:var(--ink3);font-size:14px;
}

/* ── CONTENT ────────────────────────────────── */
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;}
.page{
  display:none;padding:18px;
  padding-bottom:calc(90px + env(safe-area-inset-bottom));
  animation:pageIn 0.25s cubic-bezier(0.4,0,0.2,1) both;
}
.page.active{display:block;}
@keyframes pageIn{
  from{opacity:0;transform:translateY(8px);}
  to{opacity:1;transform:translateY(0);}
}

/* ── BOTTOM NAV ─────────────────────────────── */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  height:calc(64px + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(5,5,8,0.85);
  backdrop-filter:blur(40px) saturate(200%);
  -webkit-backdrop-filter:blur(40px) saturate(200%);
  border-top:1px solid var(--b0);
  display:flex;align-items:stretch;
}
.bottom-nav::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(76,130,251,0.25),transparent);
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:5px;cursor:pointer;
  color:var(--ink4);font-size:9px;font-weight:700;
  letter-spacing:0.06em;text-transform:uppercase;
  transition:color 0.2s;position:relative;
  -webkit-tap-highlight-color:transparent;
}
.nav-item.active{color:var(--ink);}
.nav-icon-wrap{
  width:40px;height:26px;border-radius:13px;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);
  font-size:16px;
}
.nav-item.active .nav-icon-wrap{
  background:rgba(76,130,251,0.15);
  transform:translateY(-2px) scale(1.1);
  box-shadow:0 4px 16px rgba(76,130,251,0.2);
}
.nav-item:not(.active):active .nav-icon-wrap{transform:scale(0.84);opacity:0.5;}
/* Pill indicator */
.nav-item.active::after{
  content:'';position:absolute;bottom:4px;
  width:18px;height:2px;border-radius:1px;
  background:var(--blue);
  box-shadow:0 0 10px var(--blue);
  animation:pillIn 0.25s ease both;
}
@keyframes pillIn{from{width:0;opacity:0;}to{width:18px;opacity:1;}}

/* ── SECTION TITLE ──────────────────────────── */
.section-title{
  font-size:20px;font-weight:800;letter-spacing:-0.7px;
  margin-bottom:18px;color:var(--ink);
  display:flex;align-items:center;gap:10px;
}
.section-sub{font-size:12.5px;color:var(--ink3);margin-top:3px;font-weight:400;}

/* ── CARD ────────────────────────────────────── */
.card{
  background:var(--bg1);
  border:1px solid var(--b1);
  border-radius:var(--r3);
  overflow:hidden;margin-bottom:12px;
  transition:border-color 0.2s;
}
.card:hover{border-color:var(--b2);}
.card-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;border-bottom:1px solid var(--b0);
}
.card-title{font-size:12.5px;font-weight:700;letter-spacing:0.01em;color:var(--ink2);text-transform:uppercase;letter-spacing:0.06em;}

/* ── METRIC CARDS ───────────────────────────── */
.metrics-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.metric-card{
  background:var(--bg1);border:1px solid var(--b1);
  border-radius:var(--r3);padding:18px 16px;
  display:flex;flex-direction:column;gap:8px;
  position:relative;overflow:hidden;cursor:pointer;
  transition:var(--trans);
  -webkit-tap-highlight-color:transparent;
}
.metric-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1.5px;
}
.metric-card.blue::before{background:linear-gradient(90deg,transparent,var(--blue),transparent);}
.metric-card.green::before{background:linear-gradient(90deg,transparent,var(--green),transparent);}
.metric-card.purple::before{background:linear-gradient(90deg,transparent,var(--purple),transparent);}
.metric-card.orange::before{background:linear-gradient(90deg,transparent,var(--orange),transparent);}
.metric-card::after{
  content:'';position:absolute;top:-30px;right:-30px;
  width:100px;height:100px;border-radius:50%;opacity:0.05;
}
.metric-card.blue::after{background:var(--blue);}
.metric-card.green::after{background:var(--green);}
.metric-card.purple::after{background:var(--purple);}
.metric-card.orange::after{background:var(--orange);}
.metric-card:active{transform:scale(0.97);}
.metric-val{font-size:32px;font-weight:900;letter-spacing:-2px;line-height:1;}
.metric-val.blue{color:var(--blue);}
.metric-val.green{color:var(--green);}
.metric-val.purple{color:var(--purple);}
.metric-val.orange{color:var(--orange);}
.metric-lbl{font-size:10.5px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:0.06em;}

/* ── COMPROMISSO ────────────────────────────── */
.compromisso-card{
  background:var(--bg1);border:1px solid var(--b1);
  border-radius:var(--r2);padding:12px 14px;
  display:flex;align-items:center;gap:12px;
  margin-bottom:8px;cursor:pointer;
  transition:var(--trans);-webkit-tap-highlight-color:transparent;
}
.compromisso-card:active{transform:scale(0.98);background:var(--bg2);}
.comp-date{
  min-width:40px;text-align:center;
  background:var(--bg3);border-radius:11px;
  padding:7px 5px;border:1px solid var(--b1);flex-shrink:0;
}
.comp-day{font-size:18px;font-weight:800;line-height:1;color:var(--ink);}
.comp-month{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--ink3);margin-top:2px;}
.comp-info{flex:1;min-width:0;}
.comp-titulo{font-size:13px;font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.comp-meta{font-size:11.5px;color:var(--ink3);}

/* ── CLIENTE CARD ───────────────────────────── */
.cliente-card{
  background:var(--bg1);border:1px solid var(--b1);
  border-radius:var(--r2);padding:12px 14px;
  display:flex;align-items:center;gap:12px;
  margin-bottom:8px;cursor:pointer;
  transition:var(--trans);-webkit-tap-highlight-color:transparent;
}
.cliente-card:active{transform:scale(0.97);}
.cliente-avatar{
  width:42px;height:42px;border-radius:13px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:800;color:#fff;overflow:hidden;
}
.cliente-info{flex:1;min-width:0;}
.cliente-nome{font-size:13.5px;font-weight:700;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cliente-meta{font-size:11.5px;color:var(--ink3);}

/* ── KANBAN ─────────────────────────────────── */
.kanban-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -18px;padding:0 18px 8px;}
.kanban{display:flex;gap:10px;width:max-content;}
.k-col{width:230px;background:var(--bg1);border:1px solid var(--b1);border-radius:var(--r2);padding:13px;flex-shrink:0;}
.k-col-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.k-col-label{font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink3);}
.k-count{font-size:10px;background:var(--bg3);border-radius:20px;padding:2px 8px;color:var(--ink3);}
.k-card{
  background:var(--bg2);border:1px solid var(--b1);
  border-radius:var(--r);padding:11px;margin-bottom:7px;cursor:pointer;
  transition:var(--trans);-webkit-tap-highlight-color:transparent;
}
.k-card:active{transform:scale(0.97);}
.k-card-title{font-size:12.5px;font-weight:600;margin-bottom:4px;color:var(--ink);}
.k-card-client{font-size:11px;color:var(--ink3);}
.k-card-val{font-size:11.5px;color:var(--green);font-weight:600;margin-top:7px;}
.k-card-date{font-size:10.5px;color:var(--ink4);margin-top:2px;}
.k-add{
  width:100%;padding:7px;border:1px dashed var(--b2);
  border-radius:8px;background:transparent;color:var(--ink4);
  font-family:var(--font);font-size:11.5px;cursor:pointer;transition:var(--trans);
}
.k-add:active{border-color:var(--blue);color:var(--blue);}

/* ── AGENDA / CALENDÁRIO ────────────────────── */
.cal-wrap{background:var(--bg1);border:1px solid var(--b1);border-radius:var(--r3);margin-bottom:12px;overflow:hidden;}
.cal-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;}
.cal-month-label{font-size:16px;font-weight:800;letter-spacing:-0.4px;}
.cal-nav-btn{width:30px;height:30px;border-radius:9px;border:1px solid var(--b2);background:var(--bg2);color:var(--ink);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--trans);}
.cal-nav-btn:active{background:var(--bg3);}
.cal-dow-row{display:grid;grid-template-columns:repeat(7,1fr);padding:0 10px 3px;}
.cal-dow{text-align:center;font-size:9px;font-weight:700;color:var(--ink4);padding:3px 0;text-transform:uppercase;letter-spacing:0.08em;}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 10px 10px;}
.cal-day{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:background 0.1s;-webkit-tap-highlight-color:transparent;}
.cal-day:active{background:var(--bg3);}
.cal-day.other{opacity:0.25;}
.cal-day.today .cal-day-num{background:var(--blue);color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:700;box-shadow:var(--glow-blue);}
.cal-day-num{font-size:12.5px;font-weight:500;color:var(--ink);}
.cal-day-dot{width:3px;height:3px;border-radius:50%;background:var(--blue);margin-top:2px;}
.event-row{display:flex;align-items:center;gap:11px;padding:11px;background:var(--bg2);border-radius:11px;margin-bottom:7px;cursor:pointer;transition:var(--trans);-webkit-tap-highlight-color:transparent;}
.event-row:active{transform:scale(0.98);}
.event-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.event-dot.captacao{background:var(--blue);}
.event-dot.entrega{background:var(--green);}
.event-dot.reuniao{background:var(--purple);}
.event-dot.outro{background:var(--ink3);}
.event-info{flex:1;min-width:0;}
.event-title{font-size:13px;font-weight:600;margin-bottom:2px;}
.event-meta{font-size:11.5px;color:var(--ink3);}

/* ── BADGES ─────────────────────────────────── */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;}
.badge-ativo,.badge-pago,.badge-aprovada,.badge-entregue,.badge-aprovado{background:rgba(45,212,122,0.1);color:var(--green);border:1px solid rgba(45,212,122,0.2);}
.badge-inativo,.badge-cancelado,.badge-recusada,.badge-atrasado,.badge-pausado{background:rgba(255,59,69,0.1);color:var(--red);border:1px solid rgba(255,59,69,0.2);}
.badge-lead,.badge-rascunho,.badge-briefing{background:rgba(76,130,251,0.1);color:var(--blue);border:1px solid rgba(76,130,251,0.2);}
.badge-pendente,.badge-em_andamento,.badge-enviada{background:rgba(255,154,10,0.1);color:var(--orange);border:1px solid rgba(255,154,10,0.2);}
.badge-revisao{background:rgba(34,211,238,0.1);color:var(--teal);border:1px solid rgba(34,211,238,0.2);}
.badge-assinado{background:rgba(45,212,122,0.1);color:var(--green);border:1px solid rgba(45,212,122,0.2);}
.badge-admin{background:rgba(76,130,251,0.12);color:var(--blue);}
.badge-cliente{background:var(--bg3);color:var(--ink3);}

/* ── FINANCEIRO ─────────────────────────────── */
.fin-cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px;}
.fin-card{background:var(--bg1);border:1px solid var(--b1);border-radius:var(--r2);padding:13px 11px;}
.fin-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink3);margin-bottom:5px;}
.fin-val{font-size:14px;font-weight:800;letter-spacing:-0.3px;}
.fin-val.r{color:var(--green);}
.fin-val.d{color:var(--red);}
.fin-val.s{color:var(--blue);}

/* ── LANÇAMENTO ─────────────────────────────── */
.lancamento{background:var(--bg1);border:1px solid var(--b1);border-radius:var(--r2);padding:12px 14px;display:flex;align-items:center;gap:11px;margin-bottom:8px;cursor:pointer;transition:var(--trans);}
.lancamento:active{transform:scale(0.98);}
.lancamento-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.lancamento-info{flex:1;min-width:0;}
.lancamento-desc{font-size:13px;font-weight:500;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lancamento-meta{font-size:11.5px;color:var(--ink3);}
.lancamento-val{font-size:14.5px;font-weight:800;flex-shrink:0;}

/* ── SEARCH ─────────────────────────────────── */
.search-bar{display:flex;align-items:center;gap:9px;background:var(--bg2);border:1px solid var(--b1);border-radius:13px;padding:10px 13px;margin-bottom:14px;}
.search-bar input{flex:1;background:none;border:none;color:var(--ink);font-family:var(--font);font-size:14px;outline:none;}
.search-bar input::placeholder{color:var(--ink4);}
.search-icon{color:var(--ink4);font-size:14px;}

/* ── FAB ─────────────────────────────────────── */
.fab-wrap{position:fixed;bottom:calc(74px + env(safe-area-inset-bottom));right:16px;z-index:200;display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
.fab-main{
  width:50px;height:50px;border-radius:50%;border:none;cursor:pointer;
  background:var(--blue-g);color:#fff;font-size:22px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 24px rgba(76,130,251,0.5);
  transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
.fab-main.open{transform:rotate(45deg);}
.fab-items{display:flex;flex-direction:column;align-items:flex-end;gap:7px;opacity:0;pointer-events:none;transform:translateY(10px);transition:all 0.22s ease;}
.fab-items.open{opacity:1;pointer-events:all;transform:translateY(0);}
.fab-item{display:flex;align-items:center;gap:9px;cursor:pointer;background:rgba(13,13,23,0.95);border:1px solid var(--b2);border-radius:20px;padding:9px 14px 9px 10px;box-shadow:0 8px 32px rgba(0,0,0,0.6);transition:var(--trans);backdrop-filter:blur(20px);}
.fab-item:active{transform:scale(0.96);}
.fab-item-icon{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.fab-item-label{font-size:12.5px;font-weight:600;color:var(--ink);}

/* ── MODAL ───────────────────────────────────── */
.overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.75);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:flex;align-items:flex-end;justify-content:center;
  z-index:1000;opacity:0;pointer-events:none;transition:opacity 0.22s;
}
.overlay.open{opacity:1;pointer-events:all;}
.modal{
  background:var(--bg1);
  border:1px solid var(--b2);border-bottom:none;
  border-radius:28px 28px 0 0;
  width:100%;max-width:600px;
  max-height:92dvh;overflow-y:auto;
  transform:translateY(100%);
  transition:transform 0.32s cubic-bezier(0.32,0.72,0,1);
  padding-bottom:env(safe-area-inset-bottom);
}
.overlay.open .modal{transform:translateY(0);}
.modal-handle{width:32px;height:3px;background:var(--b2);border-radius:2px;margin:11px auto 0;}
.modal-head{padding:15px 20px 13px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--b0);}
.modal-title{font-size:16px;font-weight:800;letter-spacing:-0.4px;}
.modal-x{width:26px;height:26px;border-radius:50%;border:none;cursor:pointer;background:var(--bg3);color:var(--ink2);font-size:13px;display:flex;align-items:center;justify-content:center;transition:var(--trans);}
.modal-x:active{background:var(--bg4);}
.modal-body{padding:16px 20px;display:flex;flex-direction:column;gap:13px;}
.modal-foot{padding:12px 20px;border-top:1px solid var(--b0);display:flex;gap:8px;justify-content:flex-end;}
.modal-section{font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink4);padding-bottom:7px;border-bottom:1px solid var(--b0);margin-bottom:2px;}

/* ── FORMS ───────────────────────────────────── */
.fg{display:flex;flex-direction:column;gap:6px;}
.fg label{font-size:10px;font-weight:700;color:var(--ink3);letter-spacing:0.08em;text-transform:uppercase;}
.fg input,.fg select,.fg textarea{
  background:var(--bg2);border:1px solid var(--b1);
  border-radius:12px;color:var(--ink);font-family:var(--font);
  font-size:15px;padding:11px 13px;outline:none;
  transition:var(--trans);width:100%;-webkit-appearance:none;
}
.fg input:focus,.fg select:focus,.fg textarea:focus{
  border-color:rgba(76,130,251,0.6);
  background:var(--bg3);
  box-shadow:0 0 0 3px rgba(76,130,251,0.1);
}
.fg input::placeholder,.fg textarea::placeholder{color:var(--ink4);}
.fg select option{background:var(--bg2);}
.fg textarea{resize:vertical;min-height:80px;}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}

/* ── BOTÕES ──────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 17px;border-radius:11px;border:none;cursor:pointer;
  font-family:var(--font);font-size:13px;font-weight:700;
  transition:var(--trans);-webkit-tap-highlight-color:transparent;
  letter-spacing:-0.1px;
}
.btn:active{transform:scale(0.95);}
.btn-primary{
  background:var(--blue-g);color:#fff;
  box-shadow:0 3px 16px rgba(76,130,251,0.35);
  position:relative;overflow:hidden;
}
.btn-primary::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.1),transparent);}
.btn-primary:active{opacity:0.88;}
.btn-ghost{background:var(--bg2);border:1px solid var(--b2);color:var(--ink2);}
.btn-ghost:active{background:var(--bg3);}
.btn-danger{background:rgba(255,59,69,0.1);border:1px solid rgba(255,59,69,0.2);color:var(--red);}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:9px;}
.btn-xs{padding:5px 10px;font-size:11px;border-radius:8px;}

/* ── TOAST ───────────────────────────────────── */
#toasts{
  position:fixed;top:calc(16px + env(safe-area-inset-top));
  left:50%;transform:translateX(-50%);
  z-index:9998;display:flex;flex-direction:column;gap:8px;
  align-items:center;pointer-events:none;
  width:90vw;max-width:360px;
}
.toast{
  display:flex;align-items:center;gap:9px;
  background:rgba(13,13,23,0.97);
  border:1px solid var(--b2);border-radius:22px;
  padding:10px 18px;font-size:13px;font-weight:600;
  backdrop-filter:blur(24px);
  box-shadow:0 4px 28px rgba(0,0,0,0.6);
  white-space:nowrap;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;
  animation:toastIn 0.3s cubic-bezier(0.34,1.56,0.64,1) both,toastOut 0.2s 2.7s ease both;
}
.toast.ok .toast-dot{background:var(--green);box-shadow:0 0 8px var(--green);}
.toast.er .toast-dot{background:var(--red);}
.toast-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
@keyframes toastIn{from{opacity:0;transform:translateY(-12px) scale(0.88);}to{opacity:1;transform:none;}}
@keyframes toastOut{from{opacity:1;}to{opacity:0;transform:translateY(-8px);}}

/* ── EMPTY STATE ─────────────────────────────── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:52px 24px;text-align:center;gap:10px;}
.empty-icon{font-size:40px;opacity:0.2;margin-bottom:6px;}
.empty p{color:var(--ink3);font-size:14px;line-height:1.6;}

/* ── PORTAL GREETING ─────────────────────────── */
.portal-greeting{
  background:linear-gradient(135deg,rgba(76,130,251,0.1),rgba(168,85,247,0.07));
  border:1px solid rgba(76,130,251,0.18);
  border-radius:var(--r3);padding:20px;margin-bottom:14px;
  position:relative;overflow:hidden;
}
.portal-greeting::before{
  content:'';position:absolute;top:-40px;right:-40px;
  width:140px;height:140px;border-radius:50%;
  background:radial-gradient(circle,rgba(76,130,251,0.12),transparent 70%);
}
.portal-greeting-hora{font-size:10.5px;color:rgba(76,130,251,0.8);font-weight:700;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:5px;}
.portal-greeting-nome{font-size:23px;font-weight:900;letter-spacing:-0.8px;margin-bottom:4px;}
.portal-greeting-empresa{font-size:12.5px;color:var(--ink3);}
.portal-kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.portal-kpi{background:var(--bg1);border:1px solid var(--b1);border-radius:var(--r2);padding:14px;cursor:pointer;transition:var(--trans);}
.portal-kpi:active{transform:scale(0.97);}
.portal-kpi-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink3);margin-bottom:7px;}
.portal-kpi-val{font-size:24px;font-weight:900;letter-spacing:-1px;}

/* ── SIDEBAR CLIENTE ─────────────────────────── */
.cliente-sidebar-overlay{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,0.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity 0.28s ease;}
.cliente-sidebar-overlay.open{opacity:1;pointer-events:all;}
.cliente-sidebar{
  position:fixed;bottom:0;left:0;right:0;z-index:401;
  background:rgba(10,10,18,0.98);
  backdrop-filter:blur(48px);-webkit-backdrop-filter:blur(48px);
  border:1px solid var(--b2);border-bottom:none;
  border-radius:26px 26px 0 0;
  transform:translateY(100%);
  transition:transform 0.35s cubic-bezier(0.32,0.72,0,1);
  display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);
  max-height:80dvh;
  box-shadow:0 -24px 60px rgba(0,0,0,0.7);
}
.cliente-sidebar.open{transform:translateY(0);}
.sidebar-handle{width:32px;height:3px;border-radius:2px;background:var(--b2);margin:12px auto 4px;flex-shrink:0;}
.sidebar-header{padding:12px 20px 14px;display:flex;align-items:center;gap:13px;flex-shrink:0;border-bottom:1px solid var(--b0);}
.sidebar-avatar{width:44px;height:44px;border-radius:13px;flex-shrink:0;background:var(--blue-g);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff;overflow:hidden;}
.sidebar-nome{font-size:14px;font-weight:700;margin-bottom:2px;}
.sidebar-empresa{font-size:11.5px;color:var(--ink3);}
.sidebar-nav{flex:1;overflow-y:auto;padding:14px 16px;}
.sidebar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding-bottom:4px;}
.sidebar-grid-item{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:14px 6px;border-radius:16px;cursor:pointer;
  background:var(--bg2);border:1px solid var(--b1);
  -webkit-tap-highlight-color:transparent;
  transition:var(--trans);
}
.sidebar-grid-item:active{transform:scale(0.92);background:rgba(76,130,251,0.1);}
.sidebar-grid-item.active{background:rgba(76,130,251,0.12);border-color:rgba(76,130,251,0.25);}
.sidebar-grid-icon{font-size:20px;line-height:1;}
.sidebar-grid-label{font-size:9.5px;font-weight:700;color:var(--ink3);text-align:center;letter-spacing:0.04em;text-transform:uppercase;}
.sidebar-grid-item.active .sidebar-grid-label{color:var(--blue);}
.sidebar-footer{padding:12px 16px 4px;flex-shrink:0;border-top:1px solid var(--b0);}

/* ── NOTIFICAÇÕES ───────────────────────────── */
#notif-badge{
  position:absolute;top:-3px;right:-3px;
  min-width:16px;height:16px;border-radius:8px;
  background:var(--red);color:#fff;
  font-size:9px;font-weight:800;
  display:none;align-items:center;justify-content:center;
  padding:0 3px;
  box-shadow:0 0 8px var(--red);
}

/* ── LEMBRETE ────────────────────────────────── */
.lembrete-banner{overflow:hidden;max-height:0;transition:max-height 0.3s ease;}
.lembrete-banner.show{max-height:100px;}
.lembrete-inner{
  background:linear-gradient(135deg,rgba(76,130,251,0.12),rgba(76,130,251,0.06));
  border-bottom:1px solid rgba(76,130,251,0.2);
  padding:10px 16px;display:flex;align-items:center;gap:10px;
}
.lembrete-pulse{width:8px;height:8px;border-radius:50%;background:var(--blue);flex-shrink:0;animation:pulse 1.5s ease infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.5;transform:scale(1.3);}}

/* ── MISC ────────────────────────────────────── */
::-webkit-scrollbar{width:0;height:0;}
</style>
</head>

      currentClienteId=cl.id;

        {id:user.id,email:user.email,role:'cliente',cliente_id:cl.id,created_at:new Date().toISOString()},

    });

// ── FINANCEIRO ──
async function renderFin(){
  const[rf,rc]=await Promise.all([
    db.from('financeiro').select('*').order('created_at',{ascending:false}),
    db.from('clientes').select('id,nome_completo')
  ]);
  financeiro=rf.data||[];clientes=rc.data||[];
  const rec=financeiro.filter(x=>x.tipo==='receita').reduce((a,b)=>a+(b.valor||0),0);
  const des=financeiro.filter(x=>x.tipo==='despesa').reduce((a,b)=>a+(b.valor||0),0);
  const pend=financeiro.filter(x=>x.status==='pendente').reduce((a,b)=>a+(b.valor||0),0);
  setPage('financeiro',`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <div class="section-title" style="margin:0">Financeiro</div>
      <button class="btn btn-primary btn-sm" onclick="formFin()">+ Lançamento</button>
    </div>
    <div class="fin-cards">
      <div class="fin-card"><div class="fin-lbl">Receitas</div><div class="fin-val r">${R(rec)}</div></div>
      <div class="fin-card"><div class="fin-lbl">Despesas</div><div class="fin-val d">${R(des)}</div></div>
      <div class="fin-card"><div class="fin-lbl">Pendente</div><div class="fin-val s">${R(pend)}</div></div>
    </div>
    ${financeiro.length===0?'<div class="empty"><div class="empty-icon">💰</div><p>Nenhum lançamento</p></div>':''}
    ${financeiro.map(f=>{
      const cl=clientes.find(c=>c.id===f.cliente_id);
      const isRec=f.tipo==='receita';
      return`<div class="lancamento" onclick="formFin('${f.id}')">
        <div class="lancamento-icon" style="background:${isRec?'rgba(52,199,89,0.12)':'rgba(255,69,58,0.12)'}">${isRec?'💚':'❤️'}</div>

          <div class="lancamento-val" style="color:${isRec?'var(--green)':'var(--red)'}">${R(f.valor)}</div>
          ${badge(f.status)}
        </div>
      </div>`;
    }).join('')}
  `);
}

      <div class="empty">

  const[{data:cl},{data:prj},{data:fin},{data:ag},{data:met}]=await Promise.all([

    db.from('financeiro').select('*').eq('cliente_id',currentClienteId).eq('tipo','receita').order('vencimento',{ascending:true}),
    db.from('agenda').select('*').eq('cliente_id',currentClienteId).gte('data',hojeStr).order('data').limit(3),
    db.from('metricas_campanha').select('*').eq('cliente_id',currentClienteId).order('mes',{ascending:false}).limit(1)
  ]);

  const c=cl||{};
  const primeiroNome=c.nome_completo?c.nome_completo.split(' ')[0]:'';

  // Atualiza sidebar com info do cliente
  atualizarSidebarInfo(c.nome_completo,c.empresa,c.logo_url);

  // Stats
  const projAtivos=(prj||[]).filter(x=>x.status==='em_andamento').length;
  const proxEvento=(ag||[])[0];
  const parcelaPendente=(fin||[]).find(x=>x.status==='pendente');

  let mostrarAlerta=false;

  let diasFaltam=0;
  if(parcelaPendente){
    const venc=new Date(parcelaPendente.vencimento+'T00:00:00');

    const isMesVenc=venc.getMonth()===hoje.getMonth()&&venc.getFullYear()===hoje.getFullYear();
    mostrarAlerta=isAtrasado||(isMesVenc&&hoje.getDate()>=1);

                :`<div style="width:100%;height:100%;border-radius:50%;background:${avatarColor(c.nome_completo||'?')};display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff">${initials(c.nome_completo||'?')}</div>`
              }
            </div>
          </div>
        </div>

          <div class="portal-greeting-hora">${saudacao}</div>
          <div class="portal-greeting-nome">${primeiroNome||'Bem-vindo'} 👋</div>

      </div>
      ${c.drive_url||c.link_extra?`
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${c.drive_url?`<a href="${c.drive_url}" target="_blank" style="display:inline-flex;align-items:center;gap:4px;background:rgba(79,142,255,0.15);color:var(--blue);border:1px solid rgba(79,142,255,0.25);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;text-decoration:none">◫ Meus arquivos</a>`:''}
        ${c.link_extra?`<a href="${c.link_extra}" target="_blank" style="display:inline-flex;align-items:center;gap:4px;background:rgba(191,90,242,0.15);color:var(--purple);border:1px solid rgba(191,90,242,0.25);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;text-decoration:none">◉ Link extra</a>`:''}
      </div>`:''}
    </div>

    <!-- ALERTA PAGAMENTO -->
    ${mostrarAlerta&&parcelaPendente?`
    <div style="background:linear-gradient(135deg,rgba(255,159,10,0.12),rgba(255,69,58,0.08));border:1px solid rgba(255,159,10,0.3);border-radius:18px;padding:16px;margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">

        <div class="portal-kpi-lbl">Investimento</div>
        <div class="portal-kpi-val" style="color:var(--orange);font-size:16px">${R(metricaMes.investimento||0)}</div>
        <div style="font-size:11px;color:var(--ink3);margin-top:4px">${metricaMes.alcance||0} alcance</div>
      </div>`:`

        <div class="portal-kpi-lbl">Métricas de campanha</div>
        <div style="font-size:13px;color:var(--ink3);margin-top:4px">Nenhuma métrica disponível</div>

    ${(ag||[]).length>0?`

    <!-- PROJETOS -->

    </div>


  `);
}

async function tentarVincularCliente(){
  if(!currentUser)return;
  const{data:cl}=await db.from('clientes').select('id').eq('email',currentUser.email).single();
  if(cl?.id){
    currentClienteId=cl.id;
    await db.from('profiles').upsert({id:currentUser.id,email:currentUser.email,role:'cliente',cliente_id:cl.id,created_at:new Date().toISOString()},{onConflict:'id'});
    toast('Conta vinculada! Recarregando…');
    setTimeout(()=>location.reload(),1000);
  } else {
    toast('Email não encontrado na base de clientes','er');
  }
}

async function verificarSenhaFin(){
  const senha=document.getElementById('fin-senha')?.value;
  // Verifica a senha do usuário atual no Supabase Auth
  const{error}=await db.auth.signInWithPassword({email:currentUser.email,password:senha});
  if(error){

    if(err)err.style.display='block';

  }
  finDesbloqueado=true;
  await mostrarFinanceiro();

async function mostrarFinanceiro(){
  const{data:lanc}=await db.from('financeiro').select('*').eq('cliente_id',currentClienteId).eq('tipo','receita').order('vencimento',{ascending:true});
  const hoje=new Date();
  const pago=(lanc||[]).filter(x=>x.status==='pago').reduce((a,b)=>a+(b.valor||0),0);

function gerarPixBRCode(chave, valor, nome, cidade){
  // Gera o payload Pix padrão BC (EMV)
  const pixKey=chave;
  const merchantName=nome.substring(0,25).toUpperCase();
  const merchantCity=cidade.substring(0,15).toUpperCase();
  const amount=parseFloat(valor).toFixed(2);

  function tlv(id,value){const len=String(value.length).padStart(2,'0');return id+len+value;}

  const merchantAccountInfo=tlv('00','BR.GOV.BCB.PIX')+tlv('01',pixKey);
  const payload=
    tlv('00','01')+
    tlv('26',merchantAccountInfo)+
    tlv('52','0000')+
    tlv('53','986')+
    tlv('54',amount)+
    tlv('58','BR')+
    tlv('59',merchantName)+
    tlv('60',merchantCity)+
    '6304';

  // CRC16
  function crc16(str){
    let crc=0xFFFF;
    for(let i=0;i<str.length;i++){
      crc^=str.charCodeAt(i)<<8;
      for(let j=0;j<8;j++) crc=(crc&0x8000)?(crc<<1)^0x1021:(crc<<1);
    }
    return(crc&0xFFFF).toString(16).toUpperCase().padStart(4,'0');
  }

  return payload+crc16(payload);
}

function previewLogo(input){
  const file=input.files[0];
  if(!file)return;
  // Comprime para base64 menor
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas');
      const size=200;
      canvas.width=size;canvas.height=size;
      const ctx=canvas.getContext('2d');
      // Crop quadrado centralizado
      const min=Math.min(img.width,img.height);
      const sx=(img.width-min)/2,sy=(img.height-min)/2;
      ctx.drawImage(img,sx,sy,min,min,0,0,size,size);
      const b64=canvas.toDataURL('image/jpeg',0.75);
      const input_hidden=document.getElementById('f-logo-url');
      if(input_hidden)input_hidden.value=b64;
      const preview=document.getElementById('logo-preview');
      if(preview)preview.innerHTML=`<img src="${b64}" style="width:100%;height:100%;object-fit:cover">`;
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

async function saveCliente(id){
  const nome=val('f-nome').trim();
  if(!nome){toast('Nome obrigatório','er');return;}
  const email=val('f-email').trim();
  const wpp=val('f-wpp').trim(); // captura ANTES de fechar
  const SENHA='5essencia';
  const payload={nome_completo:nome,cpf:val('f-cpf').replace(/\D/g,'')||null,email:email||null,whatsapp:wpp||null,empresa:val('f-empresa')||null,cnpj:val('f-cnpj').replace(/\D/g,'')||null,whatsapp_financeiro:val('f-wpp-fin')||null,drive_url:val('f-drive')||null,link_extra:val('f-link-extra')||null,endereco_rua:val('f-rua')||null,endereco_bairro:val('f-bairro')||null,endereco_cidade:val('f-cidade')||null,endereco_uf:val('f-uf').toUpperCase()||null,endereco_cep:val('f-cep')||null,notas:val('f-notas')||null,status:g('f-status')?.value||'ativo',logo_url:g('f-logo-url')?.value||null};

  const{data:saved,error}=id
    ?await db.from('clientes').update(payload).eq('id',id).select()
    :await db.from('clientes').insert(payload).select();
  if(error){toast('Erro: '+error.message,'er');return;}

  const clienteId=saved?.[0]?.id;

  if(!id&&email&&clienteId){
    const btn=document.querySelector('#m-foot .btn-primary');
    if(btn){btn.textContent='Criando acesso…';btn.disabled=true;}

    let result={};
    try{
      const res=await fetch('https://zebudefzhakitwjswvkl.supabase.co/functions/v1/quick-handler',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':`Bearer ${ANON_KEY}`},
        body:JSON.stringify({email,password:SENHA,role:'cliente',cliente_id:clienteId})
      });
      result=await res.json();
    }catch(fetchErr){
      toast('Erro de rede: '+fetchErr.message,'er');
      closeModal();renderClientes();return;
    }

    closeModal();
    renderClientes();

    if(result.error){
      // Se email já existe, tenta vincular o usuário existente ao cliente
      if(result.error.includes('already been registered')||result.error.includes('already exists')){
        const{data:perfExist}=await db.from('profiles').select('id').eq('email',email).single();
        if(perfExist?.id){
          await db.from('profiles').update({cliente_id:clienteId}).eq('id',perfExist.id);
          await db.from('clientes').update({user_id:perfExist.id}).eq('id',clienteId);
          toast(`✓ Acesso vinculado! Login: ${email} · Senha existente`);
          emailBoasVindas(nome,email);
          if(wpp){
            setTimeout(()=>{
              if(confirm(`Enviar boas-vindas para ${nome.split(' ')[0]} via WhatsApp?`)){
                enviarWppCliente(nome,wpp,email);
              }
            },300);
          }
        } else {
          toast('Email já cadastrado — acesse o Supabase para verificar o usuário','er');
        }
      } else {
        toast('Cliente salvo, mas erro no acesso: '+result.error,'er');
      }
    } else {
      await db.from('clientes').update({user_id:result.id}).eq('id',clienteId);
      toast(`✓ Acesso criado! Login: ${email} · Senha: ${SENHA}`);
      emailBoasVindas(nome,email);
      if(wpp){
        setTimeout(()=>{
          if(confirm(`Enviar boas-vindas para ${nome.split(' ')[0]} via WhatsApp?`)){
            enviarWppCliente(nome,wpp,email);
          }
        },300);
      }
    }
    return;
  }

  toast(id?'Cliente atualizado':'Cliente criado');closeModal();renderClientes();
}

        </div>
      </div>
      <div id="preview-parcelas" style="margin-top:10px;font-size:12.5px;color:var(--ink3)"></div>
    </div>`:`
    <div class="frow">
      <div class="fg"><label>Status</label>
        <select id="fs">${['pendente','pago','atrasado','cancelado'].map(s=>`<option value="${s}" ${f.status===s?'selected':''}>${s.charAt(0).toUpperCase()+s.slice(1)}</option>`).join('')}</select>
      </div>
      <div class="fg"><label>Vencimento</label><input id="fvc" type="date" value="${f.vencimento||''}"></div>

    <button class="btn btn-primary" onclick="saveFin('${id||''}')">Salvar</button>
  `);
  if(!id) setTimeout(atualizarPreviewParcelas,50);
}

function atualizarPreviewParcelas(){
  const nparc=parseInt(g('f-nparc')?.value)||1;
  const valor=parseFloat(g('fv')?.value)||0;
  const mesIni=g('f-venc-ini')?.value;
  const preview=g('preview-parcelas');
  if(!preview||!valor) return;
  const valorParc=valor/nparc;
  let html='';
  for(let i=0;i<Math.min(nparc,4);i++){
    const d=new Date(mesIni+'-01');
    d.setMonth(d.getMonth()+i);
    const mes=MESES[d.getMonth()];
    const ano=d.getFullYear();
    html+=`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border)">
      <span>Parcela ${i+1}/${nparc} — ${mes}/${ano}</span>
      <span style="font-weight:600;color:var(--blue)">${R(valorParc)}</span>
    </div>`;
  }
  if(nparc>4) html+=`<div style="text-align:center;padding:4px 0;color:var(--ink4)">+ ${nparc-4} parcelas…</div>`;
  if(nparc===1) html=`<div style="text-align:center;padding:4px 0;color:var(--green);font-weight:600">✓ Pagamento à vista — ${R(valor)}</div>`;
  preview.innerHTML=html;
}

async function saveFin(id){
  const desc=val('fd').trim(),valor=parseFloat(val('fv'));
  if(!desc||!valor){toast('Descrição e valor obrigatórios','er');return;}

  // Edição simples
  if(id){
    const payload={descricao:desc,valor,tipo:g('ft')?.value||'receita',cliente_id:val('fc')||null,status:g('fs')?.value||'pendente',vencimento:val('fvc')||null};
    const{error}=await db.from('financeiro').update(payload).eq('id',id);
    if(error){toast('Erro: '+error.message,'er');return;}
    toast('Lançamento atualizado');closeModal();renderPagamentos();return;
  }

  // Criação com parcelamento
  const nparc=parseInt(g('f-nparc')?.value)||1;
  const mesIni=g('f-venc-ini')?.value;
  const tipo=g('ft')?.value||'receita';
  const clienteId=val('fc')||null;
  const valorParc=parseFloat((valor/nparc).toFixed(2));
  const parcelas=[];

  for(let i=0;i<nparc;i++){
    const d=new Date(mesIni+'-10');
    d.setMonth(d.getMonth()+i);
    const venc=d.toISOString().split('T')[0];
    parcelas.push({
      descricao:nparc===1?desc:`${desc} — ${i+1}/${nparc}`,
      valor:i===nparc-1?parseFloat((valor-(valorParc*(nparc-1))).toFixed(2)):valorParc, // última parcela ajusta centavos
      tipo,
      cliente_id:clienteId,
      status:'pendente',
      vencimento:venc,
      parcela_num:i+1,
      total_parcelas:nparc
    });
  }

  const{error}=await db.from('financeiro').insert(parcelas);
  if(error){toast('Erro: '+error.message,'er');return;}
  toast(nparc===1?'Lançamento criado!':` ${nparc} parcelas criadas!`);
  closeModal();renderPagamentos();
}

async function delFin(id){
  if(!confirm('Excluir este lançamento?'))return;
  await db.from('financeiro').delete().eq('id',id);
  toast('Removido');closeModal();renderPagamentos();
}

let finMesIdx=0;

async function renderPagamentos(){
  const[rf,rc]=await Promise.all([
    db.from('financeiro').select('*').order('vencimento',{ascending:true}),
    db.from('clientes').select('id,nome_completo')
  ]);
  financeiro=rf.data||[];clientes=rc.data||[];

  // Monta lista de meses únicos com lançamentos
  const mesesSet=new Set();
  const hoje=new Date();
  const mesAtual=`${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,'0')}`;
  mesesSet.add(mesAtual);
  financeiro.forEach(f=>{
    if(f.vencimento)mesesSet.add(f.vencimento.slice(0,7));
  });
  const meses=[...mesesSet].sort().reverse(); // mais recente primeiro
  if(finMesIdx>=meses.length)finMesIdx=0;

  renderPagamentosMes(meses,financeiro,clientes);
}

function renderPagamentosMes(meses,todos,cls){

  const receitas=doMes.filter(f=>f.tipo==='receita');
  const despesas=doMes.filter(f=>f.tipo==='despesa');

  const recPago=receitas.filter(f=>f.status==='pago').reduce((a,b)=>a+(b.valor||0),0);
  const recPendente=receitas.filter(f=>f.status==='pendente').reduce((a,b)=>a+(b.valor||0),0);
  const recAtrasado=receitas.filter(f=>f.status==='pendente'&&f.vencimento<hoje).reduce((a,b)=>a+(b.valor||0),0);
  const totalReceita=receitas.reduce((a,b)=>a+(b.valor||0),0);
  const totalDespesa=despesas.reduce((a,b)=>a+(b.valor||0),0);
  const saldo=recPago-totalDespesa;
  const pct=totalReceita>0?Math.round(recPago/totalReceita*100):0;

          <div style="font-size:30px;font-weight:800;letter-spacing:-1px;color:var(--green)">${R(recPago)}</div>
          ${recPendente>0?`<div style="font-size:12px;color:var(--orange);margin-top:2px">+ ${R(recPendente)} a receber</div>`:''}
          ${recAtrasado>0?`<div style="font-size:12px;color:var(--red);margin-top:2px">⚠ ${R(recAtrasado)} em atraso</div>`:''}

          <div style="font-size:20px;font-weight:700;color:${saldo>=0?'var(--green)':'var(--red)'}">${R(saldo)}</div>
          ${totalDespesa>0?`<div style="font-size:11px;color:var(--red);margin-top:2px">- ${R(totalDespesa)} saídas</div>`:''}

function navFinMes(dir){
  const todos=financeiro;
  const mesesSet=new Set();
  const hoje=new Date();
  const mesAtual=`${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,'0')}`;
  mesesSet.add(mesAtual);
  todos.forEach(f=>{if(f.vencimento)mesesSet.add(f.vencimento.slice(0,7));});
  const meses=[...mesesSet].sort().reverse();
  finMesIdx=Math.max(0,Math.min(meses.length-1,finMesIdx+dir));
  renderPagamentosMes(meses,todos,clientes);
}

async function sincronizarGoogleAgenda(titulo,data,hora,descricao,tipo,clienteId){
  try{

      toast('Conecte o Google Agenda para sincronizar','er');

    await criarEventoGCal(titulo,data,hora,descricao,tipo,clienteId);
  }catch(e){
    console.warn('Sync Google Agenda:',e);
  }
}

async function criarEventoGCal(titulo,data,hora,descricao,tipo,clienteId){
  const inicio=hora?`${data}T${hora}:00`:`${data}T09:00:00`;
  const[h,m]=hora?(hora.split(':').map(Number)):[9,0];
  const fimM=m+30;const fimH=h+(fimM>=60?1:0);
  const fim=`${data}T${String(fimH).padStart(2,'0')}:${String(fimM%60).padStart(2,'0')}:00`;

  // Cor por tipo: captacao=azul, entrega=verde, reuniao=roxo, outro=cinza
  const cores={captacao:'9',entrega:'2',reuniao:'3',outro:'8'};

  // Busca email do cliente se vinculado
  let attendees=[];
  if(clienteId){
    const cl=clientes.find(c=>c.id===clienteId);
    if(cl?.email)attendees=[{email:cl.email}];
  }

  const evento={
    summary:`${titulo}`,
    description:`${descricao||''}\n\nTipo: ${tipo}\nAgendado via 5essência`.trim(),
    start:{dateTime:inicio,timeZone:'America/Sao_Paulo'},
    end:{dateTime:fim,timeZone:'America/Sao_Paulo'},
    colorId:cores[tipo]||'8',
    attendees,
    reminders:{useDefault:false,overrides:[{method:'popup',minutes:30},{method:'email',minutes:60}]},
    ...(tipo==='reuniao'?{conferenceData:{createRequest:{requestId:Math.random().toString(36).slice(2),conferenceSolutionKey:{type:'hangoutsMeet'}}}}:{})
  };

  const url=tipo==='reuniao'
    ?'https://www.googleapis.com/calendar/v3/calendars/primary/events?conferenceDataVersion=1&sendUpdates=all'
    :'https://www.googleapis.com/calendar/v3/calendars/primary/events?sendUpdates=all';

  const res=await fetch(url,{
    method:'POST',
    headers:{'Authorization':`Bearer ${gcalToken}`,'Content-Type':'application/json'},
    body:JSON.stringify(evento)
  });
  const result=await res.json();
  if(result.error)throw new Error(result.error.message);
  toast('✓ Sincronizado com Google Agenda!');
}

// GOOGLE MEET
function loadGapiScript(){
  return new Promise(res=>{
    if(window.google?.accounts){res();return;}
    const s=document.createElement('script');
    s.src='https://accounts.google.com/gsi/client';
    s.onload=res;document.head.appendChild(s);
  });
}
async function initGcalClient(){
  await loadGapiScript();
  if(gcalClient)return;
  gcalClient=google.accounts.oauth2.initTokenClient({
    client_id:GCAL_CLIENT_ID,scope:GCAL_SCOPES,
    callback:(resp)=>{
      if(resp.error){toast('Erro Google: '+resp.error,'er');return;}
      gcalToken=resp.access_token;
      // Após conectar, executa ação pendente

async function executarCriacaoMeet(){
  const titulo=val('ev-titulo').trim(),data=val('ev-data'),hora=val('ev-hora');
  const clienteId=val('ev-cliente');
  const clienteSel=clientes.find(c=>c.id===clienteId);

  const[h,m]=hora?(hora.split(':').map(Number)):[9,0];
  const fimM=m+30;const fimH=h+(fimM>=60?1:0);
  const fim=`${data}T${String(fimH).padStart(2,'0')}:${String(fimM%60).padStart(2,'0')}:00`;
  const evento={summary:titulo,description:val('ev-desc')||'',start:{dateTime:inicio,timeZone:'America/Sao_Paulo'},end:{dateTime:fim,timeZone:'America/Sao_Paulo'},conferenceData:{createRequest:{requestId:Math.random().toString(36).slice(2),conferenceSolutionKey:{type:'hangoutsMeet'}}},attendees:clienteSel?.email?[{email:clienteSel.email}]:[],reminders:{useDefault:false,overrides:[{method:'email',minutes:60},{method:'popup',minutes:30}]}};

      toast('✓ Link do Meet gerado!');

}

async function iniciarLembretes(){
  if(currentRole!=='cliente'||!currentClienteId)return;
  await verificarProximaReuniao();
  if(lembreteInterval)clearInterval(lembreteInterval);
  lembreteInterval=setInterval(verificarProximaReuniao,60000);
}
async function verificarProximaReuniao(){
  const agora=new Date();
  const hojeStr=agora.toISOString().split('T')[0];
  const{data:eventos}=await db.from('agenda').select('*').eq('tipo','reuniao').eq('cliente_id',currentClienteId).eq('data',hojeStr).not('hora','is',null).not('meet_link','is',null);
  if(!eventos||eventos.length===0){esconderLembrete();return;}
  let maisProxima=null;let menorDiff=Infinity;
  for(const ev of eventos){
    const[h,m]=ev.hora.split(':').map(Number);
    const dataEvento=new Date(agora);dataEvento.setHours(h,m,0,0);
    const diff=(dataEvento-agora)/60000;
    if(diff>-5&&diff<60&&diff<menorDiff){menorDiff=diff;maisProxima={...ev,diffMin:diff};}
  }
  if(!maisProxima){esconderLembrete();return;}
  proximaReuniaoLink=maisProxima.meet_link;
  const banner=g('lembrete-banner'),pulse=g('lembrete-pulse'),titulo=g('lembrete-titulo'),sub=g('lembrete-sub'),btn=g('lembrete-btn');
  banner?.classList.add('show');
  if(titulo)titulo.textContent=`🎥 ${maisProxima.titulo}`;
  if(maisProxima.diffMin<=0){if(sub)sub.textContent='A reunião já começou!';pulse?.classList.add('urgente');if(btn){btn.disabled=false;btn.textContent='Entrar agora';}}
  else if(maisProxima.diffMin<=10){const mins=Math.ceil(maisProxima.diffMin);if(sub)sub.textContent=`Começa em ${mins} min`;pulse?.classList.add('urgente');if(btn){btn.disabled=false;btn.textContent='Entrar no Meet';}}
  else{const mins=Math.ceil(maisProxima.diffMin);if(sub)sub.textContent=`Começa em ${mins} min — link ativa em breve`;pulse?.classList.remove('urgente');if(btn){btn.disabled=true;btn.textContent='Aguardando…';}}
}
function esconderLembrete(){g('lembrete-banner')?.classList.remove('show');proximaReuniaoLink=null;}

async function saveMetrica(id){
  const clienteId=val('met-cliente');

  const payload={
    cliente_id:clienteId,mes,
    leads:parseInt(val('met-leads'))||0,
    cliques:parseInt(val('met-cliques'))||0,
    alcance:parseInt(val('met-alcance'))||0,
    impressoes:parseInt(val('met-impressoes'))||0,
    ctr:parseFloat(val('met-ctr'))||0,
    cpl:parseFloat(val('met-cpl'))||0,
    investimento:parseFloat(val('met-inv'))||0,
    observacoes:val('met-obs')||null,
  };
  const{error}=id
    ?await db.from('metricas_campanha').update(payload).eq('id',id)
    :await db.from('metricas_campanha').upsert({...payload},{onConflict:'cliente_id,mes'});
  if(error){toast('Erro: '+error.message,'er');return;}
  toast(id?'Metricas atualizadas':'Metricas salvas!');
  closeModal();
  filtrarMetricas(clienteId);
}

const FERIADOS_BR=['01-01','04-21','05-01','09-07','10-12','11-02','11-15','11-20','12-25'];

function isFeriado(date){
  const mmdd=`${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
  return FERIADOS_BR.includes(mmdd);
}

function isUtil(date){
  const d=date.getDay();
  return d!==0&&d!==6&&!isFeriado(date);
}

function abrirCalendarioCall(prioridade){
  const hoje=new Date();
  const diasMin=prioridade==='urgente'?2:prioridade==='media'?4:7;
  const diasMax=prioridade==='urgente'?4:prioridade==='media'?8:14;
  const horarios=['08:00','09:00','10:00','11:00','14:00','15:00','16:00','17:00'];

  // Gera datas disponíveis
  const datas=[];
  let d=new Date(hoje);
  let diasContados=0;
  while(datas.length<(diasMax-diasMin+3)){
    d=new Date(d.getTime()+86400000);
    if(isUtil(d)){
      diasContados++;
      if(diasContados>=diasMin) datas.push(new Date(d));
    }
    if(datas.length>=6)break;
  }

  const corPrior=prioridade==='urgente'?'var(--red)':prioridade==='media'?'var(--orange)':'var(--blue)';
  const labelPrior=prioridade==='urgente'?'Urgente':prioridade==='media'?'Média':'Baixa';

  openModal('Escolha data e horário',`
    <div style="margin-bottom:12px;display:flex;align-items:center;gap:8px">
      <span style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:${corPrior}">◉ Prioridade ${labelPrior}</span>
    </div>
    <div class="fg" style="margin-bottom:12px">
      <label>Data preferida</label>
      <select id="call-data">
        ${datas.map(d=>`<option value="${d.toISOString().split('T')[0]}">${d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</option>`).join('')}
      </select>
    </div>
    <div class="fg" style="margin-bottom:12px">
      <label>Horário preferido</label>
      <select id="call-hora">
        ${horarios.map(h=>`<option value="${h}">${h}</option>`).join('')}
      </select>
    </div>
    <div class="fg">
      <label>Assunto (opcional)</label>
      <input id="call-assunto" placeholder="Ex: Alinhamento de campanha, revisão de projeto…">
    </div>
    <div style="background:rgba(255,159,10,0.08);border:1px solid rgba(255,159,10,0.2);border-radius:12px;padding:10px 14px;margin-top:4px;font-size:12px;color:var(--orange)">
      ◷ A solicitação fica pendente até aprovação da 5essência
    </div>
  `,`
    <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-primary" onclick="confirmarCall('${prioridade}')">Solicitar call</button>
  `);
}

async function confirmarCall(prioridade){
  const data=val('call-data');
  const hora=val('call-hora');

async function salvarContrato(){
  const titulo=val('ct-titulo').trim(),clienteId=val('ct-cliente');
  if(!titulo||!clienteId){toast('Preencha título e cliente','er');return;}
  const tipo=g('ct-tipo')?.value||'texto';
  const btn=document.querySelector('#m-foot .btn-primary');

  let conteudo='',pdfBase64=null;

  if(tipo==='pdf'){
    const file=g('ct-pdf-file')?.files?.[0];
    if(!file){toast('Selecione um arquivo PDF','er');return;}
    if(btn){btn.textContent='Processando PDF…';btn.disabled=true;}
    pdfBase64=await new Promise(res=>{
      const reader=new FileReader();
      reader.onload=e=>res(e.target.result);
      reader.readAsDataURL(file);
    });
    conteudo=`[PDF] ${file.name}`;
  } else {
    conteudo=val('ct-conteudo').trim();
    if(!conteudo){toast('Escreva o conteúdo do contrato','er');return;}
  }

  if(btn){btn.textContent='Salvando…';btn.disabled=true;}
  const{error}=await db.from('contratos').insert({
    titulo,cliente_id:clienteId,conteudo,
    pdf_base64:pdfBase64,
    status:'pendente',created_at:new Date().toISOString()
  });
  if(error){toast('Erro: '+error.message,'er');if(btn){btn.textContent='Criar e enviar';btn.disabled=false;}return;}
  await criarNotificacaoSistema(`📄 Novo contrato para assinar: "${titulo}"`, 'alerta', clienteId);
  // Busca email do cliente para enviar notificação
  const{data:clEmail}=await db.from('clientes').select('nome_completo,email').eq('id',clienteId).single();
  if(clEmail?.email) emailContratoEnviado(clEmail.nome_completo,clEmail.email,titulo);
  toast('Contrato criado e cliente notificado!');closeModal();renderContratos();
}

async function carregarPDF(base64){
  try{
    // Carrega pdf.js dinamicamente
    if(!window.pdfjsLib){
      await new Promise((res,rej)=>{
        const s=document.createElement('script');
        s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
        s.onload=res;s.onerror=rej;
        document.head.appendChild(s);
      });
      window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    const dataUrl=base64.includes('base64,')? base64 : base64;
    const base64Data=dataUrl.split(',')[1];
    const raw=atob(base64Data);
    const uint8=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++)uint8[i]=raw.charCodeAt(i);

    pdfDoc=await pdfjsLib.getDocument({data:uint8}).promise;
    pdfTotalPags=pdfDoc.numPages;
    pdfPagAtual=1;

    await renderPaginaPDF(null,'pdf-canvas',pdfPagAtual);
    atualizarNavPDF();
  }catch(e){
    console.error('PDF erro:',e);
    const canvas=document.getElementById('pdf-canvas');
    if(canvas){canvas.style.display='none';}
    // Fallback: mostra botão assinar direto
    mostrarFluxoAssinatura(contratoAtualId);
  }
}

async function renderPaginaPDF(base64,canvasId,pagNum){
  const canvas=document.getElementById(canvasId);
  if(!canvas)return;
  try{
    if(base64&&!pdfDoc){
      await carregarPDF(base64);
      return;
    }
    if(!pdfDoc)return;
    const page=await pdfDoc.getPage(pagNum);
    const viewport=page.getViewport({scale:window.devicePixelRatio||1.5});
    canvas.width=viewport.width;
    canvas.height=viewport.height;
    canvas.style.width='100%';
    canvas.style.height='auto';
    await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;
  }catch(e){console.warn('render pag:',e);}
}

async function mudarPaginaPDF(dir){
  const nova=pdfPagAtual+dir;
  if(nova<1||nova>pdfTotalPags)return;
  pdfPagAtual=nova;
  await renderPaginaPDF(null,'pdf-canvas',pdfPagAtual);
  atualizarNavPDF();
  document.getElementById('pdf-scroll-area')?.scrollTo({top:0,behavior:'smooth'});
}

function atualizarNavPDF(){
  const pagnum=document.getElementById('pdf-pagnum');
  const paginfo=document.getElementById('pdf-paginfo');
  const btnPrev=document.getElementById('btn-prev');
  const btnNext=document.getElementById('btn-next');
  if(pagnum)pagnum.textContent=`Pág ${pdfPagAtual} de ${pdfTotalPags}`;
  if(paginfo)paginfo.textContent=`Página ${pdfPagAtual} de ${pdfTotalPags}`;
  if(btnPrev)btnPrev.disabled=pdfPagAtual<=1;
  if(btnNext){
    if(pdfPagAtual>=pdfTotalPags){
      // Última página — muda botão para "Assinar"
      btnNext.textContent='✍️ Assinar';
      btnNext.onclick=()=>mostrarFluxoAssinatura(contratoAtualId);
      btnNext.style.background='linear-gradient(135deg,#34C759,#248A3D)';
    } else {
      btnNext.textContent='Próxima ›';
      btnNext.onclick=()=>mudarPaginaPDF(1);
      btnNext.disabled=false;
    }
  }
}

function iniciarCanvas(){
  const canvas=document.getElementById('assin-canvas');
  if(!canvas)return;
  const rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*2||680;canvas.height=260;
  canvas.style.width='100%';canvas.style.height='130px';
  const ctx=canvas.getContext('2d');
  ctx.scale(2,2);ctx.strokeStyle='#1a1a2e';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';
  let desenhando=false;
  const pos=e=>{const r=canvas.getBoundingClientRect();const src=e.touches?e.touches[0]:e;return{x:(src.clientX-r.left),y:(src.clientY-r.top)};};
  canvas.addEventListener('mousedown',e=>{desenhando=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);});
  canvas.addEventListener('mousemove',e=>{if(!desenhando)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();});
  canvas.addEventListener('mouseup',()=>desenhando=false);
  canvas.addEventListener('touchstart',e=>{e.preventDefault();desenhando=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);},{passive:false});
  canvas.addEventListener('touchmove',e=>{e.preventDefault();if(!desenhando)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();},{passive:false});
  canvas.addEventListener('touchend',()=>desenhando=false);
}

function limparAssinatura(){
  const canvas=document.getElementById('assin-canvas');
  if(!canvas)return;
  canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);
}

async function assinarContrato(contratoId){
  const canvas=document.getElementById('assin-canvas');
  const docInput=document.getElementById('ct-doc-file');
  const selfieInput=document.getElementById('ct-selfie-file');
  if(!canvas){toast('Erro no canvas','er');return;}
  const imgData=canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height).data;
  if(!Array.from(imgData).some(v=>v<250)){toast('Desenhe sua assinatura antes de confirmar','er');return;}

  const toBase64=file=>new Promise(res=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.readAsDataURL(file);});
  const assinaturaImg=canvas.toDataURL('image/png');
  const documentoImg=docInput?.files?.[0]?await toBase64(docInput.files[0]):null;
  const selfieImg=selfieInput?.files?.[0]?await toBase64(selfieInput.files[0]):null;

  // Botão de confirmar
  const btns=document.querySelectorAll('#contrato-viewer .btn-primary');
  btns.forEach(b=>{b.textContent='Salvando…';b.disabled=true;});

  let ip='—';
  try{const r=await fetch('https://api.ipify.org?format=json');const d=await r.json();ip=d.ip;}catch(e){}

  const agora=new Date();
  const{error}=await db.from('contratos').update({
    status:'assinado',
    assinatura_img:assinaturaImg,
    documento_img:documentoImg,
    selfie_img:selfieImg,
    ip_assinatura:ip,
    assinado_em:agora.toISOString()
  }).eq('id',contratoId);

  if(error){toast('Erro ao salvar: '+error.message,'er');btns.forEach(b=>{b.textContent='Confirmar assinatura';b.disabled=false;});return;}

  const{data:cl}=await db.from('clientes').select('nome_completo,email').eq('id',currentClienteId).single();
  const{data:ct}=await db.from('contratos').select('titulo').eq('id',contratoId).single();
  await criarNotificacaoSistema(`◎ Contrato assinado por ${cl?.nome_completo||'cliente'}: "${ct?.titulo||''}"`, 'sucesso', null);

  // Email comprovante para o cliente
  if(cl?.email){
    const dataHora=agora.toLocaleString('pt-BR');
    emailContratoAssinado(cl.nome_completo,cl.email,ct?.titulo||'Contrato',dataHora,ip);
  }

  fecharViewer();
  toast('✓ Contrato assinado com sucesso!');
  renderPortalContratos();
}
async function renderPortalContratos(){
  if(!currentClienteId){setPage('portal-contratos','<div class="empty"><p>Conta não vinculada</p></div>');return;}
  const{data:cts}=await db.from('contratos').select('*').eq('cliente_id',currentClienteId).order('created_at',{ascending:false});
  setPage('portal-contratos',`
    <div class="section-title">Contratos</div>
    ${(cts||[]).length===0?'<div class="empty"><div class="empty-icon">◎</div><p>Nenhum contrato</p></div>':''}
    ${(cts||[]).map(c=>`
      <div class="lancamento" onclick="abrirContratoCliente('${c.id}')">
        <div class="lancamento-icon" style="background:${c.status==='assinado'?'rgba(52,199,89,0.12)':'rgba(255,159,10,0.12)'}">
          ${c.status==='assinado'?'◎':'◷'}
        </div>
        <div class="lancamento-info">
          <div class="lancamento-desc">${c.titulo}</div>
          <div class="lancamento-meta">${new Date(c.created_at).toLocaleDateString('pt-BR')}</div>
        </div>
        ${c.status==='pendente'?'<span style="font-size:11px;font-weight:700;color:var(--orange)">Assinar</span>':badge(c.status)}
      </div>
    `).join('')}
  `);
}

// INIT
db.auth.getSession().then(({data:{session}})=>{if(session?.user)initSession(session.user);});
