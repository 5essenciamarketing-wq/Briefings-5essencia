<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0A0F">
<title>5essência</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg:     #0A0A0F;
  --bg1:    #12121A;
  --bg2:    #1A1A26;
  --bg3:    #222232;
  --glass:  rgba(255,255,255,0.05);
  --glass2: rgba(255,255,255,0.08);
  --border: rgba(255,255,255,0.07);
  --border2:rgba(255,255,255,0.13);
  --ink:    #F0F0FF;
  --ink2:   #A0A0C0;
  --ink3:   #606080;
  --ink4:   #404060;
  --blue:   #4F8EFF;
  --blue2:  #2563EB;
  --green:  #34C759;
  --red:    #FF453A;
  --orange: #FF9F0A;
  --purple: #BF5AF2;
  --teal:   #5AC8FA;
  --gold:   #FFD60A;
  --r:8px;--r2:16px;--r3:24px;
  --font:'Inter',-apple-system,sans-serif;
  --sh:0 2px 16px rgba(0,0,0,0.4);
  --sh2:0 8px 40px rgba(0,0,0,0.6);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{height:100%;background:var(--bg);}
body{height:100%;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased;}

/* LOGIN */
#login-screen{
  position:fixed;inset:0;z-index:9999;
  display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:env(safe-area-inset-bottom);
  background:var(--bg);
}
#login-screen::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 50% 0%,rgba(79,142,255,0.12) 0%,transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 80%,rgba(191,90,242,0.08) 0%,transparent 60%);
}
.login-card{
  position:relative;width:100%;max-width:480px;
  background:var(--bg1);
  border:1px solid var(--border2);
  border-bottom:none;
  border-radius:32px 32px 0 0;
  padding:32px 28px calc(28px + env(safe-area-inset-bottom));
  box-shadow:0 -20px 60px rgba(0,0,0,0.5);
}
.login-logo-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:32px;}
.login-logo-img{
  width:72px;height:72px;border-radius:20px;
  background:#111;overflow:hidden;margin-bottom:14px;
  box-shadow:0 8px 32px rgba(79,142,255,0.2);
  border:1px solid var(--border2);
}
.login-logo-img img{width:100%;height:100%;object-fit:contain;}
.login-title{font-size:22px;font-weight:700;letter-spacing:-0.5px;margin-bottom:4px;}
.login-sub{font-size:13px;color:var(--ink3);}
.login-err{
  background:rgba(255,69,58,0.1);border:1px solid rgba(255,69,58,0.2);
  border-radius:12px;padding:10px 14px;font-size:13px;color:var(--red);
  margin-bottom:14px;display:none;text-align:center;
}
.login-err.show{display:block;}
.lfield{margin-bottom:14px;}
.lfield label{display:block;font-size:11px;font-weight:600;color:var(--ink3);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:6px;}
.lfield input{
  width:100%;background:var(--bg2);border:1px solid var(--border2);
  border-radius:14px;padding:14px 16px;color:var(--ink);
  font-family:var(--font);font-size:16px;outline:none;
  transition:all 0.15s;
}
.lfield input:focus{border-color:var(--blue);background:var(--bg3);box-shadow:0 0 0 3px rgba(79,142,255,0.15);}
.lfield input::placeholder{color:var(--ink4);}
.login-btn{
  width:100%;margin-top:8px;padding:15px;border:none;border-radius:14px;
  background:linear-gradient(135deg,var(--blue),var(--purple));
  color:#fff;font-family:var(--font);font-size:15px;font-weight:600;
  cursor:pointer;transition:all 0.15s;letter-spacing:-0.1px;
  box-shadow:0 4px 20px rgba(79,142,255,0.3);
}
.login-btn:hover{opacity:0.9;transform:translateY(-1px);}
.login-btn:active{transform:scale(0.98);}
.login-btn:disabled{opacity:0.5;transform:none;}

/* APP */
.app{display:flex;flex-direction:column;height:100dvh;overflow:hidden;}

/* TOPBAR */
.topbar{
  height:56px;flex-shrink:0;
  background:rgba(10,10,15,0.85);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;
  padding-top:env(safe-area-inset-top);
}
.topbar-logo{display:flex;align-items:center;gap:10px;}
.topbar-logo-img{width:28px;height:28px;border-radius:8px;background:#111;overflow:hidden;border:1px solid var(--border2);}
.topbar-logo-img img{width:100%;height:100%;object-fit:contain;}
.topbar-title{font-size:15px;font-weight:600;letter-spacing:-0.3px;}
.topbar-right{display:flex;align-items:center;gap:8px;}
.topbar-avatar{
  width:32px;height:32px;border-radius:50%;
  background:linear-gradient(135deg,var(--blue),var(--purple));
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:#fff;cursor:pointer;
  flex-shrink:0;
}

/* CONTENT */
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;}
.page{display:none;padding:16px;padding-bottom:calc(80px + env(safe-area-inset-bottom));animation:fadeUp 0.25s ease both;}
.page.active{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  height:calc(64px + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(10,10,15,0.92);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-top:1px solid var(--border);
  display:flex;align-items:stretch;
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;cursor:pointer;
  color:var(--ink4);font-size:10px;font-weight:500;
  transition:color 0.15s;position:relative;
  -webkit-tap-highlight-color:transparent;
}
.nav-item.active{color:var(--blue);}
.nav-icon-wrap{
  width:36px;height:28px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  transition:background 0.15s;font-size:18px;
}
.nav-item.active .nav-icon-wrap{background:rgba(79,142,255,0.15);}
.nav-label{font-size:10px;font-weight:500;}

/* SEÇÃO TÍTULO */
.section-title{
  font-size:20px;font-weight:700;letter-spacing:-0.5px;
  margin-bottom:16px;
}
.section-sub{font-size:13px;color:var(--ink3);margin-top:2px;}

/* CARD BASE */
.card{
  background:var(--bg1);border:1px solid var(--border);
  border-radius:var(--r2);overflow:hidden;
  box-shadow:var(--sh);margin-bottom:12px;
}
.card-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;border-bottom:1px solid var(--border);
}
.card-title{font-size:14px;font-weight:600;letter-spacing:-0.2px;}

/* DASHBOARD MÉTRICAS */
.metrics-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.metric-card{
  background:var(--bg1);border:1px solid var(--border);
  border-radius:var(--r2);padding:16px;
  display:flex;flex-direction:column;gap:8px;
  position:relative;overflow:hidden;
  transition:transform 0.15s;
  -webkit-tap-highlight-color:transparent;
}
.metric-card:active{transform:scale(0.97);}
.metric-card::after{
  content:'';position:absolute;top:-20px;right:-20px;
  width:80px;height:80px;border-radius:50%;opacity:0.08;
}
.metric-card.blue::after{background:var(--blue);}
.metric-card.green::after{background:var(--green);}
.metric-card.purple::after{background:var(--purple);}
.metric-card.orange::after{background:var(--orange);}
.metric-emoji{font-size:24px;}
.metric-val{font-size:28px;font-weight:700;letter-spacing:-1px;line-height:1;}
.metric-val.blue{color:var(--blue);}
.metric-val.green{color:var(--green);}
.metric-val.purple{color:var(--purple);}
.metric-val.orange{color:var(--orange);}
.metric-lbl{font-size:11px;color:var(--ink3);font-weight:500;}

/* PRÓXIMOS COMPROMISSOS */
.compromisso-card{
  background:var(--bg1);border:1px solid var(--border);
  border-radius:var(--r2);padding:14px 16px;
  display:flex;align-items:center;gap:14px;
  margin-bottom:10px;cursor:pointer;
  transition:all 0.15s;-webkit-tap-highlight-color:transparent;
}
.compromisso-card:active{transform:scale(0.98);background:var(--bg2);}
.comp-date{
  min-width:44px;text-align:center;
  background:var(--bg2);border-radius:12px;
  padding:8px 6px;border:1px solid var(--border);
}
.comp-day{font-size:20px;font-weight:700;line-height:1;color:var(--ink);}
.comp-month{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink3);margin-top:2px;}
.comp-info{flex:1;min-width:0;}
.comp-titulo{font-size:13.5px;font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.comp-meta{font-size:12px;color:var(--ink3);}
.comp-tipo{flex-shrink:0;}

/* CLIENTES CARDS */
.cliente-card{
  background:var(--bg1);border:1px solid var(--border);
  border-radius:var(--r2);padding:14px 16px;
  display:flex;align-items:center;gap:14px;
  margin-bottom:10px;cursor:pointer;
  transition:all 0.15s;-webkit-tap-highlight-color:transparent;
}
.cliente-card:active{transform:scale(0.98);}
.cliente-avatar{
  width:44px;height:44px;border-radius:14px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;color:#fff;
}
.cliente-info{flex:1;min-width:0;}
.cliente-nome{font-size:14px;font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cliente-meta{font-size:12px;color:var(--ink3);}

/* KANBAN */
.kanban-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px 8px;}
.kanban{display:flex;gap:12px;width:max-content;}
.k-col{width:240px;background:var(--bg1);border:1px solid var(--border);border-radius:var(--r2);padding:14px;flex-shrink:0;}
.k-col-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.k-col-label{font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink3);}
.k-count{font-size:11px;background:var(--bg3);border-radius:20px;padding:1px 8px;color:var(--ink3);}
.k-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r);padding:12px;margin-bottom:8px;cursor:pointer;
  transition:all 0.15s;-webkit-tap-highlight-color:transparent;
}
.k-card:active{transform:scale(0.97);}
.k-card-title{font-size:13px;font-weight:600;margin-bottom:4px;color:var(--ink);}
.k-card-client{font-size:11.5px;color:var(--ink3);}
.k-card-val{font-size:12px;color:var(--green);font-weight:600;margin-top:8px;}
.k-card-date{font-size:11px;color:var(--ink4);margin-top:2px;}
.k-card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:8px;}
.k-add{
  width:100%;padding:8px;border:1px dashed var(--border2);
  border-radius:8px;background:transparent;color:var(--ink4);
  font-family:var(--font);font-size:12px;cursor:pointer;
  transition:all 0.15s;
}
.k-add:hover{border-color:var(--blue);color:var(--blue);}

/* AGENDA */
.cal-wrap{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r2);margin-bottom:12px;overflow:hidden;}
.cal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px;}
.cal-month-label{font-size:16px;font-weight:700;letter-spacing:-0.3px;}
.cal-nav-btn{
  width:32px;height:32px;border-radius:10px;border:1px solid var(--border2);
  background:var(--bg2);color:var(--ink);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all 0.12s;
}
.cal-nav-btn:active{background:var(--bg3);}
.cal-dow-row{display:grid;grid-template-columns:repeat(7,1fr);padding:0 12px 4px;}
.cal-dow{text-align:center;font-size:10px;font-weight:600;color:var(--ink4);padding:4px 0;text-transform:uppercase;}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 12px 12px;}
.cal-day{
  aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;cursor:pointer;
  position:relative;transition:background 0.12s;
  -webkit-tap-highlight-color:transparent;
}
.cal-day:active{background:var(--bg3);}
.cal-day.other{opacity:0.3;}
.cal-day.today .cal-day-num{
  background:var(--blue);color:#fff;border-radius:50%;
  width:28px;height:28px;display:flex;align-items:center;justify-content:center;
}
.cal-day-num{font-size:13px;font-weight:500;color:var(--ink);}
.cal-day-dot{width:4px;height:4px;border-radius:50%;background:var(--blue);margin-top:2px;}
.event-list{padding:0 12px 12px;}
.event-row{
  display:flex;align-items:center;gap:12px;
  padding:12px;background:var(--bg2);border-radius:12px;
  margin-bottom:8px;cursor:pointer;transition:all 0.12s;
  -webkit-tap-highlight-color:transparent;
}
.event-row:active{transform:scale(0.98);}
.event-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.event-dot.captacao{background:var(--blue);}
.event-dot.entrega{background:var(--green);}
.event-dot.reuniao{background:var(--purple);}
.event-dot.outro{background:var(--ink3);}
.event-info{flex:1;min-width:0;}
.event-title{font-size:13.5px;font-weight:600;margin-bottom:2px;}
.event-meta{font-size:12px;color:var(--ink3);}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;}
.badge-ativo,.badge-pago,.badge-aprovada,.badge-entregue,.badge-aprovado{background:rgba(52,199,89,0.15);color:#34C759;}
.badge-inativo,.badge-cancelado,.badge-recusada,.badge-atrasado,.badge-pausado{background:rgba(255,69,58,0.15);color:#FF453A;}
.badge-lead,.badge-rascunho,.badge-briefing{background:rgba(79,142,255,0.15);color:#4F8EFF;}
.badge-pendente,.badge-em_andamento,.badge-enviada{background:rgba(255,159,10,0.15);color:#FF9F0A;}
.badge-revisao{background:rgba(90,200,250,0.15);color:#5AC8FA;}
.badge-admin{background:linear-gradient(135deg,rgba(79,142,255,0.2),rgba(191,90,242,0.2));color:var(--blue);border:1px solid rgba(79,142,255,0.2);}
.badge-cliente{background:var(--bg3);color:var(--ink3);border:1px solid var(--border2);}

/* FINANCEIRO */
.fin-cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px;}
.fin-card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r2);padding:14px 12px;}
.fin-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink3);margin-bottom:6px;}
.fin-val{font-size:15px;font-weight:700;letter-spacing:-0.3px;}
.fin-val.r{color:var(--green);}
.fin-val.d{color:var(--red);}
.fin-val.s{color:var(--blue);}

/* LANCAMENTO ROW */
.lancamento{
  background:var(--bg1);border:1px solid var(--border);
  border-radius:var(--r2);padding:14px 16px;
  display:flex;align-items:center;gap:12px;
  margin-bottom:8px;cursor:pointer;transition:all 0.12s;
}
.lancamento:active{transform:scale(0.98);}
.lancamento-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.lancamento-info{flex:1;min-width:0;}
.lancamento-desc{font-size:13.5px;font-weight:500;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lancamento-meta{font-size:12px;color:var(--ink3);}
.lancamento-val{font-size:15px;font-weight:700;flex-shrink:0;}

/* SEARCH BAR */
.search-bar{
  display:flex;align-items:center;gap:10px;
  background:var(--bg2);border:1px solid var(--border);
  border-radius:14px;padding:10px 14px;margin-bottom:14px;
}
.search-bar input{
  flex:1;background:none;border:none;color:var(--ink);
  font-family:var(--font);font-size:14px;outline:none;
}
.search-bar input::placeholder{color:var(--ink4);}
.search-icon{color:var(--ink4);font-size:15px;}

/* FAB */
.fab-wrap{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));right:16px;z-index:200;display:flex;flex-direction:column;align-items:flex-end;gap:10px;}
.fab-main{
  width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--blue),var(--purple));
  color:#fff;font-size:24px;font-weight:300;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 20px rgba(79,142,255,0.4);
  transition:all 0.2s cubic-bezier(0.34,1.56,0.64,1);
}
.fab-main.open{transform:rotate(45deg);}
.fab-items{display:flex;flex-direction:column;align-items:flex-end;gap:8px;opacity:0;pointer-events:none;transform:translateY(10px);transition:all 0.2s ease;}
.fab-items.open{opacity:1;pointer-events:all;transform:translateY(0);}
.fab-item{
  display:flex;align-items:center;gap:10px;cursor:pointer;
  background:var(--bg2);border:1px solid var(--border2);
  border-radius:20px;padding:10px 16px 10px 12px;
  box-shadow:var(--sh2);transition:all 0.15s;
}
.fab-item:active{transform:scale(0.96);}
.fab-item-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.fab-item-label{font-size:13px;font-weight:500;color:var(--ink);}

/* MODAL */
.overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:flex-end;justify-content:center;
  z-index:1000;opacity:0;pointer-events:none;transition:opacity 0.2s;
}
.overlay.open{opacity:1;pointer-events:all;}
.modal{
  background:var(--bg1);
  border:1px solid var(--border2);
  border-bottom:none;
  border-radius:28px 28px 0 0;
  width:100%;max-width:600px;
  max-height:92dvh;overflow-y:auto;
  transform:translateY(100%);
  transition:transform 0.3s cubic-bezier(0.32,0.72,0,1);
  padding-bottom:env(safe-area-inset-bottom);
}
.overlay.open .modal{transform:translateY(0);}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:12px auto 0;}
.modal-head{padding:16px 20px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
.modal-title{font-size:17px;font-weight:700;letter-spacing:-0.3px;}
.modal-x{width:28px;height:28px;border-radius:50%;border:none;cursor:pointer;background:var(--bg3);color:var(--ink2);font-size:14px;display:flex;align-items:center;justify-content:center;}
.modal-body{padding:18px 20px;display:flex;flex-direction:column;gap:14px;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;}
.modal-section{font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink4);padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:2px;}

/* FORM */
.fg{display:flex;flex-direction:column;gap:6px;}
.fg label{font-size:11px;font-weight:600;color:var(--ink3);letter-spacing:0.04em;}
.fg input,.fg select,.fg textarea{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:12px;color:var(--ink);font-family:var(--font);
  font-size:16px;padding:12px 14px;outline:none;
  transition:all 0.15s;width:100%;
}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--blue);background:var(--bg3);box-shadow:0 0 0 3px rgba(79,142,255,0.1);}
.fg input::placeholder,.fg textarea::placeholder{color:var(--ink4);}
.fg select option{background:var(--bg2);}
.fg textarea{resize:vertical;min-height:80px;}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}

/* BOTÕES */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 18px;border-radius:12px;border:none;cursor:pointer;
  font-family:var(--font);font-size:13.5px;font-weight:600;
  transition:all 0.15s;white-space:nowrap;-webkit-tap-highlight-color:transparent;
}
.btn:active{transform:scale(0.96);}
.btn-primary{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 2px 12px rgba(79,142,255,0.3);}
.btn-ghost{background:var(--bg3);color:var(--ink2);border:1px solid var(--border2);}
.btn-danger{background:rgba(255,69,58,0.12);color:var(--red);border:1px solid rgba(255,69,58,0.2);}
.btn-sm{padding:7px 14px;font-size:12px;}

/* ACT */
.act{background:none;border:none;color:var(--ink4);cursor:pointer;padding:6px 8px;border-radius:8px;font-size:14px;transition:all 0.12s;}
.act:hover{color:var(--ink);background:var(--bg3);}
.act.del:hover{color:var(--red);}

/* TOAST */
.toasts{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));left:12px;right:12px;z-index:2000;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.toast{
  background:rgba(18,18,26,0.95);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border2);border-radius:16px;
  padding:12px 16px;font-size:13.5px;font-weight:500;
  display:flex;align-items:center;gap:10px;color:var(--ink);
  box-shadow:var(--sh2);animation:tin 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
.toast-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.toast.ok .toast-dot{background:var(--green);}
.toast.er .toast-dot{background:var(--red);}
@keyframes tin{from{transform:translateY(20px) scale(0.9);opacity:0;}to{transform:translateY(0) scale(1);opacity:1;}}

/* LEMBRETE */
.lembrete-banner{
  position:fixed;top:56px;left:12px;right:12px;z-index:90;
  max-height:0;overflow:hidden;transition:max-height 0.4s ease;
}
.lembrete-banner.show{max-height:100px;}
.lembrete-inner{
  background:linear-gradient(135deg,rgba(79,142,255,0.15),rgba(191,90,242,0.1));
  border:1px solid rgba(79,142,255,0.25);border-radius:16px;
  padding:12px 16px;display:flex;align-items:center;gap:12px;
  margin-top:8px;
}
.lembrete-pulse{width:10px;height:10px;border-radius:50%;background:var(--blue);flex-shrink:0;animation:pr 1.5s ease infinite;}
.lembrete-pulse.urgente{background:var(--red);}
@keyframes pr{0%{box-shadow:0 0 0 0 rgba(79,142,255,0.5);}70%{box-shadow:0 0 0 8px rgba(79,142,255,0);}100%{box-shadow:0 0 0 0 rgba(79,142,255,0);}}
.lembrete-texto{flex:1;min-width:0;}
.lembrete-titulo{font-size:13px;font-weight:600;color:var(--ink);}
.lembrete-sub{font-size:11px;color:var(--ink3);}
.lembrete-btn{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:8px 14px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:var(--font);}
.lembrete-btn:disabled{background:var(--bg3);color:var(--ink4);}

/* EMPTY */
.empty{text-align:center;padding:40px 20px;color:var(--ink4);}
.empty-icon{font-size:40px;margin-bottom:12px;opacity:0.4;}
.empty p{font-size:13.5px;margin-top:6px;}
.loading{text-align:center;padding:40px;color:var(--ink4);font-size:13px;}

/* SCROLL */
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:10px;}

/* PORTAL HERO */
.portal-hero{
  background:linear-gradient(135deg,rgba(79,142,255,0.1),rgba(191,90,242,0.07));
  border:1px solid rgba(79,142,255,0.15);border-radius:var(--r2);
  padding:20px;margin-bottom:14px;
  display:flex;align-items:center;gap:16px;
}
.portal-avatar{
  width:52px;height:52px;border-radius:16px;flex-shrink:0;
  background:linear-gradient(135deg,var(--blue),var(--purple));
  display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:700;color:#fff;
}
.portal-name{font-size:19px;font-weight:700;letter-spacing:-0.4px;margin-bottom:3px;}
.portal-meta{font-size:12px;color:var(--ink3);}
</style>
</head>

async function initSession(user){

        {id:user.id,email:user.email,role:'cliente',cliente_id:cl.id,created_at:new Date().toISOString()},

async function renderCompromissos(){

    db.from('clientes').select('id,nome_completo,email')
  ]);
  agenda=ra.data||[];clientes=rc.data||[];

  // Agrupa por data
  const grupos={};
  agenda.forEach(e=>{

    grupos[e.data].push(e);
  });

  setPage('compromissos',`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div class="section-title" style="margin:0">Agenda</div>

    </div>`:''}

    ${Object.keys(grupos).length===0?'<div class="empty"><div class="empty-icon">◷</div><p>Nenhum compromisso agendado</p></div>':''}
    ${Object.entries(grupos).map(([data,eventos])=>{
      const d=new Date(data+'T00:00:00');
      const isHoje=data===hoje.toISOString().split('T')[0];
      return`
        <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:${isHoje?'var(--blue)':'var(--ink3)'};margin:12px 0 8px">${isHoje?'HOJE · ':''}${d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</div>

          </div>`;
        }).join('')}
      `;
    }).join('')}
  `);
}

function gerarPixBRCode(chave, valor, nome, cidade){
  // Gera o payload Pix padrão BC (EMV)
  const pixKey=chave;
  const merchantName=nome.substring(0,25).toUpperCase();
  const merchantCity=cidade.substring(0,15).toUpperCase();
  const amount=parseFloat(valor).toFixed(2);

  function tlv(id,value){const len=String(value.length).padStart(2,'0');return id+len+value;}

  const merchantAccountInfo=tlv('00','BR.GOV.BCB.PIX')+tlv('01',pixKey);
  const payload=
    tlv('00','01')+
    tlv('26',merchantAccountInfo)+
    tlv('52','0000')+
    tlv('53','986')+
    tlv('54',amount)+
    tlv('58','BR')+
    tlv('59',merchantName)+
    tlv('60',merchantCity)+
    '6304';

  // CRC16
  function crc16(str){
    let crc=0xFFFF;
    for(let i=0;i<str.length;i++){
      crc^=str.charCodeAt(i)<<8;
      for(let j=0;j<8;j++) crc=(crc&0x8000)?(crc<<1)^0x1021:(crc<<1);
    }
    return(crc&0xFFFF).toString(16).toUpperCase().padStart(4,'0');
  }

  return payload+crc16(payload);
}

async function saveCliente(id){
  const nome=val('f-nome').trim();
  if(!nome){toast('Nome obrigatório','er');return;}
  const email=val('f-email').trim();
  const wpp=val('f-wpp').trim(); // captura ANTES de fechar
  const SENHA='5essencia';
  const payload={nome_completo:nome,cpf:val('f-cpf').replace(/\D/g,'')||null,email:email||null,whatsapp:wpp||null,empresa:val('f-empresa')||null,cnpj:val('f-cnpj').replace(/\D/g,'')||null,whatsapp_financeiro:val('f-wpp-fin')||null,drive_url:val('f-drive')||null,link_extra:val('f-link-extra')||null,endereco_rua:val('f-rua')||null,endereco_bairro:val('f-bairro')||null,endereco_cidade:val('f-cidade')||null,endereco_uf:val('f-uf').toUpperCase()||null,endereco_cep:val('f-cep')||null,notas:val('f-notas')||null,status:g('f-status')?.value||'ativo'};

  const{data:saved,error}=id
    ?await db.from('clientes').update(payload).eq('id',id).select()
    :await db.from('clientes').insert(payload).select();
  if(error){toast('Erro: '+error.message,'er');return;}

  const clienteId=saved?.[0]?.id;

  if(!id&&email&&clienteId){
    const btn=document.querySelector('#m-foot .btn-primary');
    if(btn){btn.textContent='Criando acesso…';btn.disabled=true;}

    let result={};
    try{
      const res=await fetch('https://zebudefzhakitwjswvkl.supabase.co/functions/v1/quick-handler',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':`Bearer ${ANON_KEY}`},
        body:JSON.stringify({email,password:SENHA,role:'cliente',cliente_id:clienteId})
      });
      result=await res.json();
    }catch(fetchErr){
      toast('Erro de rede: '+fetchErr.message,'er');
      closeModal();renderClientes();return;
    }

    closeModal();
    renderClientes();

    if(result.error){
      toast('Cliente salvo, mas erro no acesso: '+result.error,'er');
    } else {
      await db.from('clientes').update({user_id:result.id}).eq('id',clienteId);
      toast(`✓ Acesso criado! Login: ${email} · Senha: ${SENHA}`);
      // WhatsApp com dados capturados antes do closeModal
      if(wpp){
        setTimeout(()=>{
          if(confirm(`Enviar boas-vindas para ${nome.split(' ')[0]} via WhatsApp?`)){
            enviarWppCliente(nome,wpp,email);
          }
        },300);
      }
    }
    return;
  }

  toast(id?'Cliente atualizado':'Cliente criado');closeModal();renderClientes();
}

function atualizarPreviewParcelas(){
  const nparc=parseInt(g('f-nparc')?.value)||1;
  const valor=parseFloat(g('fv')?.value)||0;
  const mesIni=g('f-venc-ini')?.value;
  const preview=g('preview-parcelas');
  if(!preview||!valor) return;
  const valorParc=valor/nparc;
  let html='';
  for(let i=0;i<Math.min(nparc,4);i++){
    const d=new Date(mesIni+'-01');
    d.setMonth(d.getMonth()+i);
    const mes=MESES[d.getMonth()];
    const ano=d.getFullYear();
    html+=`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border)">
      <span>Parcela ${i+1}/${nparc} — ${mes}/${ano}</span>
      <span style="font-weight:600;color:var(--blue)">${R(valorParc)}</span>
    </div>`;
  }
  if(nparc>4) html+=`<div style="text-align:center;padding:4px 0;color:var(--ink4)">+ ${nparc-4} parcelas…</div>`;
  if(nparc===1) html=`<div style="text-align:center;padding:4px 0;color:var(--green);font-weight:600">✓ Pagamento à vista — ${R(valor)}</div>`;
  preview.innerHTML=html;
}

async function saveFin(id){
  const desc=val('fd').trim(),valor=parseFloat(val('fv'));
  if(!desc||!valor){toast('Descrição e valor obrigatórios','er');return;}

  // Edição simples
  if(id){
    const payload={descricao:desc,valor,tipo:g('ft')?.value||'receita',cliente_id:val('fc')||null,status:g('fs')?.value||'pendente',vencimento:val('fvc')||null};
    const{error}=await db.from('financeiro').update(payload).eq('id',id);
    if(error){toast('Erro: '+error.message,'er');return;}
    toast('Lançamento atualizado');closeModal();renderPagamentos();return;
  }

  // Criação com parcelamento
  const nparc=parseInt(g('f-nparc')?.value)||1;
  const mesIni=g('f-venc-ini')?.value;
  const tipo=g('ft')?.value||'receita';
  const clienteId=val('fc')||null;
  const valorParc=parseFloat((valor/nparc).toFixed(2));
  const parcelas=[];

  for(let i=0;i<nparc;i++){
    const d=new Date(mesIni+'-10');
    d.setMonth(d.getMonth()+i);
    const venc=d.toISOString().split('T')[0];
    parcelas.push({
      descricao:nparc===1?desc:`${desc} — ${i+1}/${nparc}`,
      valor:i===nparc-1?parseFloat((valor-(valorParc*(nparc-1))).toFixed(2)):valorParc, // última parcela ajusta centavos
      tipo,
      cliente_id:clienteId,
      status:'pendente',
      vencimento:venc,
      parcela_num:i+1,
      total_parcelas:nparc
    });
  }

  const{error}=await db.from('financeiro').insert(parcelas);
  if(error){toast('Erro: '+error.message,'er');return;}
  toast(nparc===1?'Lançamento criado!':` ${nparc} parcelas criadas!`);
  closeModal();renderPagamentos();
}

async function delFin(id){
  if(!confirm('Excluir este lançamento?'))return;
  await db.from('financeiro').delete().eq('id',id);
  toast('Removido');closeModal();renderPagamentos();
}

// ── PAGAMENTOS (aba admin completa) ──
// Estado de navegação mensal
let finMesIdx=0;

async function renderPagamentos(){
  const[rf,rc]=await Promise.all([
    db.from('financeiro').select('*').order('vencimento',{ascending:true}),
    db.from('clientes').select('id,nome_completo')
  ]);
  financeiro=rf.data||[];clientes=rc.data||[];

  // Monta lista de meses únicos com lançamentos
  const mesesSet=new Set();
  const hoje=new Date();
  const mesAtual=`${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,'0')}`;
  mesesSet.add(mesAtual);
  financeiro.forEach(f=>{
    if(f.vencimento)mesesSet.add(f.vencimento.slice(0,7));
  });
  const meses=[...mesesSet].sort().reverse(); // mais recente primeiro
  if(finMesIdx>=meses.length)finMesIdx=0;

  renderPagamentosMes(meses,financeiro,clientes);
}

function renderPagamentosMes(meses,todos,cls){
  const mes=meses[finMesIdx];
  const[ano,m]=mes.split('-').map(Number);
  const nomeMes=`${MESES[m-1]} ${ano}`;
  const hoje=new Date().toISOString().split('T')[0];
  const mesAtual=meses[0];

  // Filtra lançamentos do mês
  const doMes=todos.filter(f=>f.vencimento&&f.vencimento.slice(0,7)===mes);
  const receitas=doMes.filter(f=>f.tipo==='receita');
  const despesas=doMes.filter(f=>f.tipo==='despesa');

  const recPago=receitas.filter(f=>f.status==='pago').reduce((a,b)=>a+(b.valor||0),0);
  const recPendente=receitas.filter(f=>f.status==='pendente').reduce((a,b)=>a+(b.valor||0),0);
  const recAtrasado=receitas.filter(f=>f.status==='pendente'&&f.vencimento<hoje).reduce((a,b)=>a+(b.valor||0),0);
  const totalReceita=receitas.reduce((a,b)=>a+(b.valor||0),0);
  const totalDespesa=despesas.reduce((a,b)=>a+(b.valor||0),0);
  const saldo=recPago-totalDespesa;
  const pct=totalReceita>0?Math.round(recPago/totalReceita*100):0;

  const isMesAtual=mes===mesAtual;
  const isMesFuturo=mes>mesAtual;

  setPage('pagamentos',`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <div class="section-title" style="margin:0">Pagamentos</div>
      <button class="btn btn-primary btn-sm" onclick="abrirFormFin()">+ Novo</button>
    </div>

    <!-- NAVEGAÇÃO MENSAL -->
    <div style="display:flex;align-items:center;justify-content:space-between;background:var(--bg1);border:1px solid var(--border);border-radius:16px;padding:12px 16px;margin-bottom:14px">
      <button class="btn btn-ghost btn-sm" onclick="navFinMes(1)" ${finMesIdx>=meses.length-1?'disabled':''}>‹</button>
      <div style="text-align:center">
        <div style="font-size:15px;font-weight:700">${nomeMes}</div>
        <div style="font-size:11px;color:var(--ink3);margin-top:2px">${isMesAtual?'Mês atual':isMesFuturo?'Mês futuro':'Fechado'}</div>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="navFinMes(-1)" ${finMesIdx===0?'disabled':''}>›</button>
    </div>

    <!-- RESUMO DO MÊS -->
    <div style="background:linear-gradient(135deg,rgba(52,199,89,0.1),rgba(79,142,255,0.06));border:1px solid rgba(52,199,89,0.2);border-radius:18px;padding:16px;margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
        <div>
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink3);margin-bottom:4px">${isMesFuturo?'Previsto':'Recebido'}</div>
          <div style="font-size:30px;font-weight:800;letter-spacing:-1px;color:var(--green)">${R(recPago)}</div>
          ${recPendente>0?`<div style="font-size:12px;color:var(--orange);margin-top:2px">+ ${R(recPendente)} a receber</div>`:''}
          ${recAtrasado>0?`<div style="font-size:12px;color:var(--red);margin-top:2px">⚠ ${R(recAtrasado)} em atraso</div>`:''}
        </div>
        <div style="text-align:right">
          <div style="font-size:11px;color:var(--ink3);margin-bottom:4px">Saldo do mês</div>
          <div style="font-size:20px;font-weight:700;color:${saldo>=0?'var(--green)':'var(--red)'}">${R(saldo)}</div>
          ${totalDespesa>0?`<div style="font-size:11px;color:var(--red);margin-top:2px">- ${R(totalDespesa)} saídas</div>`:''}
        </div>
      </div>
      <!-- Barra de progresso -->
      ${!isMesFuturo?`
      <div style="margin-bottom:6px;display:flex;justify-content:space-between;font-size:11px;color:var(--ink3)">
        <span>${pct}% recebido</span>
        <span>${R(totalReceita)} previsto</span>
      </div>
      <div style="background:var(--bg3);border-radius:20px;height:6px;overflow:hidden">
        <div style="background:linear-gradient(90deg,var(--green),#00E676);height:100%;width:${pct}%;border-radius:20px;transition:width 0.6s ease"></div>
      </div>`:''}
    </div>

    <!-- GRID CARDS -->
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px">
      <div class="fin-card" style="background:rgba(52,199,89,0.08);border-color:rgba(52,199,89,0.15)">
        <div class="fin-lbl">Pago</div>
        <div class="fin-val" style="color:var(--green);font-size:14px">${R(recPago)}</div>
      </div>
      <div class="fin-card" style="background:rgba(255,159,10,0.08);border-color:rgba(255,159,10,0.15)">
        <div class="fin-lbl">A receber</div>
        <div class="fin-val" style="color:var(--orange);font-size:14px">${R(recPendente)}</div>
      </div>
      <div class="fin-card" style="background:rgba(255,69,58,0.08);border-color:rgba(255,69,58,0.15)">
        <div class="fin-lbl">Saídas</div>
        <div class="fin-val" style="color:var(--red);font-size:14px">${R(totalDespesa)}</div>
      </div>
    </div>

    <!-- LANÇAMENTOS PENDENTES -->
    ${receitas.filter(f=>f.status==='pendente').length>0?`
    <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--orange);margin:14px 0 8px">A receber</div>
    ${receitas.filter(f=>f.status==='pendente').map(f=>{
      const cl=cls.find(c=>c.id===f.cliente_id);
      const atrasado=f.vencimento<hoje;
      return lancRow(f,cl,atrasado);
    }).join('')}`:''}

    <!-- LANÇAMENTOS PAGOS -->
    ${receitas.filter(f=>f.status==='pago').length>0?`
    <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--green);margin:14px 0 8px">Recebido</div>
    ${receitas.filter(f=>f.status==='pago').map(f=>{
      const cl=cls.find(c=>c.id===f.cliente_id);
      return lancRow(f,cl,false);
    }).join('')}`:''}

    <!-- SAÍDAS -->
    ${despesas.length>0?`
    <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--red);margin:14px 0 8px">Saídas</div>
    ${despesas.map(f=>{
      const cl=cls.find(c=>c.id===f.cliente_id);
      return lancRow(f,cl,false);
    }).join('')}`:''}

    ${doMes.length===0?'<div class="empty"><div class="empty-icon">◈</div><p>Nenhum lançamento neste mês</p></div>':''}
  `);
}

function navFinMes(dir){
  const todos=financeiro;
  const mesesSet=new Set();
  const hoje=new Date();
  const mesAtual=`${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,'0')}`;
  mesesSet.add(mesAtual);
  todos.forEach(f=>{if(f.vencimento)mesesSet.add(f.vencimento.slice(0,7));});
  const meses=[...mesesSet].sort().reverse();
  finMesIdx=Math.max(0,Math.min(meses.length-1,finMesIdx+dir));
  renderPagamentosMes(meses,todos,clientes);
}

function lancRow(f,cl,destaque){
  const hoje=new Date().toISOString().split('T')[0];

async function sincronizarGoogleAgenda(titulo,data,hora,descricao,tipo,clienteId){
  try{
    await initGcalClient();
    if(!gcalToken){
      // Pede token — no Safari precisa ser num clique, então mostramos toast orientando
      toast('Conecte o Google Agenda para sincronizar','er');
      return;
    }
    await criarEventoGCal(titulo,data,hora,descricao,tipo,clienteId);
  }catch(e){
    console.warn('Sync Google Agenda:',e);
  }
}

async function criarEventoGCal(titulo,data,hora,descricao,tipo,clienteId){
  const inicio=hora?`${data}T${hora}:00`:`${data}T09:00:00`;
  const[h,m]=hora?(hora.split(':').map(Number)):[9,0];
  const fimM=m+30;const fimH=h+(fimM>=60?1:0);
  const fim=`${data}T${String(fimH).padStart(2,'0')}:${String(fimM%60).padStart(2,'0')}:00`;

  // Cor por tipo: captacao=azul, entrega=verde, reuniao=roxo, outro=cinza
  const cores={captacao:'9',entrega:'2',reuniao:'3',outro:'8'};

  // Busca email do cliente se vinculado
  let attendees=[];
  if(clienteId){
    const cl=clientes.find(c=>c.id===clienteId);
    if(cl?.email)attendees=[{email:cl.email}];
  }

  const evento={
    summary:`${titulo}`,
    description:`${descricao||''}\n\nTipo: ${tipo}\nAgendado via 5essência`.trim(),
    start:{dateTime:inicio,timeZone:'America/Sao_Paulo'},
    end:{dateTime:fim,timeZone:'America/Sao_Paulo'},
    colorId:cores[tipo]||'8',
    attendees,
    reminders:{useDefault:false,overrides:[{method:'popup',minutes:30},{method:'email',minutes:60}]},
    ...(tipo==='reuniao'?{conferenceData:{createRequest:{requestId:Math.random().toString(36).slice(2),conferenceSolutionKey:{type:'hangoutsMeet'}}}}:{})
  };

  const url=tipo==='reuniao'
    ?'https://www.googleapis.com/calendar/v3/calendars/primary/events?conferenceDataVersion=1&sendUpdates=all'
    :'https://www.googleapis.com/calendar/v3/calendars/primary/events?sendUpdates=all';

  const res=await fetch(url,{
    method:'POST',
    headers:{'Authorization':`Bearer ${gcalToken}`,'Content-Type':'application/json'},
    body:JSON.stringify(evento)
  });
  const result=await res.json();
  if(result.error)throw new Error(result.error.message);
  toast('✓ Sincronizado com Google Agenda!');
}

}

// GOOGLE MEET
function loadGapiScript(){
  return new Promise(res=>{
    if(window.google?.accounts){res();return;}
    const s=document.createElement('script');
    s.src='https://accounts.google.com/gsi/client';
    s.onload=res;document.head.appendChild(s);
  });
}
async function initGcalClient(){
  await loadGapiScript();
  if(gcalClient)return;
  gcalClient=google.accounts.oauth2.initTokenClient({
    client_id:GCAL_CLIENT_ID,scope:GCAL_SCOPES,
    callback:(resp)=>{
      if(resp.error){toast('Erro Google: '+resp.error,'er');return;}
      gcalToken=resp.access_token;
      // Após conectar, executa ação pendente
      if(window._gcalPendingAction){
        window._gcalPendingAction();
        window._gcalPendingAction=null;
      } else {
        toast('✓ Google Agenda conectado!');
      }
    }
  });
}

// Botão para conectar Google Agenda (chamado diretamente pelo clique)
function conectarGoogleAgenda(){
  initGcalClient().then(()=>{
    window._gcalPendingAction=null;
    gcalClient.requestAccessToken();
  });
}
async function gerarMeet(){
  const titulo=val('ev-titulo').trim(),data=val('ev-data');
  if(!titulo||!data){toast('Preencha título e data primeiro','er');return;}
  const btn=g('btn-meet');
  if(btn){btn.textContent='Conectando…';btn.disabled=true;}
  await initGcalClient();
  if(gcalToken){
    executarCriacaoMeet();
  } else {
    // Registra ação pendente para executar após autorização
    window._gcalPendingAction=executarCriacaoMeet;
    gcalClient.requestAccessToken();
  }
}
async function executarCriacaoMeet(){
  const titulo=val('ev-titulo').trim(),data=val('ev-data'),hora=val('ev-hora');
  const clienteId=val('ev-cliente');
  const clienteSel=clientes.find(c=>c.id===clienteId);
  const btn=g('btn-meet');
  if(btn){btn.textContent='Gerando…';btn.disabled=true;}
  const inicio=hora?`${data}T${hora}:00`:`${data}T09:00:00`;
  const[h,m]=hora?(hora.split(':').map(Number)):[9,0];
  const fimM=m+30;const fimH=h+(fimM>=60?1:0);
  const fim=`${data}T${String(fimH).padStart(2,'0')}:${String(fimM%60).padStart(2,'0')}:00`;
  const evento={summary:titulo,description:val('ev-desc')||'',start:{dateTime:inicio,timeZone:'America/Sao_Paulo'},end:{dateTime:fim,timeZone:'America/Sao_Paulo'},conferenceData:{createRequest:{requestId:Math.random().toString(36).slice(2),conferenceSolutionKey:{type:'hangoutsMeet'}}},attendees:clienteSel?.email?[{email:clienteSel.email}]:[],reminders:{useDefault:false,overrides:[{method:'email',minutes:60},{method:'popup',minutes:30}]}};
  try{
    const res=await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events?conferenceDataVersion=1&sendUpdates=all',{method:'POST',headers:{'Authorization':`Bearer ${gcalToken}`,'Content-Type':'application/json'},body:JSON.stringify(evento)});
    const data2=await res.json();
    if(data2.error)throw new Error(data2.error.message);
    meetLinkGerado=data2.conferenceData?.entryPoints?.find(e=>e.entryPointType==='video')?.uri||null;
    if(meetLinkGerado){
      const el=g('meet-resultado'),lnk=g('meet-link-display');
      if(el)el.style.display='block';
      if(lnk){lnk.href=meetLinkGerado;lnk.textContent=meetLinkGerado;}
      if(btn){btn.textContent='✓ Gerado';btn.disabled=true;}
      toast('✓ Link do Meet gerado!');
    }
  }catch(e){toast('Erro Meet: '+e.message,'er');if(btn){btn.textContent='Tentar novamente';btn.disabled=false;}}
}

async function iniciarLembretes(){
  if(currentRole!=='cliente'||!currentClienteId)return;
  await verificarProximaReuniao();
  if(lembreteInterval)clearInterval(lembreteInterval);
  lembreteInterval=setInterval(verificarProximaReuniao,60000);
}
async function verificarProximaReuniao(){
  const agora=new Date();
  const hojeStr=agora.toISOString().split('T')[0];
  const{data:eventos}=await db.from('agenda').select('*').eq('tipo','reuniao').eq('cliente_id',currentClienteId).eq('data',hojeStr).not('hora','is',null).not('meet_link','is',null);
  if(!eventos||eventos.length===0){esconderLembrete();return;}
  let maisProxima=null;let menorDiff=Infinity;
  for(const ev of eventos){
    const[h,m]=ev.hora.split(':').map(Number);
    const dataEvento=new Date(agora);dataEvento.setHours(h,m,0,0);
    const diff=(dataEvento-agora)/60000;
    if(diff>-5&&diff<60&&diff<menorDiff){menorDiff=diff;maisProxima={...ev,diffMin:diff};}
  }
  if(!maisProxima){esconderLembrete();return;}
  proximaReuniaoLink=maisProxima.meet_link;
  const banner=g('lembrete-banner'),pulse=g('lembrete-pulse'),titulo=g('lembrete-titulo'),sub=g('lembrete-sub'),btn=g('lembrete-btn');
  banner?.classList.add('show');
  if(titulo)titulo.textContent=`🎥 ${maisProxima.titulo}`;
  if(maisProxima.diffMin<=0){if(sub)sub.textContent='A reunião já começou!';pulse?.classList.add('urgente');if(btn){btn.disabled=false;btn.textContent='Entrar agora';}}
  else if(maisProxima.diffMin<=10){const mins=Math.ceil(maisProxima.diffMin);if(sub)sub.textContent=`Começa em ${mins} min`;pulse?.classList.add('urgente');if(btn){btn.disabled=false;btn.textContent='Entrar no Meet';}}
  else{const mins=Math.ceil(maisProxima.diffMin);if(sub)sub.textContent=`Começa em ${mins} min — link ativa em breve`;pulse?.classList.remove('urgente');if(btn){btn.disabled=true;btn.textContent='Aguardando…';}}
}
function esconderLembrete(){g('lembrete-banner')?.classList.remove('show');proximaReuniaoLink=null;}

async function renderPortalMetricas(){

function renderKpiCards(m){

const FERIADOS_BR=['01-01','04-21','05-01','09-07','10-12','11-02','11-15','11-20','12-25'];

function isFeriado(date){
  const mmdd=`${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
  return FERIADOS_BR.includes(mmdd);
}

function isUtil(date){
  const d=date.getDay();
  return d!==0&&d!==6&&!isFeriado(date);
}

async function abrirNotificacoes(){
  const q=currentRole==='admin'
    ?db.from('notificacoes').select('*,clientes(nome_completo)').order('created_at',{ascending:false}).limit(50)
    :db.from('notificacoes').select('*').or(`cliente_id.eq.${currentClienteId},cliente_id.is.null`).order('created_at',{ascending:false}).limit(50);
  const{data:notifs}=await q;

  // Marca todas como lidas
  if(currentRole==='admin'){
    await db.from('notificacoes').update({lida:true}).eq('lida',false).is('cliente_id',null);
  } else {
    await db.from('notificacoes').update({lida:true}).eq('lida',false).or(`cliente_id.eq.${currentClienteId},cliente_id.is.null`);
  }
  verificarNotificacoesNaoLidas();

  const fmtTempo=ts=>{
    const d=new Date(ts);const agora=new Date();
    const diff=Math.floor((agora-d)/1000);
    if(diff<60)return'agora';if(diff<3600)return`${Math.floor(diff/60)}min`;

    return`${Math.floor(diff/86400)}d`;
  };

  openModal('Notificações',`
    <div style="display:flex;flex-direction:column;gap:2px">
      ${currentRole==='admin'?`
      <button class="btn btn-primary btn-sm" style="margin-bottom:12px;width:100%;justify-content:center" onclick="formNovaNotificacao()">+ Criar notificação</button>`:''}

            ${n.tipo==='info'?'◈':n.tipo==='sucesso'?'◎':n.tipo==='alerta'?'◷':'◉'}
          </div>
          <div style="flex:1;min-width:0">
            ${currentRole==='admin'&&n.clientes?`<div style="font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:3px">${n.clientes.nome_completo}</div>`:''}

function abrirCalendarioCall(prioridade){
  const hoje=new Date();
  const diasMin=prioridade==='urgente'?2:prioridade==='media'?4:7;
  const diasMax=prioridade==='urgente'?4:prioridade==='media'?8:14;
  const horarios=['08:00','09:00','10:00','11:00','14:00','15:00','16:00','17:00'];

  // Gera datas disponíveis
  const datas=[];
  let d=new Date(hoje);
  let diasContados=0;
  while(datas.length<(diasMax-diasMin+3)){
    d=new Date(d.getTime()+86400000);
    if(isUtil(d)){
      diasContados++;
      if(diasContados>=diasMin) datas.push(new Date(d));
    }
    if(datas.length>=6)break;
  }

  const corPrior=prioridade==='urgente'?'var(--red)':prioridade==='media'?'var(--orange)':'var(--blue)';
  const labelPrior=prioridade==='urgente'?'Urgente':prioridade==='media'?'Média':'Baixa';

  openModal('Escolha data e horário',`
    <div style="margin-bottom:12px;display:flex;align-items:center;gap:8px">
      <span style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:${corPrior}">◉ Prioridade ${labelPrior}</span>
    </div>
    <div class="fg" style="margin-bottom:12px">
      <label>Data preferida</label>
      <select id="call-data">
        ${datas.map(d=>`<option value="${d.toISOString().split('T')[0]}">${d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</option>`).join('')}
      </select>
    </div>
    <div class="fg" style="margin-bottom:12px">
      <label>Horário preferido</label>
      <select id="call-hora">
        ${horarios.map(h=>`<option value="${h}">${h}</option>`).join('')}
      </select>
    </div>
    <div class="fg">
      <label>Assunto (opcional)</label>
      <input id="call-assunto" placeholder="Ex: Alinhamento de campanha, revisão de projeto…">
    </div>
    <div style="background:rgba(255,159,10,0.08);border:1px solid rgba(255,159,10,0.2);border-radius:12px;padding:10px 14px;margin-top:4px;font-size:12px;color:var(--orange)">
      ◷ A solicitação fica pendente até aprovação da 5essência
    </div>
  `,`
    <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-primary" onclick="confirmarCall('${prioridade}')">Solicitar call</button>
  `);
}

async function salvarCallComGoogle(prioridade,data,hora,assunto){
  closeModal();
  await initGcalClientCliente();
  if(gcalTokenCliente){
    await _salvarCall(prioridade,data,hora,assunto,true);
  } else {
    window._gcalClientePending=()=>_salvarCall(prioridade,data,hora,assunto,true);
    gcalClienteClient.requestAccessToken();
  }
}

async function salvarCallSemGoogle(prioridade,data,hora,assunto){
  closeModal();
  await _salvarCall(prioridade,data,hora,assunto,false);
}

async function _salvarCall(prioridade,data,hora,assunto,comGoogle){
  const conteudo=`Call solicitada — ${assunto}\nData preferida: ${new Date(data+'T00:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})} às ${hora}\nPrioridade: ${prioridade}`;
  const{error}=await db.from('insights').insert({
    cliente_id:currentClienteId,conteudo,tipo:'call',
    status:'pendente',prioridade,data_preferida:data,hora_preferida:hora,
    created_at:new Date().toISOString()
  });
  if(error){toast('Erro ao solicitar','er');return;}

  // Notifica admin
  const{data:cl}=await db.from('clientes').select('nome_completo').eq('id',currentClienteId).single();
  await criarNotificacaoSistema(
    `◷ Call solicitada por ${cl?.nome_completo||'cliente'} — ${new Date(data+'T00:00:00').toLocaleDateString('pt-BR',{day:'numeric',month:'short'})} às ${hora} · Prioridade: ${prioridade}`,
    'alerta',null
  );

  // Google Agenda do cliente
  if(comGoogle&&gcalTokenCliente){
    try{
      const inicio=`${data}T${hora}:00`;
      const[h,m]=hora.split(':').map(Number);
      const fim=`${data}T${String(h+1).padStart(2,'0')}:${String(m).padStart(2,'0')}:00`;
      await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events',{
        method:'POST',
        headers:{'Authorization':`Bearer ${gcalTokenCliente}`,'Content-Type':'application/json'},
        body:JSON.stringify({
          summary:`[Pendente] Call — 5essência Marketing`,
          description:`${assunto}\n\nAguardando confirmação da 5essência Marketing.`,
          start:{dateTime:inicio,timeZone:'America/Sao_Paulo'},
          end:{dateTime:fim,timeZone:'America/Sao_Paulo'},
          colorId:'5'
        })
      });
    }catch(e){console.warn('Google Agenda cliente:',e);}
  }

  toast('Call solicitada! Aguarde confirmação da 5essência');
  renderPortalInsights();
}

// Google Agenda do CLIENTE (token separado do admin)
let gcalTokenCliente=null;
let gcalClienteClient=null;
const GCAL_SCOPES_CLIENTE='https://www.googleapis.com/auth/calendar.events';

async function initGcalClientCliente(){
  await loadGapiScript();
  if(gcalClienteClient)return;
  gcalClienteClient=google.accounts.oauth2.initTokenClient({
    client_id:GCAL_CLIENT_ID,scope:GCAL_SCOPES_CLIENTE,
    callback:(resp)=>{
      if(resp.error){toast('Erro Google: '+resp.error,'er');return;}
      gcalTokenCliente=resp.access_token;
      if(window._gcalClientePending){window._gcalClientePending();window._gcalClientePending=null;}
      else toast('Google Agenda conectado!');
    }
  });
}

async function renderAdminInsights(){
  const{data:ins}=await db.from('insights').select('*,clientes(nome_completo)').order('created_at',{ascending:false});
  const{data:cls}=await db.from('clientes').select('id,nome_completo');
  clientes=cls||[];

  // Agrupa por cliente
  const porCliente={};
  (ins||[]).forEach(i=>{
    const cid=i.cliente_id||'sem';
    if(!porCliente[cid])porCliente[cid]=[];
    porCliente[cid].push(i);
  });

  setPage('insights',`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div class="section-title" style="margin:0">Insights</div>
    </div>
    ${Object.keys(porCliente).length===0?'<div class="empty"><div class="empty-icon">◉</div><p>Nenhum insight ainda</p></div>':''}
    ${Object.entries(porCliente).map(([cid,items])=>{
      const cl=items[0]?.clientes;
      return`
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink3);margin:14px 0 8px">${cl?.nome_completo||'Sem cliente'}</div>
        ${items.map(i=>`
          <div style="background:var(--bg1);border:1px solid ${i.tipo==='call'?'rgba(79,142,255,0.25)':'rgba(191,90,242,0.2)'};border-radius:14px;padding:14px;margin-bottom:8px">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
              <span style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:${i.tipo==='call'?'var(--blue)':'var(--purple)'}">
                ${i.tipo==='call'?'◷ Call':'◉ Ideia'}${i.prioridade?` · ${i.prioridade}`:''}
              </span>
              <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
                ${badge(i.status||'pendente')}
                ${i.status==='pendente'?`
                  ${i.tipo==='call'?`<button class="btn btn-ghost btn-sm" style="font-size:11px;color:var(--green);border-color:rgba(52,199,89,0.3)" onclick="aprovarCall('${i.id}','${i.cliente_id}','${i.data_preferida||''}','${i.hora_preferida||''}')">✓ Aceitar call</button>`:''}
                  <button class="btn btn-ghost btn-sm" style="font-size:11px;color:var(--blue);border-color:rgba(79,142,255,0.3)" onclick="resolverInsight('${i.id}','${i.cliente_id}')">◎ Resolver</button>
                `:''}
              </div>
            </div>
            <div style="font-size:13px;color:var(--ink);line-height:1.5">${i.conteudo}</div>
            <div style="font-size:11px;color:var(--ink4);margin-top:6px">${new Date(i.created_at).toLocaleDateString('pt-BR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div>
          </div>
        `).join('')}
      `;
    }).join('')}
  `);
}

async function resolverInsight(insightId,clienteId){
  await db.from('insights').update({status:'aprovado'}).eq('id',insightId);
  await criarNotificacaoSistema('◎ Sua solicitação foi marcada como resolvida pela 5essência','sucesso',clienteId);
  toast('Marcado como resolvido!');
  renderAdminInsights();
  verificarNotificacoesNaoLidas();
}

async function cancelarInsight(insightId){
  if(!confirm('Cancelar esta solicitação?'))return;
  await db.from('insights').update({status:'cancelado'}).eq('id',insightId);
  toast('Solicitação cancelada');
  renderPortalInsights();
}

async function aprovarCall(insightId,clienteId,data,hora){
  await db.from('insights').update({status:'aprovado'}).eq('id',insightId);
  const{data:cl}=await db.from('clientes').select('nome_completo,email').eq('id',clienteId).single();
  if(data&&hora){
    await db.from('agenda').insert({
      titulo:`Call — ${cl?.nome_completo||'Cliente'}`,
      tipo:'reuniao',data,hora,cliente_id:clienteId,
      descricao:'Call solicitada pelo cliente via Insights'
    });
  }
  await criarNotificacaoSistema(
    `◷ Sua call foi confirmada para ${data?new Date(data+'T00:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'}):'em breve'}${hora?' às '+hora:''}`,
    'sucesso',clienteId
  );
  toast('Call aprovada e cliente notificado!');
  renderAdminInsights();
  verificarNotificacoesNaoLidas();
}

// INIT
db.auth.getSession().then(({data:{session}})=>{if(session?.user)initSession(session.user);});
</script>
