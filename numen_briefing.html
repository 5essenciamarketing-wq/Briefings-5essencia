<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NUMEN · Briefing</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400;500&display=swap');

*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#06040a;color:#e4e0d8;font-family:'Inter',sans-serif;overflow:hidden;}

body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse at 15% 20%, rgba(90,50,140,0.13) 0%, transparent 50%),
    radial-gradient(ellipse at 85% 75%, rgba(60,30,110,0.09) 0%, transparent 50%);
}

/* ===== LAYOUT ===== */
.app{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;}

/* TOP BAR */
.topbar{
  flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:1.4rem 3rem;
  border-bottom:0.5px solid rgba(255,255,255,0.06);
}
.tl{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:300;letter-spacing:0.22em;color:rgba(255,255,255,0.6);}
.tr-info{display:flex;align-items:center;gap:1.5rem;}
.step-label{font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.2);}

/* PROGRESS LINE */
.progress-line{flex-shrink:0;height:1px;background:rgba(255,255,255,0.05);}
.progress-fill{height:1px;background:rgba(255,255,255,0.35);transition:width 0.5s cubic-bezier(.4,0,.2,1);}

/* DOTS NAV */
.dots-wrap{
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  gap:6px;padding:1rem 0;
}
.dot{
  width:5px;height:5px;border-radius:50%;
  background:rgba(255,255,255,0.1);
  transition:all 0.3s;cursor:default;flex-shrink:0;
}
.dot.done{background:rgba(255,255,255,0.3);}
.dot.active{background:#fff;width:18px;border-radius:3px;}

/* MAIN STAGE */
.stage{
  flex:1;overflow:hidden;position:relative;
}

/* SLIDES CONTAINER */
.slides{
  display:flex;height:100%;
  transition:transform 0.45s cubic-bezier(.4,0,.2,1);
}
.slide{
  min-width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  padding:2rem 3rem;
  overflow-y:auto;
}
.slide-inner{width:100%;max-width:680px;}

/* ===== SLIDE TYPES ===== */

/* COVER */
.cover-eye{font-size:9px;letter-spacing:0.28em;text-transform:uppercase;color:rgba(255,255,255,0.18);margin-bottom:1.5rem;}
.cover-logo{font-family:'Cormorant Garamond',serif;font-size:90px;font-weight:300;letter-spacing:0.14em;color:#fff;line-height:1;}
.cover-tagline{font-size:12px;font-weight:300;letter-spacing:0.1em;color:rgba(255,255,255,0.28);margin-top:1rem;}
.cover-rule{width:36px;height:0.5px;background:rgba(255,255,255,0.15);margin:2.5rem 0;}
.cover-desc{
  font-family:'Cormorant Garamond',serif;font-style:italic;font-size:20px;font-weight:300;
  color:rgba(255,255,255,0.42);line-height:1.7;margin-bottom:3rem;max-width:520px;
}

/* SECTION INTRO SLIDE */
.si-tag{font-size:9px;letter-spacing:0.24em;text-transform:uppercase;color:rgba(255,255,255,0.18);margin-bottom:0.8rem;}
.si-name{font-family:'Cormorant Garamond',serif;font-size:52px;font-weight:300;color:#fff;line-height:1;margin-bottom:0.6rem;}
.si-name em{font-style:italic;color:rgba(255,255,255,0.35);}
.si-spec{font-size:13px;font-weight:300;color:rgba(255,255,255,0.3);margin-bottom:1.5rem;}
.si-intro{
  font-family:'Cormorant Garamond',serif;font-style:italic;font-size:19px;font-weight:300;
  color:rgba(255,255,255,0.4);line-height:1.7;margin-bottom:3rem;max-width:560px;
}

/* QUESTION SLIDE */
.q-meta{display:flex;align-items:baseline;gap:0.8rem;margin-bottom:1.8rem;}
.q-num{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;color:rgba(255,255,255,0.16);}
.q-cat{font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.16);}
.q-text{
  font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:300;
  color:#fff;line-height:1.5;margin-bottom:0.9rem;
}
.q-hint{font-size:12px;font-weight:300;color:rgba(255,255,255,0.25);font-style:italic;margin-bottom:2rem;line-height:1.6;}
textarea.qa{
  width:100%;
  background:transparent;
  border:none;border-bottom:0.5px solid rgba(255,255,255,0.15);
  color:rgba(255,255,255,0.85);
  font-family:'Inter',sans-serif;font-size:15px;font-weight:300;
  padding:0.6rem 0;resize:none;height:80px;
  outline:none;transition:border 0.2s;line-height:1.7;
  border-radius:0;
}
textarea.qa:focus{border-bottom-color:rgba(255,255,255,0.4);}
textarea.qa::placeholder{color:rgba(255,255,255,0.14);}
textarea.qa.err{border-bottom-color:rgba(200,80,80,0.5);}
.req-msg{font-size:11px;color:rgba(200,100,100,0.7);margin-top:0.5rem;display:none;}
.req-msg.show{display:block;}

/* TRANSITION SLIDE */
.tr-check{
  width:50px;height:50px;border:0.5px solid rgba(100,220,130,0.3);
  border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:1.8rem;
}
.tr-title{font-family:'Cormorant Garamond',serif;font-size:40px;font-weight:300;color:#fff;margin-bottom:0.5rem;}
.tr-sub{font-size:12px;font-weight:300;color:rgba(255,255,255,0.28);letter-spacing:0.06em;margin-bottom:2.5rem;}
.tr-rule{width:36px;height:0.5px;background:rgba(255,255,255,0.1);margin-bottom:2.5rem;}
.tr-card{border:0.5px solid rgba(255,255,255,0.08);padding:1.8rem 2rem;margin-bottom:3rem;}
.tc-eye{font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.18);margin-bottom:0.6rem;}
.tc-title{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:300;color:#fff;margin-bottom:0.8rem;}
.tc-desc{font-size:13px;font-weight:300;color:rgba(255,255,255,0.35);line-height:1.75;}

/* DONE SLIDE */
.done-logo{font-family:'Cormorant Garamond',serif;font-size:76px;font-weight:300;letter-spacing:0.14em;color:#fff;margin-bottom:0.5rem;}
.done-sub{font-size:12px;letter-spacing:0.1em;color:rgba(255,255,255,0.22);margin-bottom:2.5rem;}
.done-rule{width:36px;height:0.5px;background:rgba(255,255,255,0.1);margin-bottom:2.5rem;}
.done-msg{
  font-family:'Cormorant Garamond',serif;font-style:italic;font-size:20px;font-weight:300;
  color:rgba(255,255,255,0.38);line-height:1.7;margin-bottom:2.5rem;max-width:460px;
}
.done-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:2rem;}
.done-tag{
  padding:0.45rem 0.9rem;border:0.5px solid rgba(255,255,255,0.1);
  font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.28);
}
.done-sig{font-size:10px;color:rgba(255,255,255,0.12);letter-spacing:0.08em;margin-top:3rem;}

/* ===== BOTTOM NAV ===== */
.bottom{
  flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:1.2rem 3rem;
  border-top:0.5px solid rgba(255,255,255,0.05);
}
.btn-back{
  display:inline-flex;align-items:center;gap:0.5rem;
  padding:0.7rem 1.2rem;
  border:0.5px solid rgba(255,255,255,0.1);
  background:transparent;color:rgba(255,255,255,0.35);
  font-family:'Inter',sans-serif;font-size:9px;font-weight:400;
  letter-spacing:0.15em;text-transform:uppercase;cursor:pointer;transition:all 0.25s;
}
.btn-back:hover{border-color:rgba(255,255,255,0.22);color:rgba(255,255,255,0.6);}
.btn-next{
  display:inline-flex;align-items:center;gap:0.6rem;
  padding:0.8rem 1.8rem;
  border:0.5px solid rgba(255,255,255,0.28);
  background:transparent;color:#fff;
  font-family:'Inter',sans-serif;font-size:9px;font-weight:400;
  letter-spacing:0.16em;text-transform:uppercase;cursor:pointer;transition:all 0.3s;
}
.btn-next:hover{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.5);}
.btn-next:active{transform:scale(0.97);}
.btn-next.loading{opacity:0.4;pointer-events:none;}
.btn-next.success{border-color:rgba(100,220,130,0.45);color:rgba(130,230,150,0.9);}
.btn-next:disabled{opacity:0.3;pointer-events:none;}

/* KEYBOARD HINT */
.kbd-hint{font-size:9px;letter-spacing:0.1em;color:rgba(255,255,255,0.13);}

/* TOAST */
.toast{
  position:fixed;bottom:5rem;right:2rem;z-index:300;
  padding:0.85rem 1.3rem;
  background:rgba(10,6,18,0.97);border:0.5px solid rgba(255,255,255,0.1);
  font-size:12px;color:rgba(255,255,255,0.65);font-family:'Inter',sans-serif;
  opacity:0;transition:opacity 0.3s;pointer-events:none;max-width:280px;line-height:1.5;
}
.toast.show{opacity:1;}
.toast.ok{border-color:rgba(100,220,130,0.3);color:rgba(130,230,150,0.8);}
.toast.err{border-color:rgba(220,100,100,0.3);color:rgba(230,130,130,0.8);}
</style>
</head>

          <div class="tr-sub">Dr. Gibran · Autoridade clínica</div>
          <div class="tr-rule"></div>
          <div class="tr-card">
            <div class="tc-eye">O papel da Dra. Fernanda no NUMEN</div>
            <div class="tc-title">Gestora comercial da clínica</div>
            <div class="tc-desc">A Dra. Fernanda vai assumir a gestão comercial com a credibilidade de quem é médica e conhece a operação por dentro. Ela será treinada pela Quintessência para conduzir leads, acompanhar métricas, operar os sistemas e garantir que cada paciente chegue ao fechamento com segurança e confiança.<br><br>Sua presença eventual nas cirurgias não é o foco — o foco é usar sua autoridade médica como diferencial no processo de decisão do paciente.</div>
          </div>
        </div>`;
    }

    else if(s.type === 'done') {
      div.innerHTML = `
        <div class="slide-inner">
          <div class="done-logo">NUMEN</div>
          <div class="done-sub">Briefings recebidos com sucesso</div>
          <div class="done-rule"></div>
          <div class="done-msg">Tudo que precisamos para começar já está aqui. A equipe Quintessência vai construir algo que é genuinamente seu.</div>
          <div class="done-tags">
            <div class="done-tag">Dr. Gibran · enviado</div>
            <div class="done-tag">Dra. Fernanda · enviado</div>
            <div class="done-tag">Salvo no Supabase</div>
          </div>
          <div class="done-sig">Quintessência Marketing · Programa NUMEN</div>
        </div>`;
    }

    container.appendChild(div);
  });
}

// ===== DOTS =====
function buildDots() {
  const wrap = document.getElementById('dots-wrap');
  wrap.innerHTML = '';
  SLIDES.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    d.id = 'dot-' + i;
    wrap.appendChild(d);
  });
}

function updateDots() {
  SLIDES.forEach((_, i) => {
    const d = document.getElementById('dot-' + i);
    if(!d) return;
    d.className = 'dot' + (i === cur ? ' active' : i < cur ? ' done' : '');
  });
}

// ===== PROGRESS =====
function updateProgress() {
  const pct = TOTAL <= 1 ? 100 : Math.round((cur / (TOTAL - 1)) * 100);
  document.getElementById('prog-fill').style.width = pct + '%';
}

// ===== STEP LABEL =====
function updateLabel() {
  const s = SLIDES[cur];
  let label = '';
  if(s.type === 'cover') label = 'Apresentação';
  else if(s.type === 'intro-g') label = 'Dr. Gibran · Início';
  else if(s.type === 'intro-f') label = 'Dra. Fernanda · Início';
  else if(s.type === 'q') {
    const name = s.who === 'g' ? 'Dr. Gibran' : 'Dra. Fernanda';
    label = `${name} · ${s.n} / 15`;
  }
  else if(s.type === 'send-g') label = 'Transição';
  else if(s.type === 'done') label = 'Concluído';
  document.getElementById('step-label').textContent = label;
}

// ===== BOTTOM NAV =====
function updateNav() {
  const s = SLIDES[cur];
  const btnBack = document.getElementById('btn-back');
  const btnNext = document.getElementById('btn-next');
  const kbdHint = document.getElementById('kbd-hint');

  btnBack.style.visibility = cur === 0 ? 'hidden' : 'visible';
  btnNext.classList.remove('loading','success');

  if(s.type === 'done') {
    btnNext.style.display = 'none';
    kbdHint.style.display = 'none';
  } else if(s.type === 'send-g') {
    btnNext.innerHTML = `Enviar briefing do Dr. Gibran <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17,21 17,13 7,13 7,21"/><polyline points="7,3 7,8 15,8"/></svg>`;
    kbdHint.style.display = 'none';
    btnNext.style.display = '';
  } else if(s.type === 'done') {
    btnNext.style.display = 'none';
  } else {
    const isLast = SLIDES[cur+1] && SLIDES[cur+1].type === 'done';
    const isFSend = isLast || (s.type === 'q' && s.who === 'f' && s.n === 15);
    if(s.type === 'q' && s.who === 'f' && s.n === 15) {
      btnNext.innerHTML = `Enviar briefing da Dra. Fernanda <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17,21 17,13 7,13 7,21"/><polyline points="7,3 7,8 15,8"/></svg>`;
      kbdHint.style.display = 'none';
    } else {
      btnNext.innerHTML = `Avançar <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12,5 19,12 12,19"/></svg>`;
      kbdHint.style.display = '';
    }
    btnNext.style.display = '';
  }
}

// ===== RENDER =====
function render() {
  document.getElementById('slides').style.transform = `translateX(-${cur * 100}%)`;
  updateDots();
  updateProgress();
  updateLabel();
  updateNav();

  // auto-focus textarea
  setTimeout(() => {
    const s = SLIDES[cur];
    if(s.type === 'q') {
      const ta = document.getElementById('qa-' + s.who + s.n);
      if(ta) ta.focus();
    }
  }, 460);
}

// ===== SAVE ANSWER =====
function saveAns(who, n, val) {
  R[who]['q' + n] = val.trim();
}

// ===== VALIDATE CURRENT =====
function validate() {
  const s = SLIDES[cur];
  if(s.type !== 'q' || !s.req) return true;
  const id = s.who + s.n;
  const val = (R[s.who]['q' + s.n] || '').trim();
  const reqEl = document.getElementById('req-' + id);
  const ta = document.getElementById('qa-' + id);
  if(val.length < 3) {
    ta && ta.classList.add('err');
    reqEl && reqEl.classList.add('show');
    ta && ta.focus();
    return false;
  }
  ta && ta.classList.remove('err');
  reqEl && reqEl.classList.remove('show');
  return true;
}

// ===== NAVIGATION =====
function prev() {
  if(cur > 0) { cur--; render(); }
}

async function next() {
  const s = SLIDES[cur];

  // enviar gibran
  if(s.type === 'send-g') {
    await enviar('gibran');
    return;
  }

  // última pergunta fernanda — enviar
  if(s.type === 'q' && s.who === 'f' && s.n === 15) {
    if(!validate()) return;
    saveFromTextarea(s);
    await enviar('fernanda');
    return;
  }

  if(!validate()) return;

  // salva valor atual antes de sair
  if(s.type === 'q') {
    const ta = document.getElementById('qa-' + s.who + s.n);
    if(ta) R[s.who]['q' + s.n] = ta.value.trim();
  }

  if(cur < TOTAL - 1) { cur++; render(); }
}

function saveFromTextarea(s) {
  if(s.type === 'q') {
    const ta = document.getElementById('qa-' + s.who + s.n);
    if(ta) R[s.who]['q' + s.n] = ta.value.trim();
  }
}

// ===== ENTER KEY =====
function handleKey(e) {
  if(e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    next();
  }
}

document.addEventListener('keydown', (e) => {
  const s = SLIDES[cur];
  if(s && s.type === 'q') return; // textarea handles it
  if(e.key === 'Enter' || e.key === 'ArrowRight') next();
  if(e.key === 'ArrowLeft') prev();
});

// ===== TOAST =====
function toast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => t.className = 'toast', 3500);
}

// ===== ENVIAR SUPABASE =====
async function enviar(who) {
  const btn = document.getElementById('btn-next');
  btn.classList.add('loading');

  const payload = {
    medico: who,
    criado_em: new Date().toISOString(),
    respostas: { ...R[who === 'gibran' ? 'g' : 'f'] }
  };

  try {
    const { error } = await db.from('numen_briefings').insert([payload]);
    btn.classList.remove('loading');
    if(error) {
      toast('Erro ao salvar: ' + error.message, 'err');
      console.error(error);
    } else {
      btn.classList.add('success');
      toast(who === 'gibran' ? 'Briefing do Dr. Gibran salvo.' : 'Briefing da Dra. Fernanda salvo.', 'ok');
      setTimeout(() => { cur++; render(); }, 900);
    }
  } catch(e) {
    btn.classList.remove('loading');
    toast('Falha na conexão com o Supabase.', 'err');
    console.error(e);
  }
}

// ===== INIT =====
buildSlides();
buildDots();
render();
</script>
</body>
</html>
