<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM — Gibran Chedid</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080a10;
  --s1: #0f1219;
  --s2: #161b25;
  --s3: #1e2433;
  --s4: #252d40;
  --b1: rgba(255,255,255,0.05);
  --b2: rgba(255,255,255,0.09);
  --b3: rgba(255,255,255,0.14);
  --text: #f0f2f8;
  --t2: #8b95b0;
  --t3: #4a526b;
  --gold: #c9a96e;
  --gold2: rgba(201,169,110,0.12);
  --gold3: rgba(201,169,110,0.06);
  --glow: 0 0 20px rgba(201,169,110,0.15);
  --green: #22c55e;
  --blue: #60a5fa;
  --orange: #fb923c;
  --purple: #c084fc;
  --red: #f87171;
  --r: 14px;
  --r2: 10px;
  --r3: 7px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;height:100vh;overflow:hidden;background-image:radial-gradient(ellipse 50% 60% at 0% 0%,rgba(201,169,110,0.04),transparent),radial-gradient(ellipse 40% 50% at 100% 100%,rgba(96,165,250,0.03),transparent);}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--s4);border-radius:4px;}

/* LOGIN */
#login-screen{display:flex;align-items:center;justify-content:center;height:100vh;}
.login-wrap{width:380px;}
.login-logo-wrap{display:flex;justify-content:center;margin-bottom:32px;}
.login-logo{width:120px;height:120px;border-radius:50%;object-fit:cover;border:1px solid rgba(201,169,110,0.3);box-shadow:0 0 40px rgba(201,169,110,0.12),0 0 80px rgba(201,169,110,0.05);}
.login-card{background:rgba(15,18,25,0.8);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--b2);border-radius:20px;padding:36px 36px 40px;box-shadow:0 32px 80px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.06);}
.login-eyebrow{font-size:10px;letter-spacing:0.35em;text-transform:uppercase;color:var(--gold);font-weight:500;text-align:center;margin-bottom:4px;}
.login-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:300;color:var(--text);text-align:center;margin-bottom:28px;}
.lf{width:100%;background:var(--s2);border:1px solid var(--b2);color:var(--text);padding:11px 16px;border-radius:var(--r2);font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;margin-bottom:10px;outline:none;transition:border-color 0.15s,box-shadow 0.15s;}
.lf:focus{border-color:rgba(201,169,110,0.5);box-shadow:0 0 0 3px rgba(201,169,110,0.08);}
.lf::placeholder{color:var(--t3);}
.lb{width:100%;padding:12px;background:linear-gradient(135deg,#c9a96e,#a07840);color:#080a10;border:none;border-radius:var(--r2);font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;margin-top:6px;transition:opacity 0.15s,transform 0.1s,box-shadow 0.15s;box-shadow:0 4px 20px rgba(201,169,110,0.3);}
.lb:hover{opacity:0.9;transform:translateY(-1px);box-shadow:0 6px 28px rgba(201,169,110,0.4);}
.lb:active{transform:translateY(0);}
.lerr{color:var(--red);font-size:12px;margin-top:10px;text-align:center;display:none;}

/* APP */
#app{display:none;flex-direction:column;height:100vh;}

/* TOPBAR */
.topbar{height:54px;background:rgba(15,18,25,0.7);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--b1);display:flex;align-items:center;padding:0 16px 0 12px;gap:12px;flex-shrink:0;}
.tb-brand{display:flex;align-items:center;gap:10px;padding:4px 8px;border-radius:var(--r2);margin-right:4px;}
.tb-logo{width:28px;height:28px;border-radius:50%;object-fit:cover;border:1px solid rgba(201,169,110,0.35);box-shadow:0 0 10px rgba(201,169,110,0.2);}
.tb-name{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:400;color:var(--text);white-space:nowrap;}
.tb-sep{width:1px;height:20px;background:var(--b2);margin:0 4px;}
.tb-nav{display:flex;gap:2px;}
.tab{padding:6px 14px;border-radius:var(--r3);font-size:12px;font-weight:500;color:var(--t2);cursor:pointer;transition:all 0.15s;border:none;background:none;font-family:'Plus Jakarta Sans',sans-serif;}
.tab:hover{background:var(--b1);color:var(--text);}
.tab.active{background:var(--s3);color:var(--text);}
.tb-right{display:flex;align-items:center;gap:8px;margin-left:auto;}
.search{background:var(--s2);border:1px solid var(--b1);color:var(--text);padding:7px 14px;border-radius:30px;font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;width:190px;outline:none;transition:all 0.2s;}
.search:focus{border-color:rgba(201,169,110,0.35);width:230px;box-shadow:0 0 0 3px rgba(201,169,110,0.06);}
.search::placeholder{color:var(--t3);}
.ib{width:32px;height:32px;background:var(--s2);border:1px solid var(--b1);border-radius:var(--r3);color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all 0.15s;}
.ib:hover{color:var(--text);border-color:var(--b2);}
.av{width:30px;height:30px;border-radius:50%;object-fit:cover;border:1.5px solid rgba(201,169,110,0.4);cursor:pointer;transition:all 0.15s;box-shadow:0 0 10px rgba(201,169,110,0.15);}
.av:hover{border-color:var(--gold);box-shadow:0 0 14px rgba(201,169,110,0.3);}

/* LAYOUT */
.main-layout{display:flex;height:calc(100vh - 54px);overflow:hidden;}

/* SIDEBAR */
.sidebar{width:192px;background:rgba(12,15,20,0.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-right:1px solid var(--b1);padding:10px;flex-shrink:0;display:flex;flex-direction:column;gap:2px;}
.sb-sec{font-size:9.5px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--t3);padding:8px 8px 4px;}
.sb-item{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-radius:var(--r2);cursor:pointer;transition:all 0.12s;color:var(--t2);font-size:12px;font-weight:400;}
.sb-item:hover{background:var(--b1);color:var(--text);}
.sb-item.active{background:var(--gold3);color:var(--text);border:1px solid rgba(201,169,110,0.1);}
.sb-left{display:flex;align-items:center;gap:8px;}
.sb-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.cnt{background:var(--s3);color:var(--t2);font-size:10px;font-weight:600;padding:1px 7px;border-radius:10px;min-width:20px;text-align:center;}
.sb-item.active .cnt{background:var(--gold2);color:var(--gold);}
.sb-div{height:1px;background:var(--b1);margin:6px 0;}
.sb-foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--b1);}
.lout{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--r2);color:var(--t3);cursor:pointer;font-size:12px;transition:all 0.12s;}
.lout:hover{color:var(--red);background:rgba(248,113,113,0.06);}

/* LEADS PANEL */
.leads-panel{width:340px;border-right:1px solid var(--b1);display:flex;flex-direction:column;flex-shrink:0;}
.lhdr{padding:12px 14px 10px;border-bottom:1px solid var(--b1);background:rgba(15,18,25,0.4);}
.lhdr-top{display:flex;align-items:center;justify-content:space-between;}
.ltitle{font-size:12px;font-weight:600;color:var(--text);}
.lcnt{font-size:11px;color:var(--t3);}
.lscroll{flex:1;overflow-y:auto;padding:6px;}

/* LEAD CARD */
.lcard{padding:11px 13px;border-radius:var(--r2);cursor:pointer;transition:all 0.12s;border:1px solid transparent;margin-bottom:3px;position:relative;background:transparent;}
.lcard:hover{background:var(--s2);border-color:var(--b1);}
.lcard.active{background:var(--s2);border-color:var(--b2);box-shadow:0 2px 12px rgba(0,0,0,0.3);}
.lcard.active::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--gold);border-radius:0 2px 2px 0;box-shadow:0 0 8px rgba(201,169,110,0.4);}
.ct{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.cname{font-size:13px;font-weight:600;color:var(--text);}
.ctime{font-size:10px;color:var(--t3);}
.cmid{display:flex;align-items:center;gap:5px;margin-bottom:5px;}
.cphone{font-size:11px;color:var(--t3);}
.cproc{font-size:11px;color:var(--t2);font-weight:500;}
.csep{color:var(--t3);font-size:10px;}
.cbot{display:flex;align-items:center;justify-content:space-between;}
.ccity{font-size:11px;color:var(--t3);}

/* PILL */
.pill{font-size:10px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap;}
.p-novo{background:rgba(34,197,94,0.1);color:#22c55e;}
.p-em_conversa{background:rgba(96,165,250,0.1);color:#60a5fa;}
.p-handoff{background:rgba(251,146,60,0.1);color:#fb923c;}
.p-agendado{background:rgba(192,132,252,0.1);color:#c084fc;}
.p-perdido{background:rgba(248,113,113,0.1);color:#f87171;}

/* QUICK ACTIONS */
.qas{display:none;position:absolute;right:10px;top:10px;gap:3px;}
.lcard:hover .qas{display:flex;}
.lcard:hover .ctime{display:none;}
.qa{width:24px;height:24px;background:var(--s3);border:1px solid var(--b2);border-radius:5px;color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all 0.1s;}
.qa:hover{color:var(--gold);border-color:rgba(201,169,110,0.3);box-shadow:0 0 8px rgba(201,169,110,0.15);}

/* DETAIL */
.detail-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.empty-det{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--t3);gap:12px;}
.empty-logo{width:80px;height:80px;border-radius:50%;object-fit:cover;opacity:0.15;filter:grayscale(1);}
.empty-txt{font-size:12px;}

/* DETAIL HEADER */
.dhdr{padding:14px 22px 12px;border-bottom:1px solid var(--b1);background:rgba(15,18,25,0.4);display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-shrink:0;}
.dname{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:400;color:var(--text);margin-bottom:5px;}
.dsub{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.dphone{font-size:11px;color:var(--t2);}
.dacts{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.abtn{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--r3);font-size:12px;font-weight:500;cursor:pointer;transition:all 0.15s;border:1px solid var(--b2);background:var(--s2);color:var(--t2);text-decoration:none;font-family:'Plus Jakarta Sans',sans-serif;}
.abtn:hover{color:var(--text);background:var(--s3);}
.abtn.green{background:rgba(34,197,94,0.1);color:#22c55e;border-color:rgba(34,197,94,0.2);}
.abtn.green:hover{background:rgba(34,197,94,0.16);}

/* STATUS DD */
.sdd{position:relative;}
.strig{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:var(--r3);border:1px solid var(--b2);background:var(--s2);cursor:pointer;font-size:12px;font-weight:500;color:var(--text);transition:all 0.12s;user-select:none;font-family:'Plus Jakarta Sans',sans-serif;}
.strig:hover{border-color:rgba(201,169,110,0.4);box-shadow:var(--glow);}
.smenu{position:absolute;top:calc(100% + 6px);left:0;background:var(--s2);border:1px solid var(--b2);border-radius:var(--r2);overflow:hidden;z-index:200;min-width:155px;box-shadow:0 12px 40px rgba(0,0,0,0.5);display:none;backdrop-filter:blur(16px);}
.smenu.open{display:block;}
.sopt{display:flex;align-items:center;gap:9px;padding:9px 14px;cursor:pointer;font-size:12px;color:var(--text);transition:background 0.1s;font-family:'Plus Jakarta Sans',sans-serif;}
.sopt:hover{background:var(--s3);}

/* DETAIL BODY */
.dbody{display:flex;flex:1;overflow:hidden;min-height:0;}
.info-panel{width:240px;border-right:1px solid var(--b1);padding:14px;overflow-y:auto;flex-shrink:0;}
.isec{margin-bottom:18px;}
.isec-title{font-size:9.5px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--t3);margin-bottom:10px;}
.ifield{margin-bottom:10px;}
.ilabel{font-size:10px;font-weight:500;color:var(--t3);margin-bottom:3px;text-transform:uppercase;letter-spacing:0.05em;}
.ival{font-size:12px;color:var(--text);}
.ival.empty{color:var(--t3);font-style:italic;}
.cpylink{font-size:11px;color:var(--t3);cursor:pointer;background:none;border:none;padding:0;transition:color 0.12s;font-family:'Plus Jakarta Sans',sans-serif;}
.cpylink:hover{color:var(--gold);}
.wabtn{display:flex;align-items:center;gap:6px;padding:8px 12px;background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.18);border-radius:var(--r3);color:#22c55e;font-size:12px;font-weight:500;cursor:pointer;transition:all 0.15s;width:100%;justify-content:center;text-decoration:none;margin-top:6px;font-family:'Plus Jakarta Sans',sans-serif;}
.wabtn:hover{background:rgba(34,197,94,0.14);}

/* CHAT */
.chat-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;}
.chdr{padding:11px 20px;border-bottom:1px solid var(--b1);font-size:9.5px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--t3);background:rgba(15,18,25,0.3);display:flex;align-items:center;justify-content:space-between;}
.cscroll{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:10px;}
.mrow{display:flex;gap:8px;align-items:flex-end;}
.mrow.from-layla{flex-direction:row-reverse;}
.mav{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;}
.mav.lead-av{background:var(--s3);color:var(--t2);}
.mav.layla-av{overflow:hidden;}
.mav.layla-av img{width:100%;height:100%;object-fit:cover;}
.mcontent{max-width:70%;}
.mbubble{padding:10px 14px;font-size:12px;line-height:1.65;border-radius:16px;word-break:break-word;}
.from-lead .mbubble{background:var(--s2);color:var(--text);border-radius:16px 16px 16px 4px;border:1px solid var(--b1);}
.from-layla .mbubble{background:rgba(201,169,110,0.08);color:var(--text);border:1px solid rgba(201,169,110,0.12);border-radius:16px 16px 4px 16px;box-shadow:0 2px 12px rgba(201,169,110,0.06);}
.mtime{font-size:10px;color:var(--t3);margin-top:3px;padding:0 2px;}
.from-layla .mtime{text-align:right;}
.cempty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:12px;}
.nodata{padding:32px 20px;text-align:center;color:var(--t3);font-size:12px;}
/* SEND BAR */
.send-bar{padding:12px 16px;border-top:1px solid var(--b1);background:rgba(15,18,25,0.5);display:flex;align-items:flex-end;gap:10px;flex-shrink:0;}
.send-input{flex:1;background:var(--s2);border:1px solid var(--b2);color:var(--text);padding:10px 14px;border-radius:12px;font-family:"Plus Jakarta Sans",sans-serif;font-size:12px;outline:none;resize:none;min-height:40px;max-height:120px;line-height:1.5;transition:border-color 0.15s,box-shadow 0.15s;}
.send-input:focus{border-color:rgba(201,169,110,0.4);box-shadow:0 0 0 3px rgba(201,169,110,0.06);}
.send-input::placeholder{color:var(--t3);}
.send-btn{width:38px;height:38px;background:linear-gradient(135deg,#c9a96e,#a07840);border:none;border-radius:10px;color:#080a10;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;transition:opacity 0.15s,transform 0.1s,box-shadow 0.15s;box-shadow:0 4px 14px rgba(201,169,110,0.3);}
.send-btn:hover{opacity:0.88;transform:translateY(-1px);}
.send-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--s3);border:1px solid var(--b2);color:var(--text);font-size:12px;padding:10px 18px;border-radius:var(--r2);box-shadow:0 8px 32px rgba(0,0,0,0.4);display:none;z-index:1000;backdrop-filter:blur(12px);font-family:'Plus Jakarta Sans',sans-serif;}
</style>
</head>

<script>
const SU='https://lzpivblsxnifneqlbagu.supabase.co';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6cGl2YmxzeG5pZm5lcWxiYWd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNTIxMTEsImV4cCI6MjA5MDcyODExMX0.K9XAJJYx22q4b51c2TTeL-Fy9m4ouH3df6Frq5aywCs';
const US={patrick:'5essencia',cristiane:'5essencia',gibran:'5essencia'};
let leads=[],filter='todos',selId=null;

function doLogin(){
  const u=document.getElementById('lu').value.trim().toLowerCase();
  const p=document.getElementById('lp').value;
  if(US[u]&&US[u]===p){
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app').style.display='flex';
    loadLeads();
  } else {
    document.getElementById('lerr').style.display='block';
  }
}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.getElementById('login-screen').style.display!=='none')doLogin();});
function doLogout(){document.getElementById('login-screen').style.display='flex';document.getElementById('app').style.display='none';leads=[];selId=null;}

async function api(path,opts={}){
  const r=await fetch(`${SU}/rest/v1/${path}`,{...opts,headers:{apikey:SK,Authorization:`Bearer ${SK}`,'Content-Type':'application/json',Prefer:'return=representation',...(opts.headers||{})}});
  if(!r.ok)throw new Error(await r.text());
  const t=await r.text();return t?JSON.parse(t):null;
}

async function loadLeads(){
  try{
    const d=await api('leads?order=updated_at.desc');
    leads=d||[];updateCnts();renderLeads();
    if(selId){const l=leads.find(x=>x.id===selId);if(l)renderDetail(l);}
  }catch(e){document.getElementById('llist').innerHTML='<div class="nodata">erro ao carregar</div>';}
}

function updateCnts(){
  const c={todos:leads.length,novo:0,em_conversa:0,handoff:0,agendado:0,perdido:0};
  leads.forEach(l=>{if(c[l.status]!==undefined)c[l.status]++;});
  Object.keys(c).forEach(k=>{const e=document.getElementById('cnt-'+k);if(e)e.textContent=c[k];});
}

function setTab(el,f){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');filter=f;
  document.querySelectorAll('.sb-item').forEach(s=>s.classList.remove('active'));
  const sb=document.getElementById('sb-'+f);if(sb)sb.classList.add('active');
  renderLeads();
}
function setSb(el,f){
  document.querySelectorAll('.sb-item').forEach(s=>s.classList.remove('active'));
  el.classList.add('active');filter=f;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  renderLeads();
}

function cn(n){return(n||'Lead').replace(/^=/,'').trim()||'Lead';}
function fp(p){if(!p)return'—';const n=p.replace(/\D/g,'');if(n.length>=12)return`+${n.slice(0,2)} (${n.slice(2,4)}) ${n.slice(4,9)}-${n.slice(9)}`;return p;}
function fd(d){if(!d)return'';const dt=new Date(d),now=new Date(),diff=now-dt;if(diff<60000)return'agora';if(diff<3600000)return Math.floor(diff/60000)+'m';if(diff<86400000)return Math.floor(diff/3600000)+'h';return dt.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});}
function sl(s){return{novo:'Novo',em_conversa:'Conversa',handoff:'Handoff',agendado:'Agendado',perdido:'Perdido'}[s]||s;}
function sc(s){return{novo:'#22c55e',em_conversa:'#60a5fa',handoff:'#fb923c',agendado:'#c084fc',perdido:'#f87171'}[s]||'#64748b';}

function renderLeads(){
  const q=document.getElementById('si').value.toLowerCase();
  let ls=leads;
  if(filter!=='todos')ls=ls.filter(l=>l.status===filter);
  if(q)ls=ls.filter(l=>cn(l.nome).toLowerCase().includes(q)||(l.telefone||'').includes(q)||(l.procedimento||'').toLowerCase().includes(q)||(l.cidade||'').toLowerCase().includes(q));
  document.getElementById('lcnt').textContent=`${ls.length} lead${ls.length!==1?'s':''}`;
  const el=document.getElementById('llist');
  if(!ls.length){el.innerHTML='<div class="nodata">Nenhum lead encontrado</div>';return;}
  el.innerHTML=ls.map(l=>{
    const name=cn(l.nome),phone=fp(l.telefone),time=fd(l.updated_at||l.created_at),active=l.id===selId?'active':'';
    return`<div class="lcard ${active}" onclick="selLead('${l.id}')">
      <div class="qas">
        <div class="qa" onclick="event.stopPropagation();cpNum('${l.telefone}')" title="Copiar">📋</div>
        <div class="qa" onclick="event.stopPropagation();openWA('${l.telefone}')" title="WhatsApp">💬</div>
        <div class="qa" onclick="event.stopPropagation();nextSt('${l.id}')" title="Próximo status">⚡</div>
      </div>
      <div class="ct"><div class="cname">${name}</div><div class="ctime">${time}</div></div>
      <div class="cmid"><div class="cphone">${phone}</div>${l.procedimento?`<span class="csep">·</span><div class="cproc">${l.procedimento}</div>`:''}</div>
      <div class="cbot"><div class="ccity">${l.cidade||''}</div><span class="pill p-${l.status}">${sl(l.status)}</span></div>
    </div>`;
  }).join('');
}

async function selLead(id){
  selId=id;renderLeads();
  const l=leads.find(x=>x.id===id);if(!l)return;
  renderDetail(l);await loadChat(l.telefone);
}

    <div class="dhdr">
      <div>
        <div class="dname">${name}</div>

        <div class="isec">
          <div class="isec-title">Contato</div>

            <div style="display:flex;align-items:center;gap:8px;">

            </div>
          </div>
          <a href="https://wa.me/${raw}" target="_blank" class="wabtn">💬 Abrir no WhatsApp</a>
        </div>
        <div class="isec">
          <div class="isec-title">Interesse</div>
          <div class="ifield"><div class="ilabel">Procedimento</div><div class="ival ${!lead.procedimento?'empty':''}">${lead.procedimento||'não informado'}</div></div>
          <div class="ifield"><div class="ilabel">Cidade</div><div class="ival ${!lead.cidade?'empty':''}">${lead.cidade||'não informada'}</div></div>
          <div class="ifield"><div class="ilabel">Consulta</div><div class="ival ${!lead.consulta?'empty':''}">${lead.consulta||'não definido'}</div></div>
        </div>
        ${lead.resumo?`<div class="isec"><div class="isec-title">Resumo da Layla</div><div class="ival" style="font-size:11px;line-height:1.6;color:var(--t2)">${lead.resumo}</div></div>`:''}
      </div>
      <div class="chat-panel">
        <div class="chdr">
          <span>Histórico da conversa</span>
        </div>
        <div class="cscroll" id="cscroll"><div class="cempty">carregando...</div></div>
        <div class="send-bar">
          <textarea class="send-input" id="send-input" placeholder="Digite uma mensagem..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
          <button class="send-btn" id="send-btn" onclick="sendMsg()" title="Enviar">➤</button>
        </div>
      </div>
    </div>`;
}

async function loadChat(tel){
  const raw=(tel||'').replace(/\D/g,'');
  const el=document.getElementById('cscroll');if(!el)return;
  try{
    const msgs=await api(`mensagens?telefone=eq.${encodeURIComponent(raw)}&order=created_at.asc`);
    if(!msgs||!msgs.length){el.innerHTML='<div class="cempty">sem histórico de mensagens</div>';return;}
    // Deduplicar por conteudo+tempo
    const seen=new Set();
    const unique=msgs.filter(m=>{const k=m.de+'|'+m.mensagem+'|'+m.created_at.slice(0,16);if(seen.has(k))return false;seen.add(k);return true;});
    el.innerHTML=unique.map(m=>{
      const isL=m.de==='layla';
      const t=new Date(m.created_at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
      const avContent=isL?`<img src="${LOGO_SRC}" style="width:100%;height:100%;object-fit:cover;">`:(m.mensagem?.[0]||'?').toUpperCase();
      return`<div class="mrow from-${m.de}">
        <div class="mav ${isL?'layla-av':'lead-av'}">${avContent}</div>
        <div class="mcontent"><div class="mbubble">${m.mensagem||''}</div><div class="mtime">${t}</div></div>
      </div>`;
    }).join('');
    el.scrollTop=el.scrollHeight;
  }catch(e){if(el)el.innerHTML='<div class="cempty">erro ao carregar</div>';}
}

async function chSt(id,status){
  try{
    await api(`leads?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({status,updated_at:new Date().toISOString()})});
    const l=leads.find(x=>x.id===id);if(l){l.status=status;l.updated_at=new Date().toISOString();}
    updateCnts();renderLeads();renderDetail(l);loadChat(l.telefone);
    document.getElementById('smenu')?.classList.remove('open');
    toast('Status atualizado');
  }catch(e){}
}

async function nextSt(id){
  const l=leads.find(x=>x.id===id);if(!l)return;
  const s=['novo','em_conversa','handoff','agendado','perdido'];
  await chSt(id,s[(s.indexOf(l.status)+1)%s.length]);
}

function toggleSm(){document.getElementById('smenu')?.classList.toggle('open');}
document.addEventListener('click',e=>{const d=document.getElementById('sdd');if(d&&!d.contains(e.target))document.getElementById('smenu')?.classList.remove('open');});
function cpNum(p){navigator.clipboard?.writeText((p||'').replace(/\D/g,''));toast('Número copiado!');}
function openWA(p){window.open(`https://wa.me/${(p||'').replace(/\D/g,'')}`, '_blank');}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>{t.style.display='none';},2000);}
setInterval(loadLeads,30000);
const N8N_SEND_URL='https://quintessencia.app.n8n.cloud/webhook/crm-envio';

async function sendMsg(){
  const input=document.getElementById('send-input');
  const btn=document.getElementById('send-btn');
  if(!input||!selId)return;
  const msg=input.value.trim();
  if(!msg)return;
  const lead=leads.find(x=>x.id===selId);
  if(!lead)return;
  const raw=(lead.telefone||'').replace(/\D/g,'');
  btn.disabled=true;btn.textContent='⏳';
  try{
    await fetch(N8N_SEND_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({telefone:raw,mensagem:msg})});
    input.value='';input.style.height='40px';
    toast('Mensagem enviada!');
    setTimeout(()=>loadChat(lead.telefone),1500);
  }catch(e){toast('Erro ao enviar mensagem');}
  btn.disabled=false;btn.textContent='➤';
}

function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px';}

</script>
